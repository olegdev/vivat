<!-- ==================== МОДУЛИ СТРОКИ ЗАКАЗА ==========================
     The комплектация of one cart line, in the two places the dealer order page
     shows it:

       · 1440 — inside the card itself, which grows 158 → 260 (`card
         customer=b2b, condition=edit` 953:152360, rows 953:152907);
       · 360 — a bottom sheet over the page (2225:201034): the kitchen's name,
         the same rows, and «Применить».

     One <template> serves both. The row reads [title][stepper][price] on 1440
     and stacks to title over [price][stepper] on 360, which is the same
     `flex-row-reverse` trick the card itself uses — the DOM stays in desktop
     order and the mobile rule turns the pair round.

     components/order-modules.js clones the row; it never builds markup. -->
<template data-module-row>
  <div
    class="flex items-center gap-6 md:h-10 max-md:flex-col max-md:items-stretch max-md:gap-2 max-md:border-b max-md:border-divider-soft max-md:px-4 max-md:py-3 max-md:last:border-b-0"
    data-module-line
  >
    <p
      class="min-w-0 flex-1 truncate text-body-n text-text-secondary max-md:whitespace-normal max-md:text-m-body-l max-md:text-text-primary"
      data-module-title
    ></p>

    <!-- Цена СЛЕВА от степпера на обеих ширинах: `counter+price` 242 = 74 + 16
         + 152 на 1440 (953:152535) и 328 с полями 16 на 360 (2225:202145), и
         там и там степпер прижат к правому краю. На 1440 это правый край самой
         карточки, а не её степпера: блок модулей живёт в текстовой колонке 740,
         поэтому «+» модуля приходится под цену карточки, а не под её «+». -->
    <div class="flex items-center gap-4 md:w-[242px] md:shrink-0 max-md:justify-between max-md:gap-3">
      <!-- 74 с выключкой вправо (953:152537); ниже `md` цена хагом слева -->
      <span
        class="text-right text-body-n text-text-secondary md:w-[74px] md:shrink-0 max-md:text-m-h4 max-md:text-text-primary"
        data-module-price
      ></span>

      <!-- transparent stepper: no pill on either width here (953:152844 /
           2225:202146), only the number's box comes back below `md`.
           Число тёмное на обеих ширинах (953:152667 / 2029:129548, #292929).
           Глифы — РАЗНЫЕ наборы, и это тот же набор, что у карточки заказа:
           1440 — «+» и «−» Bold secondary (953:152907 весь список так), 360 —
           Thin, причём «+» ТЁМНЫЙ, а мусорка/минус серые (2029:129546, тот же
           мастер стоит в мобильной карточке 2084:145513 и в строках шторки
           2225:202061/202062).
           152 = 4 + 40 + 4 + 56 + 4 + 40 + 4; ниже `md` число 48 (2029:129548) -->
      <div class="group/mstep flex w-[152px] shrink-0 items-center justify-between px-1" data-module-stepper data-count="many">
        <!-- Левая кнопка — мусорка при count=1 и минус при 2 и больше, как в
             карточке заказа. Все четыре глифа лежат в разметке, выбирает CSS по
             `data-count`, который пишет скрипт: подмена `src` из JS не пережила
             бы смену ширины. -->
        <button
          type="button"
          class="flex size-10 items-center justify-center rounded-full transition-colors hover:bg-components-subtle"
          data-module-down
          aria-label="Уменьшить количество"
        >
          <img
            src="../../assets/order/icon-trash-muted.svg"
            alt=""
            class="hidden size-6 group-data-[count=one]/mstep:block max-md:group-data-[count=one]/mstep:hidden"
          />
          <img
            src="../../assets/order/icon-trash-thin.svg"
            alt=""
            class="hidden size-6 max-md:group-data-[count=one]/mstep:block"
          />
          <img
            src="../../assets/order/icon-minus-muted.svg"
            alt=""
            class="block size-6 group-data-[count=one]/mstep:hidden max-md:hidden"
          />
          <img
            src="../../assets/order/icon-minus-thin.svg"
            alt=""
            class="hidden size-6 max-md:block max-md:group-data-[count=one]/mstep:hidden"
          />
        </button>
        <span
          class="flex h-10 w-12 items-center justify-center text-body-n text-text-primary md:w-14 max-md:rounded-n max-md:border max-md:border-border-light max-md:bg-surface-inverted max-md:text-m-body-n max-md:text-text-primary"
          data-module-qty
        >1</span>
        <button
          type="button"
          class="flex size-10 items-center justify-center rounded-full transition-colors hover:bg-components-subtle"
          data-module-up
          aria-label="Увеличить количество"
        >
          <img src="../../assets/order/icon-plus-muted.svg" alt="" class="size-6 max-md:hidden" />
          <img src="../../assets/order/icon-plus-thin.svg" alt="" class="hidden size-6 max-md:block" />
        </button>
      </div>
    </div>
  </div>
</template>

<!-- ---- the 360 sheet (2225:201034) ------------------------------------
     Оболочка общая для всех окон сайта — `.modal-scrim` + `.modal-panel`:
     отсюда скругление верхних углов и отступ под тапбар. Шапка 56 (поля 16,
     отбивки 4) с заголовком 22/26 и крестиком 40×40 у правого края, под ней
     линия #e7e7e7 (2225:201441 — заливка белая, обводка есть); затем строки и
     тёмная кнопка во всю ширину в баре 60, том же, что у страницы. Перетягивания
     нет — кадр рисует одну высоту и ни одного жеста, в отличие от шторки
     салонов. -->
<!-- До самого низа экрана: в кадре 2225:201034 панель `left-side` 360×404
     стоит на y=396 и кончается на 800, то есть накрывает и тапбар. Резерв в 72
     здесь был ошибкой чтения. -->
<div class="modal-scrim md:hidden" data-modules-sheet>
  <div class="absolute inset-0" data-modules-close></div>

  <div class="modal-panel relative flex max-h-[85vh] flex-col">
    <div class="flex h-14 shrink-0 items-center gap-2 border-b border-divider-light px-4 py-2">
      <p class="min-w-0 flex-1 truncate text-m-h2 text-text-primary" data-modules-title></p>
      <button type="button" class="flex size-10 shrink-0 items-center justify-center" data-modules-close aria-label="Закрыть">
        <img src="../../assets/header/icon-close-s.svg" alt="" class="size-6" />
      </button>
    </div>

    <div class="min-h-0 flex-1 overflow-y-auto" data-modules-sheet-list></div>

    <div class="flex h-[60px] shrink-0 items-center px-4 py-2">
      <button type="button" class="btn btn-m btn-primary w-full text-m-button-m" data-modules-apply>
        Применить
      </button>
    </div>
  </div>
</div>
