<!-- ==================== SITE HEADER (mobile) ======================= -->
<!-- Figma site-header 1720:160779, device "mobile v1": utility strip on a
     subtle fill, then burger / centred logo / profile. -->
<header class="md:hidden">
  <div class="flex h-[38px] items-center justify-between bg-surface-subtle px-4">
    <a class="flex items-center gap-1" href="#">
      <span class="text-m-body-n text-text-primary underline decoration-dotted underline-offset-2"
        >Москва</span
      >
      <img src="../../assets/header/icon-pin-20.svg" alt="" class="size-5" />
    </a>
    <a class="text-m-body-n text-text-primary underline decoration-from-font underline-offset-2" href="#"
      >Стать дилером</a
    >
  </div>
  <div class="flex h-[60px] items-center justify-between px-4">
    <button
      class="flex size-10 items-center justify-center rounded-pill"
      data-mobile-menu
      aria-label="Меню"
      aria-expanded="false"
    >
      <img src="../../assets/header/icon-burger-bold.svg" alt="" class="size-6" />
    </button>
    <a href="main.html" class="flex h-10 flex-col items-center justify-center gap-[5px]">
      <img src="../../assets/header/logo.svg" alt="VIVAT" class="h-[22px] w-[99px]" />
      <span class="text-[9px] font-medium uppercase leading-none text-icon-primary"
        >фабрика мебели. Официальный сайт</span
      >
    </a>
    <button class="flex size-10 items-center justify-center rounded-pill" aria-label="Профиль">
      <img src="../../assets/header/icon-profile.svg" alt="" class="size-6" />
    </button>
  </div>
</header>

<!-- ==================== SITE HEADER (desktop) ====================== -->
<header class="flex flex-col gap-4 pb-3 max-md:hidden">
  <div class="flex flex-col gap-3">
    <!-- top utility bar -->
    <div
      class="flex h-11 w-[1440px] items-center justify-between border-b border-divider-soft px-10"
    >
      <div class="flex items-center gap-3">
        <a class="flex items-center gap-1" href="#">
          <span
            class="text-body-s text-text-primary underline decoration-dotted underline-offset-2"
            >Москва</span
          >
          <img src="../../assets/header/icon-pin.svg" alt="" class="size-4" />
        </a>
        <a class="text-body-s-accent text-text-primary" href="tel:+74951356565"
          >+7 (495) 135-65-65</a
        >
      </div>
      <!-- Signed-out (customer) utility links. `header-dealer` 586:57341,
           property-1=default — the plain "Войти в режим дилера" pill. -->
      <div class="flex items-center gap-6 group-data-[user=dealer]:hidden">
        <a class="text-body-s-accent text-text-link-highlighted" href="#"
          >Стать дилером</a
        >
        <a class="text-body-s-accent text-text-primary" href="#">Для бизнеса</a>
        <a class="flex items-center gap-1 text-body-s-accent text-text-primary" href="#"
          >Войти в режим дилера
          <img src="../../assets/header/icon-arrow-right.svg" alt="" class="size-4" />
        </a>
      </div>

      <!-- Signed-in dealer strip — `header-dealer` 586:57343, property-1=variant2.
           Same component, third variant: a dark bar that replaces the utility
           links. It is rounded on the LEFT only (32px) and runs flush to the
           right edge of the 1440 canvas, so it breaks the row's px-10 padding
           with -mr-10. Shown by `data-user="dealer"` on <body> — the same
           technique as the order page's `data-step`; in Blade it is the
           @if($user === 'dealer') branch of this include. -->
      <div
        class="-mr-10 hidden h-11 items-center gap-6 rounded-l-[32px] bg-components-strong pl-6 pr-10 group-data-[user=dealer]:flex"
      >
        <!-- price visibility. Behaviour lives in components/dealer-header.js;
             the design has no prototype on it, so it only reflects its own
             state until the client confirms what it should hide. -->
        <button
          type="button"
          role="switch"
          aria-checked="true"
          data-dealer-price-toggle
          class="group/sw flex shrink-0 items-center gap-3"
        >
          <span
            class="flex h-6 w-10 items-center rounded-pill bg-surface-raised p-0.5 transition-colors"
          >
            <span
              class="size-5 translate-x-0 rounded-pill bg-components-strong transition-transform group-aria-[checked=true]/sw:translate-x-4"
              data-dealer-price-knob
            ></span>
          </span>
          <span class="whitespace-nowrap text-body-s-accent text-text-inverse-secondary"
            >Показывать цену</span
          >
        </button>

        <!-- price list selector — `dropdown-header` 607:26932. Options come
             from data/dealer-home.js; wiring is dealer-header.js. -->
        <div class="relative shrink-0" data-dealer-pricelist>
          <button
            type="button"
            class="flex items-center gap-0.5 text-body-n-accent text-text-inverse-primary"
            aria-expanded="false"
            aria-haspopup="listbox"
          >
            <span data-dealer-pricelist-label>Оптовая цена</span>
            <img src="../../assets/header/chevron-down-light.svg" alt="" class="size-6" />
          </button>
          <div
            data-dealer-pricelist-menu
            role="listbox"
            class="absolute left-0 top-7 z-50 hidden w-[328px] rounded-[var(--radius-l)] bg-bg-page py-2 shadow-dropdown"
          ></div>
        </div>

        <span class="flex-1"></span>

        <a class="shrink-0 text-body-s-accent text-text-link-highlighted" href="#">Для бизнеса</a>
        <a class="flex shrink-0 items-center gap-1 text-body-s-accent text-text-inverse-primary" href="#"
          >Мой кабинет
          <img src="../../assets/header/icon-arrow-right-light.svg" alt="" class="size-4" />
        </a>
        <!-- TODO(design): the strip ends with a 63px `text-action` (607:27603)
             whose label is the component's filler ("56 моделей") — the real
             copy is not in the export. Left out rather than invented; see
             docs/FIGMA-MAP.md › вопросы. -->
      </div>
    </div>

    <!-- main nav bar -->
    <div class="flex items-center justify-between px-10">
      <div class="flex items-center gap-16">
        <div class="flex items-center gap-10">
          <!-- logo -->
          <a href="main.html" class="flex h-12 w-[169px] flex-col items-center justify-center gap-0.5">
            <img src="../../assets/header/logo.svg" alt="VIVAT" class="h-[34px] w-[153px]" />
            <span class="w-full text-center text-[8px] font-medium uppercase text-icon-primary"
              >фабрика мебели. Официальный сайт</span
            >
          </a>
          <!-- menu -->
          <nav class="flex items-center gap-2">
            <button
              class="btn btn-m btn-accent"
              data-catalog-toggle
              aria-expanded="false"
            >
              <img src="../../assets/header/icon-burger.svg" alt="" class="size-6" data-catalog-icon />
              <span class="text-button-m text-text-inverse-primary">Весь каталог</span>
            </button>
            <a href="catalog.html" class="btn btn-m btn-ghost">Кухни</a>
            <a href="action.html" class="btn btn-m btn-ghost">Акции</a>
            <a href="#" class="btn btn-m btn-ghost">Где купить</a>
          </nav>
        </div>
        <!-- search — a real GET form; `name="q"` is the query contract the Blade
             /search route reads. Behaviour (submit + autocomplete seam) is in
             components/search.js; see BACKLOG.md / SOLUTIONS.md. -->
        <form
          data-search
          action="/search"
          method="get"
          role="search"
          class="flex h-11 w-[303px] items-center gap-4 rounded-pill bg-components-subtle px-4 py-2"
        >
          <input
            type="search"
            name="q"
            placeholder="Найти на сайте"
            autocomplete="off"
            class="min-w-0 flex-1 bg-transparent text-body-s-accent text-text-primary placeholder:text-text-muted focus:outline-none"
          />
          <button type="submit" aria-label="Найти" class="flex size-6 shrink-0 items-center justify-center">
            <img src="../../assets/header/icon-search.svg" alt="" class="size-6" />
          </button>
        </form>
      </div>
      <!-- order icon — count badge driven by components/cart.js. `icon-button`
           (450:13425) is a row [circle 44][badge 20] at gap -12, so the badge is
           an in-flow sibling and the control grows to 52 when it shows; the
           variant here is `design=dark`. See SOLUTIONS.md › "Badges are layout,
           not overlay". -->
      <button class="flex h-11 shrink-0 items-center" data-cart aria-label="Корзина">
        <span class="icon-btn">
          <img src="../../assets/header/icon-order-dark.svg" alt="" class="size-6" />
        </span>
        <span data-cart-count class="badge-number badge-number--dark -ml-3 hidden self-start">0</span>
      </button>
    </div>
  </div>
</header>
