<!-- ==================== SITE HEADER (mobile) ======================= -->
<!-- Figma site-header 1720:160779, device "mobile v1": utility strip on a
     subtle fill, then burger / centred logo / profile. -->
<header class="md:hidden">
  <div class="flex h-[38px] items-center justify-between bg-surface-subtle px-4">
    <button type="button" class="flex items-center gap-1" data-city-open aria-expanded="false">
      <span
        class="text-m-body-n text-text-primary link-dotted"
        data-city-label
        >Москва</span
      >
      <img src="../../assets/header/icon-pin-20.svg" alt="" class="size-5" />
    </button>
    <a
      class="text-m-body-n text-text-primary underline decoration-from-font underline-offset-2 group-data-[user=dealer]:hidden"
      href="#"
      data-modal-open="dealer-request"
      >Стать дилером</a
    >
    <!-- у дилера правый слот полоски — телефон (2225:163628) -->
    <a
      class="hidden text-m-body-n-accent text-text-primary group-data-[user=dealer]:block"
      href="tel:+74951356565"
      >+7 (495) 135-65-65</a
    >
  </div>

  <!-- Дилерский ряд — site-header 2225:163138, ряд `row` 1739:219449: 40px,
       слева выбор прайс-листа, справа тумблер. Порядок обратный десктопному —
       там тумблер первый, здесь подпись (1739:219406). -->
  <div
    class="hidden h-10 items-center justify-between bg-components-strong px-4 group-data-[user=dealer]:flex"
  >
    <button
      type="button"
      class="group/pt flex items-center gap-0.5 text-m-body-n text-text-inverse-primary"
      data-price-trigger
      data-price-sheet-trigger
      aria-expanded="false"
      aria-haspopup="dialog"
    >
      <span
        class="transition-colors group-data-[price-enabled=false]:text-text-inverse-muted"
        data-price-trigger-label
        >Оптовая цена</span
      >
      <img
        src="../../assets/header/chevron-down-light.svg"
        alt=""
        class="size-6 transition-[rotate,opacity] group-aria-[expanded=true]/pt:rotate-180 group-data-[price-enabled=false]:opacity-60"
      />
    </button>
    <button
      type="button"
      role="switch"
      aria-checked="true"
      data-dealer-price-toggle
      class="group/sw flex shrink-0 items-center gap-2"
    >
      <span class="whitespace-nowrap text-m-body-n text-text-inverse-primary">Показать цену</span>
      <span
        class="flex h-6 w-10 items-center rounded-pill bg-components-light p-0.5 transition-colors group-aria-[checked=true]/sw:bg-surface-raised"
      >
        <span
          class="size-5 translate-x-0 rounded-pill bg-components-disabled-inverted transition-[translate,background-color] group-aria-[checked=true]/sw:translate-x-4 group-aria-[checked=true]/sw:bg-components-strong"
          data-dealer-price-knob
        ></span>
      </span>
    </button>
  </div>

  <div class="flex h-[60px] items-center justify-between border-b border-divider-light px-4">
    <button
      class="flex size-10 items-center justify-center rounded-pill"
      data-mobile-menu
      aria-label="Меню"
      aria-expanded="false"
    >
      <img src="../../assets/header/icon-burger-bold.svg" alt="" class="size-6" />
    </button>
    <a href="main.html" class="flex h-10 flex-col items-center justify-center gap-[5px]">
      <img src="../../assets/header/logo.svg" alt="VIVAT" class="h-[22px] w-[99px]" />
      <span class="text-[9px] font-medium uppercase leading-none text-icon-primary"
        >фабрика мебели. Официальный сайт</span
      >
    </a>
    <button class="flex size-10 items-center justify-center rounded-pill" aria-label="Профиль">
      <img src="../../assets/header/icon-profile.svg" alt="" class="size-6" />
    </button>
  </div>
</header>

<!-- ==================== SITE HEADER (desktop) ====================== -->
<!-- Одна шапка на десктоп и планшет. Верхняя служебная строка у них общая —
     содержимое совпадает буквально, меняются только поля (40 → 24) — а нижний
     ряд разный, поэтому их два и каждый прячется вариантом. Планшетный
     оригинал: site-header `device=tablet, type=b2c` 2477:180969, 768x108 =
     44 + 64, без зазора между рядами и без нижнего отступа. -->
<header class="page-max flex flex-col gap-4 pb-3 max-md:hidden max-xl:gap-0 max-xl:pb-0">
  <div class="flex flex-col gap-3 max-xl:gap-0">
    <!-- top utility bar -->
    <!-- Разделительная линия идёт во всю ширину окна, а содержимое упирается
         в 1900 — отсюда вложенная пара вместо одного div. Это же построение
         повторяют все блоки с фоновой полосой. -->
    <div class="border-b border-divider-soft">
      <div class="page-x flex h-11 items-center justify-between">
      <div class="flex items-center gap-3">
        <!-- «Москва» — селектор: выше `md` открывает выпадашку рядом с собой,
             ниже — общий лист. Меню лежит здесь, а не в партиале выбора города,
             потому что позиционируется от триггера — тем же приёмом, что
             дилерская панель прайс-листа. -->
        <div class="relative">
          <button type="button" class="flex items-center gap-1" data-city-open aria-expanded="false">
            <span
              class="text-body-s text-text-primary link-dotted"
              data-city-label
              >Москва</span
            >
            <img src="../../assets/header/icon-pin.svg" alt="" class="size-6 -m-1" />
          </button>
          <div
            class="absolute left-0 top-8 z-50 hidden max-h-80 w-[280px] overflow-y-auto rounded-[var(--radius-l)] bg-surface-inverted py-2 shadow-dropdown"
            data-city-menu
          ></div>
        </div>
        <a class="text-body-s-accent text-text-primary" href="tel:+74951356565"
          >+7 (495) 135-65-65</a
        >
      </div>
      <div class="flex items-center gap-6 group-data-[user=dealer]:hidden">
        <a class="text-body-s-accent text-text-link-highlighted" href="#" data-modal-open="dealer-request"
          >Стать дилером</a
        >
        <a class="text-body-s-accent text-text-primary" href="../dealer/howto.html">Для бизнеса</a>
        <a class="flex items-center gap-1 text-body-s-accent text-text-primary" href="#" data-modal-open="dealer-login"
          >Войти в режим дилера
          <img src="../../assets/header/icon-arrow-right.svg" alt="" class="size-6 -m-1" />
        </a>
      </div>

      <!-- Dealer strip — `header-dealer` 586:57343 variant2, instanced at
           877:93261: fixed 1013x44, flush to the canvas edge. На планшете
           полоса уже — 501 (2477:181001) — и так же прижата к правому краю,
           радиус слева тот же 32. -->
      <div
        class="-mr-10 hidden h-11 w-[1013px] shrink-0 items-center gap-6 rounded-l-[32px] bg-components-strong px-6 group-data-[user=dealer]:flex max-xl:-mr-6 max-xl:w-[501px] max-xl:gap-6 max-xl:px-6"
      >
        <button
          type="button"
          role="switch"
          aria-checked="true"
          data-dealer-price-toggle
          class="group/sw flex shrink-0 items-center gap-3"
        >
          <!-- toggle 604:24616: on #cbcbcb/#292929, off #e7e7e7/#acacac,
               hover-off #d9d9d9/#707070 -->
          <span
            class="flex h-6 w-10 items-center rounded-pill bg-components-light p-0.5 transition-colors group-hover/sw:bg-components-light-hover group-aria-[checked=true]/sw:bg-surface-raised"
          >
            <span
              class="size-5 translate-x-0 rounded-pill bg-components-disabled-inverted transition-[translate,background-color] group-hover/sw:bg-components-disabled-inverted-hover group-aria-[checked=true]/sw:translate-x-4 group-aria-[checked=true]/sw:bg-components-strong"
              data-dealer-price-knob
            ></span>
          </span>
          <span class="whitespace-nowrap text-body-s-accent text-text-inverse-secondary"
            >Показывать цену</span
          >
        </button>

        <!-- `dropdown-header` 607:26932. Открытое состояние — вариант
             condition=open 1299:49518: панель 328 под триггером, строки 320x44.
             Строка списка клонируется из partials/price-mode.html. -->
        <div class="relative shrink-0">
          <button
            type="button"
            class="group/pt flex items-center gap-0.5 text-body-n-accent text-text-inverse-primary"
            data-price-trigger
            data-price-panel-trigger
            aria-expanded="false"
            aria-haspopup="listbox"
          >
            <span
              class="underline decoration-dotted decoration-1 underline-offset-4 transition-colors group-data-[price-enabled=false]:text-text-inverse-muted"
              data-price-trigger-label
              >Оптовая цена</span
            >
            <img
              src="../../assets/header/chevron-down-light.svg"
              alt=""
              class="size-6 transition-[rotate,opacity] group-aria-[expanded=true]/pt:rotate-180 group-data-[price-enabled=false]:opacity-60"
            />
          </button>
          <div
            class="absolute left-0 top-8 z-50 hidden w-[328px] rounded-[var(--radius-s)] bg-bg-page py-2 shadow-dropdown"
            data-price-panel
          >
            <div class="flex flex-col px-1" data-price-list></div>
            <div class="hidden px-1 pt-2" data-price-apply-row>
              <button type="button" class="btn btn-m btn-primary w-full" data-price-apply>
                <span>Применить</span>
              </button>
            </div>
          </div>
        </div>

        <span class="flex-1"></span>

        <!-- На планшете полоса уже (501 против 1013), и три хвостовые ссылки в
             неё не входят: во фрейме `dealer-menu2` 2490:151061 остаются только
             тумблер и выбор прайс-листа, а `for-business` схлопнут в 1px. -->
        <a class="shrink-0 text-body-s-accent text-text-link-highlighted max-xl:hidden" href="../dealer/howto.html">Для бизнеса</a>
        <a class="shrink-0 text-body-s-accent text-text-inverse-primary max-xl:hidden" href="#">Мой кабинет</a>

        <a class="shrink-0 text-body-s-accent text-text-inverse-primary max-xl:hidden" href="#">Выход</a>
      </div>
      </div>
    </div>

    <!-- ---- Нижний ряд, планшет (2477:181373, 768x64) --------------------
         Поля здесь 16, а не 24, как у строки выше, — это не описка макета, а
         его цифра, поэтому page-x тут не годится. Бургер слева, логотип по
         центру ОКНА (в макете 278 + 212/2 = 384 = 768/2, поэтому центрируем
         абсолютно, а не space-between: боковые группы разной ширины), справа
         поиск и профиль. Корзины в этом ряду нет — она в тапбаре. -->
    <div class="relative hidden h-16 items-center justify-between border-b border-divider-light px-4 max-xl:flex">
      <button
        class="flex h-8 w-10 items-center justify-center"
        data-mobile-menu
        aria-label="Меню"
        aria-expanded="false"
      >
        <img src="../../assets/header/icon-burger-bold.svg" alt="" class="size-6" />
      </button>

      <a
        href="main.html"
        class="absolute left-1/2 flex w-[212px] -translate-x-1/2 flex-col items-center gap-0.5"
      >
        <img src="../../assets/header/logo.svg" alt="VIVAT" class="h-[27px] w-[124px]" />
        <span
          class="w-full whitespace-nowrap text-center text-[9px] font-medium uppercase leading-4 tracking-[0.08em] text-icon-primary"
          >фабрика мебели. Официальный сайт</span
        >
      </a>

      <div class="flex items-center gap-4">
        <!-- Иконка поиска — такой же вход в оверлей, как поле у десктопа:
             components/search.js открывает его от любого [data-search]. -->
        <button
          type="button"
          class="flex h-8 w-10 items-center justify-center"
          data-search
          aria-label="Поиск"
        >
          <!-- тёмная, как и профиль рядом: во фрейме это `size=24 Bold,
               name=search, color=dark` (960:37194). Серая `icon-search.svg`
               остаётся у поля поиска на десктопе, где она и должна быть
               приглушённой. -->
          <img src="../../assets/header/icon-search-dark.svg" alt="" class="size-6" />
        </button>
        <button class="flex h-8 w-10 items-center justify-center" aria-label="Профиль">
          <img src="../../assets/header/icon-profile.svg" alt="" class="size-6" />
        </button>
      </div>
    </div>

    <!-- main nav bar -->
    <div class="page-x flex items-center justify-between max-xl:hidden">
      <div class="flex items-center gap-16">
        <div class="flex items-center gap-10">
          <!-- logo -->
          <a href="main.html" class="flex h-12 w-[169px] flex-col items-center justify-center gap-0.5">
            <img src="../../assets/header/logo.svg" alt="VIVAT" class="h-[34px] w-[153px]" />
            <span class="w-full text-center text-[8px] font-medium uppercase text-icon-primary"
              >фабрика мебели. Официальный сайт</span
            >
          </a>
          <!-- menu -->
          <nav class="flex items-center gap-2">
            <button
              class="btn btn-m btn-accent"
              data-catalog-toggle
              aria-expanded="false"
            >
              <img src="../../assets/header/icon-burger.svg" alt="" class="size-6" data-catalog-icon />
              <span class="text-button-m text-text-inverse-primary">Каталог</span>
            </button>
            <!-- Набор пунктов у покупателя и у дилера разный, и это разные
                 варианты одного компонента: menu-items 604:23352 у b2c
                 (Кухни / Акции / Где купить) и 607:27488 у b2b
                 (Конструктор / Контакты). «Весь каталог» общий. -->
            <a href="catalog.html" class="btn btn-m btn-ghost group-data-[user=dealer]:hidden">Кухни</a>
            <a href="action.html" class="btn btn-m btn-ghost group-data-[user=dealer]:hidden">Акции</a>
            <a href="main.html#where" class="btn btn-m btn-ghost group-data-[user=dealer]:hidden">Где купить</a>
            <a href="#" class="btn btn-m btn-ghost hidden group-data-[user=dealer]:flex">Конструктор</a>
            <a href="../dealer/contacts.html" class="btn btn-m btn-ghost hidden group-data-[user=dealer]:flex">Контакты</a>
          </nav>
        </div>
        <!-- search — a real GET form; `name="q"` is the query contract the Blade
             /search route reads. Behaviour (submit + autocomplete seam) is in
             components/search.js; see BACKLOG.md / SOLUTIONS.md. -->
        <form
          data-search
          action="/search"
          method="get"
          role="search"
          class="flex h-11 w-[303px] items-center gap-4 rounded-pill bg-components-subtle px-4 py-2"
        >
          <input
            type="search"
            name="q"
            placeholder="Найти на сайте"
            autocomplete="off"
            class="min-w-0 flex-1 bg-transparent text-body-s-accent text-text-primary placeholder:text-text-muted focus:outline-none"
          />
          <button type="submit" aria-label="Найти" class="flex size-6 shrink-0 items-center justify-center">
            <img src="../../assets/header/icon-search.svg" alt="" class="size-6" />
          </button>
        </form>
      </div>
      <!-- order icon — count badge driven by components/cart.js. `icon-button`
           (450:13425) is a row [circle 44][badge 20] at gap -12, so the badge is
           an in-flow sibling and the control grows to 52 when it shows; the
           variant here is `design=dark`. See SOLUTIONS.md › "Badges are layout,
           not overlay". -->
      <a href="order.html" class="flex h-11 shrink-0 items-center" data-cart aria-label="Корзина">
        <span class="icon-btn">
          <img src="../../assets/header/icon-order-dark.svg" alt="" class="size-6" />
        </span>
        <span data-cart-count class="badge-number badge-number--dark -ml-3 hidden self-start">0</span>
      </a>
    </div>
  </div>
</header>
