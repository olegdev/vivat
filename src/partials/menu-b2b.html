<!-- ==================== МЕНЮ ДИЛЕРСКОГО РАЗДЕЛА ======================
     Figma `menu-b2b` 1058:178109 — 298×776, #f8f8f8, padH=8 padV=16, зазор
     между блоками 12. Блок — заголовок плюс пункты, каждая строка 282×40.

     Обычный пункт набран Regular, текущий — Medium. Снапшот .fig утверждает,
     что Medium везде, но на живом рендере разница видна; Figma важнее экспорта.

     Блоки и пункты — вложенные <template>, будущие вложенные @foreach;
     components/menu-b2b.js их клонирует и никогда не собирает разметку из
     строк. Активный пункт помечается aria-current="page": в наборе нет
     варианта condition=active, текущую страницу дизайнер рисует ховером
     (912:80243, #eeeeee), поэтому у ховера и у текущей страницы один фон.

     Ниже md меню не сжимается, а заменяется другим компонентом —
     partials/for-business-header.html. -->
<aside
  class="flex w-[298px] shrink-0 flex-col gap-3 self-start bg-bg-subtle px-2 py-4 max-md:hidden"
  data-menu-b2b
  aria-label="Разделы для дилеров"
></aside>

<!-- один блок (future @foreach($menu as $block)) -->
<template data-menu-b2b-block>
  <nav class="flex flex-col">
    <p class="flex h-10 items-center px-4 text-body-n-accent text-text-muted max-md:h-11" data-block-title></p>
    <!-- В шторке пункты вложены в `menu` с padH=16 (2209:212892), поэтому
         ниже md они сдвинуты на 16 относительно заголовка блока, а плашка
         активного пункта не доходит до краёв панели. На 1440 обёртки нет. -->
    <div class="max-md:px-4" data-block-items></div>
  </nav>
</template>

<!-- один пункт (future @foreach($block->items as $item)) -->
<template data-menu-b2b-item>
  <a
    href="#"
    class="flex h-10 items-center px-4 text-body-n text-text-primary transition-colors hover:bg-components-subtle-hover aria-[current=page]:bg-components-subtle-hover aria-[current=page]:font-medium max-md:h-11"
    data-menu-b2b-link
  ></a>
</template>

<!-- ==================== ШТОРКА МЕНЮ РАЗДЕЛА (360) =====================
     Figma 2209:213627 — оверлей #141414/0.9 и панель с ручкой перетаскивания
     32×4, заголовком с крестиком, полем поиска и теми же тремя блоками меню.
     Строки в шторке 44, а не 40: блоки 220 / 396 / 176 делятся на 44 ровно. -->
<div class="modal-scrim md:hidden" data-menu-sheet>
  <div class="modal-panel" data-menu-sheet-panel role="dialog" aria-label="Разделы для дилеров">
    <div class="flex h-5 items-center justify-center pt-2">
      <span class="h-1 w-8 rounded-pill bg-surface-raised"></span>
    </div>

    <div class="flex h-10 items-center justify-between px-4">
      <p class="text-m-h2 text-text-primary">Для бизнеса</p>
      <button type="button" class="flex size-6 items-center justify-center" data-menu-sheet-close>
        <img src="../../assets/header/icon-close-dark.svg" alt="Закрыть" class="size-6" />
      </button>
    </div>

    <div class="px-4 pt-1">
      <!-- Тот же компонент поля, что в бургер-меню, с подписью этого экрана.
           Что именно оно ищет, макет не говорит и прототипа на нём нет —
           поведение не выдумываем, вопрос записан в BACKLOG. -->
      <form
        action="/search"
        method="get"
        class="flex h-11 items-center gap-4 rounded-pill bg-components-subtle px-4"
        role="search"
      >
        <input
          type="search"
          name="q"
          placeholder="Найти в документах"
          aria-label="Найти в документах"
          autocomplete="off"
          class="min-w-0 flex-1 bg-transparent text-body-s-accent text-text-primary outline-none placeholder:text-text-muted"
        />
        <img src="../../assets/header/icon-search.svg" alt="" class="size-6 shrink-0" />
      </form>
    </div>

    <!-- filters 352 из 360: 8 справа зарезервированы под полосу прокрутки -->
    <div class="pr-2 pt-4" data-menu-b2b-sheet></div>
  </div>
</div>
