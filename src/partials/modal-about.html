<!-- ==================== О НАС (ролик) =================================
     Нет фрейма в макете — «О компании»/«О нас» намеренно вели в никуда
     (BACKLOG), ролик появился на живом сайте клиента (mebel.com/contacts).
     Там же и оформление: клиент попросил взять его целиком, а не общий
     `.modal-panel`, — это единственное окно сайта без белой карточки.

     Источник — тот же фанбокс-лайтбокс, что открывает пункт «О нас» в шапке
     живого сайта (data-video-fancybox → тот же rutube-embed): затемнение
     rgba(30,30,30,.9) на весь экран (наш `--color-overlay-strong` — то же
     самое, 20 вместо 30, разница не читается), окно ролика без скругления и
     тени с отступом 44 от каждого края экрана, и квадратная кнопка-крестик
     44×44 в правом верхнем углу ЭКРАНА, а не окна — `rgba(30,30,30,.6)`,
     светлеет на hover. Отступ 44 и центрирование одинаковы на всех ширинах —
     проверено на 1440 и 390 на живом сайте, отдельного мобильного вида нет.

     Ширина/высота считаются формулой «что упрётся раньше» (letterbox), а не
     `aspect-video` в контейнере с max-w/max-h по отдельности — тем двумя
     ограничениями отдельно друг от друга можно оставить окно уже, чем
     позволяет высота, или наоборот. -->
<div class="modal-scrim z-[70] max-md:items-center" data-modal="about">
  <button
    type="button"
    class="fixed right-0 top-0 z-10 flex size-11 items-center justify-center bg-[#1e1e1e]/60 transition-colors hover:bg-[#1e1e1e]/80"
    data-modal-close
    aria-label="Закрыть"
  >
    <img src="../../assets/header/icon-close.svg" alt="" class="size-5" />
  </button>

  <div
    class="relative w-[min(calc(100vw-5.5rem),calc((100vh-5.5rem)*16/9))] h-[min(calc(100vh-5.5rem),calc((100vw-5.5rem)*9/16))] bg-black"
    data-modal-panel
  >
    <p
      class="absolute inset-0 flex items-center justify-center text-body-n text-text-inverse-secondary"
      data-about-loading
    >
      Загружаем видео…
    </p>
    <iframe
      src="https://rutube.ru/play/embed/93180d3b20eea5d8acae014710573086/"
      class="relative size-full"
      title="О фабрике мебели VIVAT"
      frameborder="0"
      allow="clipboard-write; autoplay"
      allowfullscreen
      loading="lazy"
      data-about-frame
    ></iframe>
  </div>
</div>
