<!-- ==================== CAROUSEL SECTION template ====================
     The "title-block + arrows + track" section every listing rail is made of:
     the home page's Модульные кухни / Популярные товары / Акции, the catalog's
     Популярные товары, the Акции page's rail and the PDP's four rails — nine
     mounts in all. One shell, two behaviours: desktop translates [data-track]
     behind the arrows, below `md` the viewport scrolls natively and the arrows
     give way to the progress bar + a full-width action.

     components/carousel.js clones this per section and fills the hooks; the
     cards inside [data-track] come from partials/product-card.html (or
     review-card.html on the PDP's Отзывы rail).

     In Blade this whole file is one partial and the mount becomes:

         @include('partials.carousel-section', [
           'title' => 'Популярные товары для кухни',
           'desc'  => '…',            // optional — omit and the <p> drops out
           'count' => null,           // optional muted number after the title
           'action' => 'В раздел', 'href' => '/catalog',
           'tabs'  => [...],          // optional chip row
           'items' => $products,      // the @foreach body of product-card
         ])

     Optional parts are marked `data-cs-optional-*` and removed by the component
     when the config omits them — in Blade they become plain @if blocks.

     Figma: title-block with a description is 178 tall, without one 148 — so the
     paragraph and its 8px lead-in drop out together rather than rendering empty.
-->

<template data-carousel-section>
  <section class="flex flex-col">
    <div class="page-x">
      <!-- Отступ над заголовком секции: 80 на десктопе, 64 на планшете
           (spacing 2477:151418), 40 на мобиле. -->
      <div class="h-20 max-xl:h-16 max-md:h-10"></div>
      <div class="flex items-start justify-between">
        <!-- Колонка заголовка тянется, а не держит 783: у длинных заголовков
             («Модули композиции …», 1131 в 2488:127168) текст обязан лечь в
             одну строку рядом с кнопкой. Описание при этом остаётся в 783 —
             в макете оно живёт внутри `text-container`. -->
        <div class="flex min-w-0 flex-1 flex-col max-md:w-full">
          <div class="flex min-h-11 items-center gap-3 max-md:min-h-6 max-md:gap-2">
            <!-- Мобильный title-block (1806:234561) держит заголовок в
                 фиксированных 52 — резерв под две строки Mobile/H2 (26×2),
                 а не по контенту, тот же приём, что у подписи промо-плитки. -->
            <h2 data-cs-title class="text-h2 text-text-primary max-md:text-m-h2 max-md:min-h-[52px]"></h2>
            <span data-cs-count class="text-h2 text-text-muted max-md:text-m-h2"></span>
          </div>
          <div data-cs-desc-gap class="h-2 max-md:h-1"></div>
          <!-- Описание на мобиле — Mobile/BodyN-accent (14/20 Medium), не
               Regular: text-m-body-n-accent, не text-m-body-n. -->
          <p data-cs-desc class="max-w-[783px] text-body-n-accent text-text-primary max-md:text-m-body-n-accent"></p>
        </div>
        <div data-cs-desktop-action class="flex h-11 items-start px-2 max-md:hidden">
          <a data-cs-action href="#" class="btn btn-m btn-secondary">
            <span data-cs-action-label></span>
            <img src="../../assets/header/arrow-right-24.svg" alt="" class="size-6" />
          </a>
        </div>
      </div>
      <!-- Слот ряда сегментов. Пустой (у рельсов без табов) он и есть та
           отбивка 24, что стояла тут раньше; с табами отбивки приносит сам ряд
           (`segments` 644:44577 — 16 сверху, 44 ряд, 16 снизу). -->
      <div data-cs-chips-slot class="empty:h-6 max-md:empty:h-3"></div>
    </div>
    <!-- Ниже `xl` рельс перестаёт быть каруселью со стрелками и становится
         нативным скроллом с индикатором — так он нарисован и на планшете
         (rows 2477:146694 + scroll 720x32), и на мобиле. -->
    <div class="page-x relative">
      <!-- На мобиле паддинг обёртки (page-x) закрывал carousel-viewport ровно
           там, где должен заглядывать сосед: у почти полноширинной карточки
           (320 из 328 доступных) для этого просто не было места — обрезка
           стояла впритык. Гасим паддинг обёртки (-mx-4) и возвращаем его
           только слева (pl-4), чтобы вьюпорт дотягивался до края экрана. -->
      <div
        class="overflow-hidden max-xl:scroll-rail max-xl:snap-x max-xl:snap-proximity max-xl:scroll-pl-6 max-xl:overflow-x-auto max-md:-mx-4 max-md:scroll-pl-4 max-md:pl-4"
        data-viewport
      >
        <div class="flex gap-6 transition-transform duration-500 ease-out will-change-transform max-md:gap-2" data-track></div>
      </div>
      <button data-prev aria-label="Назад" class="carousel-arrow absolute left-4 max-xl:hidden">
        <img src="../../assets/header/chevron-left.svg" alt="" class="size-6" />
      </button>
      <button data-next aria-label="Вперёд" class="carousel-arrow absolute right-4 max-xl:hidden">
        <img src="../../assets/header/chevron-right.svg" alt="" class="size-6" />
      </button>
    </div>
    <div class="hidden max-xl:block">
      <div data-cs-progress class="scroll-progress max-xl:px-6 max-md:px-4" data-progress><span><i></i></span></div>
      <!-- Кнопка под рельсом — мобильная: на планшете действие остаётся
           справа от заголовка, как на десктопе (buttons в title-block). -->
      <div data-cs-mobile-action class="px-4 pt-2 max-xl:hidden max-md:block">
        <a data-cs-action class="btn btn-m btn-secondary w-full" href="#">
          <span data-cs-action-label></span>
          <img src="../../assets/header/arrow-right-24.svg" alt="" class="size-6" />
        </a>
      </div>
    </div>
  </section>
</template>

<!-- Tab chips over a rail (Популярные товары). Блок `segments` (644:44577 на
     1440, 2338:254339 на 360) это 16 + ряд 44 + 16 сверху вниз, на 360 — 8 + 44
     + 16; ряд едет краем в край, и отрицательные поля выпускают его за
     отступы секции. The trailing "еще" chip is part of the
     row, not a tab; the component inserts one [data-carousel-chip] per tab
     before it. -->
<template data-carousel-chips>
  <div
    data-chips
    class="scroll-rail flex items-center gap-2 overflow-x-auto pb-4 pt-4 max-md:-mx-4 max-md:snap-x max-md:snap-proximity max-md:scroll-pl-4 max-md:px-4 max-md:pb-4 max-md:pt-2 *:max-md:snap-start"
  >
    <!-- «···» — реальная иконка (three-dot 632:31611, снята через MCP),
         не текстовые точки с tracking; вес Regular 400, не .chip's
         дефолтный Medium (font-normal поверх), цвет text-secondary, не
         text-muted. -->
    <button data-cs-more class="chip gap-1 border border-border-light bg-bg-page font-normal text-text-secondary">
      еще <img src="../../assets/header/icon-dots.svg" alt="" class="size-6" />
    </button>
  </div>
</template>

<template data-carousel-chip>
  <button class="chip"></button>
</template>
