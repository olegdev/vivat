     потому что адресов соцсетей нет (BACKLOG). Домен в Blade заменяется на
     url() — см. docs/PORTING.md. -->

    "@context": "https://schema.org",

    "name": "VIVAT",

    "logo": "https://mebel.com/assets/header/logo.svg",
    "telephone": "+7 (495) 135-65-65"
  }
</script>
