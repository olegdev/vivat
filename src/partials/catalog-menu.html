<!-- Catalog mega-menu shell (Figma menu 882:119365 / 912:85445). Static frame:
     overlay, scrim, three 300px columns, plus the menu-item / chip <template>s
     the columns are filled with. src/components/catalog-menu.js clones these
     from the shared `categories` tree and swaps col2/col3 on hover/click — the
     future Blade @foreach + the same behaviour script. -->
<div data-catalog-overlay class="fixed inset-x-0 bottom-0 top-[116px] z-40 hidden">
  <div data-catalog-scrim class="absolute inset-0 bg-overlay-middle"></div>
  <div class="pointer-events-none absolute inset-y-0 left-1/2 w-[1440px] -translate-x-1/2">
    <div class="pointer-events-auto flex h-full w-fit bg-bg-page shadow-dropdown">
      <nav data-cat-col1 class="w-[300px] shrink-0 overflow-y-auto pb-6 pl-6 pr-3 pt-4"></nav>
      <div data-cat-col2 class="hidden w-[300px] shrink-0 flex-col gap-10 overflow-y-auto px-3 pb-10 pt-4">
        <div data-col2-sub class="flex flex-col empty:hidden"></div>
        <div data-col2-chips class="flex flex-wrap gap-2 empty:hidden"></div>
      </div>
      <div data-cat-col3 class="hidden w-[300px] shrink-0 flex-col overflow-y-auto px-3 pb-10 pt-4"></div>
    </div>
  </div>
</div>

<!-- one column row (category / sub-tab / collection) -->
<template data-menu-item>
  <a href="#" class="catalog-menu-item">
    <span class="min-w-0 flex-1 text-body-n-accent text-text-primary" data-label></span>
    <img src="../../assets/header/chevron-right.svg" alt="" class="size-6 shrink-0" />
  </a>
</template>
<!-- one filter chip -->
<template data-menu-chip>
  <a href="#" class="catalog-chip" data-label></a>
</template>
