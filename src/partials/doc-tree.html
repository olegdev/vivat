<!-- ==================== ДЕРЕВО ДОКУМЕНТОВ =============================
     Figma `documents-content` / `lvl1` / `link-list` (1463:60818 на странице
     «Сертификаты»). Группа — заголовок 40 с шевроном и список документов;
     документ — ссылка и дата под ней (46 в одну строку ссылки, 70 в две).

     Заголовок — два разных **текстовых стиля**, а не одна строка с
     подчёркиванием: свёрнутая группа (`condition=default`) это «Link L dotted»
     20/32 Regular с пунктиром, раскрытая (`condition=pressed`) — «Body L
     semibold» 20/32 SemiBold без линии. На 360 те же два стиля в 16/24. Кегль
     и интерлиньяж у них общие, поэтому в разметке меняется только начертание и
     подчёркивание; шеврон один и поворачивается.

     **Со второго уровня заголовок мельче**: на «Схемах сборки» вложенная ветка
     набрана «Link M dotted» / «H5», то есть 16/24 против 20/32 у корневой
     (1434:57347 и 1434:57357 против 1434:57288 и 1434:57304). Уровень едет
     атрибутом `data-doc-depth`, кегль — вариантом при нём. На 360 вложенных
     веток макет не рисует вовсе, и там оба уровня остаются в 16/24.

     Размеры: группа 40 заголовок + 12 снизу (свёрнутая = 52), между
     документами 8 на 1440 и **16** на 360, у документа своей верхней отбивки
     нет — кроме **последней ветки во вложенном списке**: у неё этих 12 нет
     (1167:60903 и 1463:63640 — 40 против 52 у соседей), то есть внутри
     вложенного списка 12 работают как зазор между ветками, а не как отбивка
     каждой. В корневом списке (`documents-content`) 12 есть и у последней.

     **От заголовка отбит только список документов** (8): список веток
     начинается сразу под ним — на «Сертификатах» дети корневой группы это
     документы и `lvl1` идёт с `gap=8` (1463:60819), а на «Технической
     информации» и «Схемах сборки» дети корня — ветки, и там `gap=0`
     (1463:60872, 1463:63558), тогда как их собственные списки документов
     снова с 8. Отсюда и отбивка при `data-doc-kind`. **Между вложенными ветками зазора нет** — их
     разводят те самые 12 снизу (1463:60874, 1463:63560: списки веток идут с
     `gap=0`, списки документов — с 8). Отсюда `data-doc-kind`: зазор ставит
     список, а не строка. Заголовок в 40 не заперт: если подпись легла в
     две строки (на 360 это «Протоколы испытаний…», 2241:165260), строка
     вырастает до 48 — отсюда `min-h-10`, а не `h-10`.

     Документ уже колонки на 16 с каждой стороны: 830 из 862 на 1440 и 296 из
     328 на 360 — от этого и зависит, во сколько строк ляжет длинное название.
     Ссылка документа набрана «Link M dotted», то есть пунктиром; дата под ней
     отбита на 4 на 1440 и на 6 на 360. -->
<template data-doc-group>
  <section class="pb-3">
    <button
      type="button"
      aria-expanded="false"
      class="group/doc flex min-h-10 items-center gap-0.5 text-left"
      data-doc-toggle
      data-doc-depth="root"
    >
      <span
        class="link-dotted text-body-l text-text-primary max-md:text-m-body-l
               group-aria-expanded/doc:font-semibold group-aria-expanded/doc:no-underline
               group-data-[doc-depth=nested]/doc:text-body-n"
        data-doc-title
      ></span>
      <img
        src="../../assets/header/chevron-down.svg"
        alt=""
        class="size-4 shrink-0 transition-transform group-aria-expanded/doc:rotate-180"
      />
    </button>
    <div
      class="flex flex-col px-4 [&>section:last-child]:pb-0
             data-[doc-kind=docs]:gap-2 data-[doc-kind=docs]:pt-2 data-[doc-kind=docs]:max-md:gap-4"
      data-doc-items
      hidden
    ></div>
  </section>
</template>
