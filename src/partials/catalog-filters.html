<!-- ==================== CATALOG FILTER DRAWER ==========================
     Figma Catalog-1-filter / all-filters (913:86593, 759:69866): a 478px panel
     sliding in from the left over a dimmed page, holding one <form>. Future
     Blade: <x-catalog-filters/> — this whole file ports as one partial.

     ARCHITECTURE (see SOLUTIONS.md › "Filters: form + request seam"):
     · This is a real form. Every field `name` IS a future query parameter
       (`collection[]`, `facade[]`, `price_min`, …) — server-ready as written.
     · Behaviour (open/close, collapse, sync, apply) lives in catalog.js.
     · Applying does NOT filter here — it calls one seam, applyFilters(), which
       today filters the rendered cards client-side and writes the URL, and
       later becomes a single fetch('/catalog?…'). Nothing in this markup
       changes when that swap happens.

     Each filter group is a <details> so collapse is native + Blade-trivial; the
     option lists are written out (one <label> each) so they map 1:1 onto a
     Blade @foreach over $collections / $colors / … -->
<div data-filter-drawer data-mode="all" class="filter-drawer group/fd fixed inset-0 z-50">
  <!-- scrim -->
  <div data-filter-dismiss class="filter-drawer__scrim absolute inset-0 bg-overlay-strong"></div>

  <!-- panel -->
  <aside
    class="filter-drawer__panel absolute left-0 top-0 flex h-full w-[478px] max-w-full flex-col bg-surface-inverted shadow-dropdown"
  >
    <!-- header: desktop (Modal-header 1859:339041) pl-40/pr-24, H3 (24/28),
         no border; mobile (1997:296995) is a DIFFERENT header — h-48 (not 64),
         border-b/divider-light, H3 shrinks to Mobile/H3 (18/24). -->
    <div class="flex h-16 shrink-0 items-center justify-between py-2 pl-10 pr-6 max-md:h-12 max-md:border-b max-md:border-divider-light max-md:px-4 max-md:py-0">
      <!-- «Фильтры» у покупателя, «Все фильтры» у дилера (953:121956 — в кадре
           с опечаткой «фильры»). В одиночном режиме JS ставит сюда имя группы
           (953:122112: «Форма кухни») и запоминает свой текст по data-атрибуту. -->
      <h2 class="text-h3 text-text-primary max-md:text-m-h3" data-filter-title>
        <span class="group-data-[user=dealer]:hidden">Фильтры</span>
        <span class="hidden group-data-[user=dealer]:inline">Все фильтры</span>
      </h2>
      <button
        type="button"
        data-filter-close
        class="flex size-6 items-center justify-center"
        aria-label="Закрыть фильтры"
      >
        <!-- 1440 — close-l (963:37209), 360 — close-s (963:37212, глиф 11.9) -->
        <img src="../../assets/header/icon-close-dark.svg" alt="" class="size-6 max-md:hidden" />
        <img src="../../assets/header/icon-close-s.svg" alt="" class="hidden size-6 max-md:block" />
      </button>
    </div>

    <!-- form: the request payload. `name`s are the query contract. -->
    <form data-filter-form class="flex-1 overflow-y-auto px-10 max-md:px-4 group-data-[mode=single]/fd:pt-4">
      <!-- ---- Коллекция ---- -->
      <details data-filter-section="collection" class="group">
        <summary
          class="flex min-h-[49px] list-none items-center justify-between pt-4 pb-2 [&::-webkit-details-marker]:hidden group-data-[mode=single]/fd:hidden"
        >
          <span class="text-h5 text-text-primary max-md:text-m-body-n-accent max-md:text-text-secondary">Коллекция</span>
          <button
            type="button"
            data-filter-clear-group="collection"
            class="mr-8 text-body-xs text-text-secondary underline decoration-from-font underline-offset-2 transition-colors hover:text-text-primary"
          >
            очистить
          </button>
        </summary>
        <div class="grid grid-cols-2 gap-x-6">
          <label class="flex items-center gap-3 py-2.5"><input type="checkbox" name="collection[]" value="fusion" class="filter-check" /><span class="text-body-n text-text-primary max-md:text-m-body-n">Фьюжн</span></label>
          <label class="flex items-center gap-3 py-2.5"><input type="checkbox" name="collection[]" value="freym" class="filter-check" /><span class="text-body-n text-text-primary max-md:text-m-body-n">Фрейм</span></label>
          <label class="flex items-center gap-3 py-2.5"><input type="checkbox" name="collection[]" value="neo" class="filter-check" /><span class="text-body-n text-text-primary max-md:text-m-body-n">Нео</span></label>
          <label class="flex items-center gap-3 py-2.5"><input type="checkbox" name="collection[]" value="flet" class="filter-check" /><span class="text-body-n text-text-primary max-md:text-m-body-n">Флэт</span></label>
          <label class="flex items-center gap-3 py-2.5"><input type="checkbox" name="collection[]" value="skandi" class="filter-check" /><span class="text-body-n text-text-primary max-md:text-m-body-n">Сканди</span></label>
          <label class="flex items-center gap-3 py-2.5"><input type="checkbox" name="collection[]" value="loft" class="filter-check" /><span class="text-body-n text-text-primary max-md:text-m-body-n">Лофт</span></label>
          <label class="flex items-center gap-3 py-2.5"><input type="checkbox" name="collection[]" value="shale" class="filter-check" /><span class="text-body-n text-text-primary max-md:text-m-body-n">Шале</span></label>
          <label class="flex items-center gap-3 py-2.5"><input type="checkbox" name="collection[]" value="barcelona" class="filter-check" /><span class="text-body-n text-text-primary max-md:text-m-body-n">Барселона</span></label>
          <label class="flex items-center gap-3 py-2.5"><input type="checkbox" name="collection[]" value="kvadro" class="filter-check" /><span class="text-body-n text-text-primary max-md:text-m-body-n">Квадро</span></label>
          <label class="flex items-center gap-3 py-2.5"><input type="checkbox" name="collection[]" value="dublin" class="filter-check" /><span class="text-body-n text-text-primary max-md:text-m-body-n">Дублин</span></label>
          <label class="flex items-center gap-3 py-2.5"><input type="checkbox" name="collection[]" value="evro" class="filter-check" /><span class="text-body-n text-text-primary max-md:text-m-body-n">Евро</span></label>
          <label class="flex items-center gap-3 py-2.5"><input type="checkbox" name="collection[]" value="nicca" class="filter-check" /><span class="text-body-n text-text-primary max-md:text-m-body-n">Ницца</span></label>
          <label class="flex items-center gap-3 py-2.5"><input type="checkbox" name="collection[]" value="gletcher" class="filter-check" /><span class="text-body-n text-text-primary max-md:text-m-body-n">Глетчер</span></label>
          <label class="flex items-center gap-3 py-2.5"><input type="checkbox" name="collection[]" value="praga" class="filter-check" /><span class="text-body-n text-text-primary max-md:text-m-body-n">Прага</span></label>
          <label class="flex items-center gap-3 py-2.5"><input type="checkbox" name="collection[]" value="valeria" class="filter-check" /><span class="text-body-n text-text-primary max-md:text-m-body-n">Валерия-М</span></label>
          <label class="flex items-center gap-3 py-2.5"><input type="checkbox" name="collection[]" value="terra" class="filter-check" /><span class="text-body-n text-text-primary max-md:text-m-body-n">Терра</span></label>
          <label class="flex items-center gap-3 py-2.5"><input type="checkbox" name="collection[]" value="provans" class="filter-check" /><span class="text-body-n text-text-primary max-md:text-m-body-n">Прованс</span></label>
        </div>
      </details>

      <!-- ---- Фасад ---- -->
      <details data-filter-section="facade" class="group">
        <summary

          <span class="text-h5 text-text-primary max-md:text-m-body-n-accent max-md:text-text-secondary">Фасад</span>
          <button

            data-filter-clear-group="facade"

        <div>

          <label class="flex items-center gap-3 py-2.5"><input type="checkbox" name="facade[]" value="mdf" class="filter-check" /><span class="text-body-n text-text-primary max-md:text-m-body-n">МДФ</span></label>
          <label class="flex items-center gap-3 py-2.5"><input type="checkbox" name="facade[]" value="mdf-steklo" class="filter-check" /><span class="text-body-n text-text-primary max-md:text-m-body-n">МДФ / Стекло</span></label>
        </div>
      </details>

      <!-- ---- Форма ---- -->
      <details data-filter-section="form" class="group">
        <summary
          class="flex min-h-[49px] list-none items-center justify-between pt-4 pb-2 [&::-webkit-details-marker]:hidden group-data-[mode=single]/fd:hidden"
        >
          <span class="text-h5 text-text-primary max-md:text-m-body-n-accent max-md:text-text-secondary">Форма</span>
          <button
            type="button"
            data-filter-clear-group="form"
            class="mr-8 text-body-xs text-text-secondary underline decoration-from-font underline-offset-2 transition-colors hover:text-text-primary"
          >

          </button>
        </summary>
        <div>
          <label class="flex items-center gap-3 py-2.5"><input type="checkbox" name="form[]" value="pryamaya" class="filter-check" /><span class="text-body-n text-text-primary max-md:text-m-body-n">Прямая</span></label>
          <label class="flex items-center gap-3 py-2.5"><input type="checkbox" name="form[]" value="uglovaya" class="filter-check" /><span class="text-body-n text-text-primary max-md:text-m-body-n">Угловая</span></label>
        </div>
      </details>

      <!-- ---- Цвет ---- -->
      <details data-filter-section="color" class="group">
        <summary
          class="flex min-h-[49px] list-none items-center justify-between pt-4 pb-2 [&::-webkit-details-marker]:hidden group-data-[mode=single]/fd:hidden"
        >
          <span class="text-h5 text-text-primary max-md:text-m-body-n-accent max-md:text-text-secondary">Цвет</span>
          <button

            class="mr-8 text-body-xs text-text-secondary underline decoration-from-font underline-offset-2 transition-colors hover:text-text-primary"

            очистить
          </button>
        </summary>
        <div class="grid grid-cols-2 gap-x-6">
          <label class="flex items-center gap-2 py-2.5"><input type="checkbox" name="color[]" value="bezhevyy" class="peer sr-only" /><span class="filter-swatch" style="background:#e4dac4"></span><span class="text-body-n text-text-primary max-md:text-m-body-n">Бежевый</span></label>
          <label class="flex items-center gap-2 py-2.5"><input type="checkbox" name="color[]" value="svetlo-seryy" class="peer sr-only" /><span class="filter-swatch" style="background:#d9d9d9"></span><span class="text-body-n text-text-primary max-md:text-m-body-n">Светло-серый</span></label>
          <label class="flex items-center gap-2 py-2.5"><input type="checkbox" name="color[]" value="belyy" class="peer sr-only" /><span class="filter-swatch" style="background:#ffffff"></span><span class="text-body-n text-text-primary max-md:text-m-body-n">Белый</span></label>
          <label class="flex items-center gap-2 py-2.5"><input type="checkbox" name="color[]" value="oreh" class="peer sr-only" /><span class="filter-swatch" style="background:#b08d57"></span><span class="text-body-n text-text-primary max-md:text-m-body-n">Орех</span></label>
          <label class="flex items-center gap-2 py-2.5"><input type="checkbox" name="color[]" value="goluboy" class="peer sr-only" /><span class="filter-swatch" style="background:#cfe0ea"></span><span class="text-body-n text-text-primary max-md:text-m-body-n">Голубой</span></label>
          <label class="flex items-center gap-2 py-2.5"><input type="checkbox" name="color[]" value="chernyy" class="peer sr-only" /><span class="filter-swatch" style="background:#141414"></span><span class="text-body-n text-text-primary max-md:text-m-body-n">Черный</span></label>
          <label class="flex items-center gap-2 py-2.5"><input type="checkbox" name="color[]" value="zelenyy" class="peer sr-only" /><span class="filter-swatch" style="background:#4a9b7d"></span><span class="text-body-n text-text-primary max-md:text-m-body-n">Зеленый</span></label>
          <label class="flex items-center gap-2 py-2.5"><input type="checkbox" name="color[]" value="korichnevyy" class="peer sr-only" /><span class="filter-swatch" style="background:#6e4b3a"></span><span class="text-body-n text-text-primary max-md:text-m-body-n">Коричневый</span></label>
          <label class="flex items-center gap-2 py-2.5"><input type="checkbox" name="color[]" value="multicvet" class="peer sr-only" /><span class="filter-swatch" style="background:conic-gradient(#ff5546,#f8bb92,#4a9b7d,#cfe0ea,#6e4b3a,#ff5546)"></span><span class="text-body-n text-text-primary max-md:text-m-body-n">Мультицвет</span></label>
        </div>
      </details>

      <!-- ---- Стиль ---- -->
      <details data-filter-section="style" class="group">
        <summary
          class="flex min-h-[49px] list-none items-center justify-between pt-4 pb-2 [&::-webkit-details-marker]:hidden group-data-[mode=single]/fd:hidden"
        >
          <span class="text-h5 text-text-primary max-md:text-m-body-n-accent max-md:text-text-secondary">Стиль</span>
          <button
            type="button"
            data-filter-clear-group="style"
            class="mr-8 text-body-xs text-text-secondary underline decoration-from-font underline-offset-2 transition-colors hover:text-text-primary"
          >
            очистить
          </button>
        </summary>
        <div>
          <label class="flex items-center gap-3 py-2.5"><input type="checkbox" name="style[]" value="klassika" class="filter-check" /><span class="text-body-n text-text-primary max-md:text-m-body-n">Классика</span></label>
          <label class="flex items-center gap-3 py-2.5"><input type="checkbox" name="style[]" value="sovremennyy" class="filter-check" /><span class="text-body-n text-text-primary max-md:text-m-body-n">Современный</span></label>
        </div>
      </details>

      <!-- ---- Цена ---- -->
      <details data-filter-section="price" class="group">
        <summary
          class="flex min-h-[49px] list-none items-center justify-between pt-4 pb-2 [&::-webkit-details-marker]:hidden group-data-[mode=single]/fd:hidden"
        >
          <span class="text-h5 text-text-primary max-md:text-m-body-n-accent max-md:text-text-secondary">Цена</span>
          <button
            type="button"
            data-filter-clear-group="price"
            class="mr-8 text-body-xs text-text-secondary underline decoration-from-font underline-offset-2 transition-colors hover:text-text-primary"
          >
            очистить
          </button>
        </summary>
        <div>
          <!-- Ряд цены — `form` 1604:67832: два `input size=S` по 140, между
               ними «-» 14/18 #acacac, зазор 16, поля 8 сверху/снизу, пресеты
               сразу под ним. Сам инпут (1604:67833): подпись 14/18 #292929 (не
               серая), зазор 4, поле 44 #f3f3f3 с полями 16, значение 14/18
               #292929, плейсхолдер #808080, «₽» — 14/18 #acacac у правого края. -->
          <div class="flex items-end gap-4 py-2">
            <label class="w-[140px] shrink-0 max-md:min-w-0 max-md:flex-1">
              <span class="block pb-1 text-body-s text-text-primary">От</span>
              <span class="order-input flex items-center gap-1">
                <input
                  type="text"
                  inputmode="numeric"
                  name="price_min"
                  placeholder="132 000"
                  class="min-w-0 flex-1 bg-transparent text-body-s text-text-primary outline-none placeholder:text-text-secondary max-md:text-m-body-s"
                />
                <span class="shrink-0 text-body-s text-text-muted max-md:text-m-body-s">₽</span>
              </span>
            </label>
            <span class="pb-[13px] text-body-s text-text-muted">-</span>
            <label class="w-[140px] shrink-0 max-md:min-w-0 max-md:flex-1">
              <span class="block pb-1 text-body-s text-text-primary">До</span>
              <span class="order-input flex items-center gap-1">
                <input
                  type="text"
                  inputmode="numeric"
                  name="price_max"
                  placeholder="560 200"
                  class="min-w-0 flex-1 bg-transparent text-body-s text-text-primary outline-none placeholder:text-text-secondary max-md:text-m-body-s"
                />
                <span class="shrink-0 text-body-s text-text-muted max-md:text-m-body-s">₽</span>
              </span>
            </label>
          </div>
          <label class="flex items-center gap-3 py-2.5"><input type="radio" name="price" value="any" class="filter-radio" checked /><span class="text-body-n text-text-primary max-md:text-m-body-n">Любая цена</span></label>
          <label class="flex items-center gap-3 py-2.5"><input type="radio" name="price" value="0-100000" class="filter-radio" /><span class="text-body-n text-text-primary max-md:text-m-body-n">До 100 000 ₽</span></label>
          <label class="flex items-center gap-3 py-2.5"><input type="radio" name="price" value="100000-300000" class="filter-radio" /><span class="text-body-n text-text-primary max-md:text-m-body-n">100 000 – 300 000 ₽</span></label>
          <label class="flex items-center gap-3 py-2.5"><input type="radio" name="price" value="300000-519567" class="filter-radio" /><span class="text-body-n text-text-primary max-md:text-m-body-n">300 000 – 519 567 ₽</span></label>
        </div>
      </details>
    </form>

    <!-- footer (filter-footer 913:89214 condition=default/759:80587
         condition=selected): "Очистить" exists only once something is
         selected somewhere in the form — with nothing picked it's just the
         dark "Показать" button, full width (flex-1, no plain text link). JS
         toggles `hidden` on the whole-form selection count. -->
    <!-- Ниже `md` подвал как на 1440: слева поле 40 и зазор 24 — в кадрах
         1859:347076 и 1859:343990 кнопки по 136 стоят на 40 и 200. Правая
         кнопка кончается на 336, то есть справа поле 24, а не 40: содержимое
         шире 280 и вылезает в паддинг. Было зазор 8 — «недобор».
         «Очистить» — не текстовая ссылка, а пилюля #f3f3f3: подвал такого же
         цвета, поэтому в рендере она читается как текст. -->
    <!-- Одиночный фильтр (953:122134): подвал 92 с полями 24, одна кнопка во
         всю ширину, и только когда в группе есть выбранное. «Очистить» кадр там
         не рисует, но она есть — решение клиента 15.09 (иначе выбранное не
         снять), и сбрасывает только эту группу. JS ставит data-mode и
         data-empty на корень. -->
    <div class="flex h-16 shrink-0 items-center gap-6 bg-surface-default px-10 max-md:pr-6 group-data-[mode=single]/fd:h-[92px] group-data-[mode=single]/fd:group-data-[empty=true]/fd:hidden">
      <button
        type="button"
        data-filter-clear
        class="hidden btn btn-m flex-1 bg-components-subtle text-text-primary max-md:text-m-button-m hover:bg-components-subtle-hover"

        Очистить
