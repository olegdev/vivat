<!-- ==================== CART CARD template ============================
     Figma `card` 953:151123 (desktop 990×158) / 2029:156652 (mobile 360×162),
     inside the order page's cart panel. One clean HTML unit that
     components/order-cart.js clones per line — the future Blade @foreach body.

     The three columns are authored as two boxes so the same DOM reads both
     ways: desktop lays [image+text][price+stepper] out in a row (739 + 181),
     mobile stacks them (image+text on top, price+stepper underneath). No
     second copy, no `order-*`.

     The stepper is part of this unit rather than its own partial: it exists
     nowhere else in the design. Its left control follows the component's own
     `count` axis — `count=1` is the trash can, `count=2-and-more` the minus —
     but that axis is only filled in at `size=l`: the set has no
     `size=s, count=1` variant at all. 1440 cards take the big stepper
     (168×48, 943:79876) and 360 cards the small one (152×40, 2029:129546), so
     the trash is a desktop state and `data-count` is what CSS reads. Which
     leaves the 360 minus with nothing to do at 1 — the design offers no way to
     drop a line from a phone; that question is in BACKLOG.

     Desktop stepper: one 168×48 grey pill (`components-subtle`, radius 24).
     Mobile: 152×40, transparent, with the number in a bordered white 48×40
     box. Same markup, `max-md:` at the call site.

     DEALER (`customer=b2b`, 953:151784 default / 953:152360 edit). The same
     unit, four differences, all `group-data-[user=dealer]` at the call site:
       · the specs line is gone on 1440 and stays on 360;
       · 1440 reads image → text → stepper → price, where the customer reads
         price above stepper in one right column. That is one
         `md:…:flex-row-reverse`, scoped to `md:` so the shared mobile order
         (price, stepper) is untouched — below `md` both users read the same;
       · under the colour sits «Редактировать модули»; below `md` that control
         is the round pencil at the end of the price row instead (2225:167289);
       · the expanded card carries its модули inline (rows cloned from
         partials/order-modules.html). Below `md` the same list is the bottom
         sheet in that partial, so the card renders no inline list there. -->
<template data-cart-card>
  <article class="border-b border-divider-light px-6 py-6 max-md:px-4 max-md:py-4" data-cart-line>
   <div class="flex max-md:flex-col max-md:gap-2">
    <!-- ---- image + title (desktop: 739 of 920; mobile: the top row) ---- -->
    <div class="flex min-w-0 flex-1">
      <div class="relative flex shrink-0 items-start gap-2 max-md:gap-0">
        <label class="flex items-center max-md:absolute max-md:left-0.5 max-md:top-0.5 max-md:z-10">
          <input type="checkbox" class="filter-check" data-line-select checked />
        </label>
        <img
          src=""
          alt=""
          class="h-[110px] w-[148px] shrink-0 object-cover max-md:h-16 max-md:w-[86px] max-md:rounded-n"
          data-line-image
        />
      </div>

      <!-- below `md` the text runs to the card's right edge — 2029:157686 is
           242 wide and holds a 226 column, i.e. the 16 is a left inset only,
           which is what keeps «Цвет …» on one line -->
      <div class="flex min-w-0 flex-1 flex-col gap-1 px-6 max-md:pl-4 max-md:pr-0">
        <p class="truncate text-h5 text-text-primary max-md:text-m-h4" data-line-title></p>
        <!-- the dealer's 1440 card drops the specs line (953:152367 has only
             the title and the colour); its 360 card keeps it (2029:153731) -->
        <p
          class="text-body-s text-text-secondary max-md:text-m-body-s md:group-data-[user=dealer]:hidden"
          data-line-specs
        ></p>
        <!-- the customer's colour line is 18 tall (943:39509), the dealer's 24
             (953:151796) — the whole 88px text column depends on it -->
        <p
          class="text-body-s text-text-primary max-md:text-m-body-s md:group-data-[user=dealer]:text-body-n"
          data-line-color
        ></p>

        <!-- dealer, 1440 only: the modules toggle under the colour. 32 tall
             (`text-action` 953:151945), which is what closes the column at 88. -->
        <button
          type="button"
          class="hidden h-8 w-fit items-center gap-2 text-body-s text-text-primary md:group-data-[user=dealer]:inline-flex"
          data-line-modules
          aria-expanded="false"
        >
          <!-- 953:151945 overrides the text style to «Desktop/Link M dotted»
               and the right icon to chevron-down in the 20px slot -->
          <span class="link-dotted">Редактировать модули</span>
          <img
            src="../../assets/header/chevron-down.svg"
            alt=""
            class="size-5 transition-transform"
            data-line-modules-chevron
          />
        </button>
      </div>
    </div>

    <!-- ---- price + stepper (desktop: the 181 column; mobile: bottom row)
         181 is the design's width for a 7-digit price next to a 7-digit old
         one; `min-w` rather than `w` so a longer number pushes the column out
         instead of wrapping mid-price, and the title column (min-w-0) yields. -->
    <!-- the dealer's 1440 row is [stepper][price] inside 278 (953:152373); the
         DOM stays [price][stepper] and `flex-row-reverse` turns it round, and
         the rule is scoped to `md:` so the shared mobile row is untouched.
         `self-start` because that row sits at the TOP of the card, level with
         the title (953:151798 is at y=24, the same y as the image) — without
         it the column stretches and `items-center` drops it half a card down. -->
    <div
      class="flex min-w-[181px] shrink-0 flex-col gap-3 max-md:w-full max-md:min-w-0 max-md:flex-row max-md:items-center max-md:gap-3 max-md:py-1 md:group-data-[user=dealer]:min-w-[278px] md:group-data-[user=dealer]:flex-row-reverse md:group-data-[user=dealer]:items-center md:group-data-[user=dealer]:gap-6 md:group-data-[user=dealer]:self-start"
    >
      <!-- below `md` the price is a fixed cell, not a hug: the 360 frames put
           the stepper at a set x whatever the number reads — 86 on the
           customer card (2029:157694), 74 on the dealer's, where the row
           continues into the pencil -->
      <div class="flex items-baseline gap-2 whitespace-nowrap max-md:min-w-[86px] max-md:gap-1 max-md:group-data-[user=dealer]:min-w-[74px] md:group-data-[user=dealer]:ml-auto">
        <!-- the mobile card drops both the "от" prefix (2029:157695) and the
             struck-through old price beside it (2029:157697 is hidden in the
             master and no 360 instance turns it back on); the dealer drops
             them at both widths, like every other dealer price -->
        <span class="text-body-n text-text-primary max-md:hidden group-data-[user=dealer]:hidden">от</span>
        <span class="text-h3 leading-6 text-text-primary max-md:text-m-h4" data-line-price></span>
        <span
          class="text-body-n text-text-secondary line-through empty:hidden max-md:hidden group-data-[user=dealer]:hidden"
          data-line-oldprice
        ></span>
      </div>

      <!-- the stepper hugs the column's right edge on desktop (168 inside 181,
           offset 13 in 943:34167) and follows the price on mobile (2029:157693) -->
      <div
        class="group/step flex h-12 w-[168px] items-center justify-between self-end rounded-pill bg-components-subtle px-1 max-md:h-10 max-md:w-[152px] max-md:self-auto max-md:bg-transparent max-md:px-1 md:group-data-[user=dealer]:self-center"
        data-stepper
        data-count="one"
      >
        <!-- The stepper's left control is the trash can at count=1 (943:79876)
             and the minus at 2-and-more (2029:129546) — but only on 1440. Every
             360 card in the file draws the MINUS beside a 1 (2225:167289 and
             the customer's 2029:156652 alike), so the trash is a desktop state.
             Both glyphs are in the DOM and CSS picks: structure is HTML, and
             the count is one attribute the script writes. -->
        <button
          type="button"
          class="flex size-10 items-center justify-center rounded-full transition-colors hover:bg-components-subtle-hover"
          data-step-down
          aria-label="Уменьшить количество"
        >
          <img
            src="../../assets/order/icon-trash.svg"
            alt=""
            class="hidden size-6 md:group-data-[count=one]/step:block"
            data-step-down-trash
          />
          <img
            src="../../assets/order/icon-minus.svg"
            alt=""
            class="block size-6 md:group-data-[count=one]/step:hidden"
            data-step-down-minus
          />
        </button>
        <!-- 1440 prints the count in `text-primary` (943:79880), 360 in
             `#808080` (953:152667) -->
        <span
          class="flex h-11 w-14 items-center justify-center text-body-n text-text-primary max-md:h-10 max-md:w-12 max-md:rounded-n max-md:border max-md:border-border-light max-md:bg-surface-inverted max-md:text-m-body-n max-md:text-text-secondary"
          data-line-qty
        >1</span>
        <button
          type="button"
          class="flex size-10 items-center justify-center rounded-full transition-colors hover:bg-components-subtle-hover"
          data-step-up
          aria-label="Увеличить количество"
        >
          <img src="../../assets/order/icon-plus.svg" alt="" class="size-6" />
        </button>
      </div>

      <!-- dealer, 360 only: the modules toggle is a 40px grey circle at the end
           of the price row (`control` 2238:155755) instead of the text link -->
      <button
        type="button"
        class="hidden size-10 shrink-0 items-center justify-center rounded-full bg-components-subtle max-md:ml-auto max-md:group-data-[user=dealer]:flex"
        data-line-modules
        aria-label="Редактировать модули"
      >
        <img src="../../assets/order/icon-edit.svg" alt="" class="size-5" />
      </button>
    </div>
   </div>

    <!-- dealer, 1440 only: the expanded card's module rows (953:152907), one
         per module, cloned from partials/order-modules.html. Below `md` the
         same list is that partial's bottom sheet, so this stays hidden. -->
    <!-- 953:152907: the list starts flush against the TEXT column (no gap of
         its own) and its 40px rows are 2 apart. In Figma it is a sibling of
         the kitchen row inside the 740 column, so it begins where the text
         ends (88) while the 110px photo beside it simply runs on past — the
         `pl` clears that photo column horizontally and the `-mt` the 22px it
         overhangs vertically. -->
    <div
      class="hidden flex-col gap-0.5 pl-[204px] max-md:hidden md:-mt-[22px]"
      data-line-modules-list
    ></div>
  </article>
</template>
