<!-- ==================== HERO SLIDER ====================
     Top of customer/Main — Figma banner 607:29214 (desktop) / 1821:327006
     (mobile). Shell + one slide + one dot, cloned by components/hero-slider.js.

     Deliberately NOT auto-advancing: the Figma banner carries no prototype
     interactions at all. Behaviour is prev/next, dots, drag/swipe, keyboard,
     and only the active slide's <video> plays (with sound after the first user
     gesture — autoplay policy blocks it before that).

     In Blade: @include('partials.hero', ['slides' => $slides]), with the slide
     block as the @foreach body. `title` is the one field that carries markup
     (a <br> between the two lines), so it prints unescaped — {!! $slide['title'] !!}.
-->

<template data-hero-section>
  <section
    class="relative h-[640px] w-[1440px] touch-pan-y select-none overflow-hidden bg-surface-default max-md:h-[508px] max-md:w-full"
  >
    <div data-track class="absolute inset-0"></div>

    <!-- Desktop parks the controls on the vertical centre line; the 360px frame
         (1821:327514) drops them onto the dots row instead, one at each edge of
         the 8px gutter. -->
    <button
      data-prev
      aria-label="Назад"
      class="carousel-arrow absolute left-6 top-1/2 z-20 -translate-y-1/2 max-md:bottom-1 max-md:left-2 max-md:top-auto max-md:translate-y-0"
    >
      <img src="../../assets/header/chevron-left.svg" alt="" class="size-6" />
    </button>
    <button
      data-next
      aria-label="Вперёд"
      class="carousel-arrow absolute right-6 top-1/2 z-20 -translate-y-1/2 max-md:bottom-1 max-md:right-2 max-md:top-auto max-md:translate-y-0"
    >
      <img src="../../assets/header/chevron-right.svg" alt="" class="size-6" />
    </button>

    <div
      data-dots
      class="absolute inset-x-0 bottom-0 z-20 flex h-10 items-center justify-center gap-2 px-10 py-2 max-md:bottom-2"
    ></div>
  </section>
</template>

<!-- One slide. The media (video or image) is inserted before [data-hero-copy];
     the copy block drops out entirely when a slide has neither title nor cta. -->
<template data-hero-slide>
  <div data-slide class="absolute inset-0 opacity-0 transition-opacity duration-700 pointer-events-none">
    <div
      data-hero-copy
      class="absolute inset-y-0 left-0 flex w-[619px] flex-col justify-center gap-2 py-2 pl-[155px] pr-2 max-md:inset-y-auto max-md:top-0 max-md:w-full max-md:justify-start max-md:px-4 max-md:pb-2 max-md:pt-8"
    >
      <div class="flex flex-col gap-6 max-md:gap-4">
        <div class="flex flex-col gap-3 max-md:gap-1">
          <h1 data-hero-title class="text-display-l text-text-link-highlighted max-md:text-center max-md:text-m-display-l"></h1>
          <p data-hero-subtitle class="text-body-l text-text-link-highlighted max-md:text-center max-md:text-m-body-l"></p>
        </div>
        <div data-hero-cta-wrap class="max-md:flex max-md:justify-center">
          <a data-hero-cta href="#" class="btn btn-l btn-accent gap-3 max-md:h-11 max-md:gap-2 max-md:px-6 max-md:text-m-button-l">
            <span data-hero-cta-label></span>
            <img src="../../assets/header/cta-arrow.svg" alt="" class="size-6" />
          </a>
        </div>
      </div>
    </div>
  </div>
</template>

<!-- Slide media. `frame` reproduces the Figma media box verbatim (left/top/
     width/height inside the 1440x640 banner) via the `hero-media` custom
     properties — the same pattern the category tiles use. Without it the media
     just covers the slide. -->
<template data-hero-video>
  <video muted loop playsinline preload="metadata"></video>
</template>

<template data-hero-img>
  <img alt="" draggable="false" />
</template>

<template data-hero-dot>
  <button class="carousel-dot"><span></span></button>
</template>
