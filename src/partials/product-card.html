<!-- ==================== PRODUCT CARD templates ========================
     Figma UI SYSTEM "cards-kitchen". Two variants, each a clean HTML unit the
     carousel clones per product (components/product-card.js) — the future Blade
     @foreach body / <x-product-card>. Behaviour (image gallery swipe, dots,
     hand-off to the outer rail) is wired by initProductCards() over the data
     hooks below; the JS never emits structure.

     · data-pcard         — full card, swatches + comments footer
                            (Модульные кухни / Акции)
     · data-pcard-compact — the 152px "other" card, category-link footer + a
                            full-width "в корзину" pill on mobile (Популярные)

     The gallery track and dots are filled per image, badges/swatches per datum;
     everything else is static markup.

     ССЫЛКИ. На товар их две — снимок и заголовок, обе `[data-card-link]`, обе
     настоящие <a> (в Blade это @foreach с `$product->url`). Точки галереи и
     кнопка корзины лежат СНАРУЖИ обеих, поэтому вложенных интерактивных
     элементов не возникает: точки — сосед галереи внутри коробки снимка,
     кнопка — сосед заголовка в текстовом блоке. Свайп по снимку гасит переход
     (components/product-card.js), иначе жест на мобиле уводил бы со страницы.

     Третья ссылка — счётчик отзывов внизу карточки (`[data-card-reviews-link]`):
     тот же товар, но с якорем `#reviews`, то есть сразу к отзывам. Оформления
     у неё нет — макет не рисует ей ни ховера, ни подчёркивания.

     Подложка #f8f8f8 стоит и на обёртке, и на самой дорожке. Дорожка едет
     трансформацией, а значит создаёт свой контекст наложения: `mix-blend-multiply`
     у снимка смешивается с тем, что нарисовано **внутри** этого контекста, и
     без фона на дорожке белый фон фотографии просто закрывал подложку. -->
