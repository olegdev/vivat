<!-- ==================== СПРАВОЧНАЯ ТАБЛИЦА ===========================
     Figma `table-block` / `table-ordinary-column-cell` (1167:74253 на
     «Для интернет-магазинов»). Блок — шапка 44 и строки по 44, колонки
     207 и 655, отступ в ячейке 12, текст 14/18.

     Строки чередуются белым и #f8f8f8, и счёт **сквозной по блоку**: подстроки
     вложенной таблицы продолжают нумерацию родительских, а не начинают свою.
     Поэтому фон проставляет компонент, а не `odd:`/`even:` на контейнере. Границы в Figma наложены друг на друга (`gap=-1`),
     поэтому здесь их рисуют ячейки: блок берёт верхнюю и левую, ячейка —
     нижнюю и правую, и линии не удваиваются.

     Ниже md таблица не прокручивается — макет (2209:169154) её перестраивает,
     и ширина у неё всегда по колонке, а не фиксированные 862. Колонки там
     другие: у шапки 207 + 121, у строк поровну (164 + 164), у вложенной
     строки метка 108 и подколонки по половине; текст в ячейке 12/16. Шапка и строки в макете не
     выровнены между собой — воспроизведено как есть. -->
<template data-table-block>
  <div>
    <div class="w-full border-l border-t border-border-subtle" data-table-grid>
      <div class="flex" data-table-head>
        <span
          class="w-[207px] shrink-0 border-b border-r border-border-subtle px-3 py-3 text-body-s text-text-secondary max-md:py-3 max-md:text-m-body-s"
          data-th-1
        ></span>
        <span
          class="flex-1 border-b border-r border-border-subtle px-3 py-3 text-body-s text-text-secondary max-md:py-3 max-md:text-m-body-s"
          data-th-2
        ></span>
      </div>
      <div data-table-rows></div>
    </div>
  </div>
</template>

<!-- Строка с вложенной таблицей: метка объединена на всю высоту вложенного
     блока (в макете `row` 208 рядом с `table-block` 655), внутри — свои две
     колонки 208 и остальное. Чередование считается по подстрокам. -->
<template data-table-row-nested>
  <div class="flex">
    <span
      class="flex w-[207px] shrink-0 items-center border-b border-r border-border-subtle px-3 py-3 text-body-s text-text-primary max-md:w-[108px] max-md:py-3 max-md:text-m-body-s"
      data-td-label
    ></span>
    <div class="flex-1" data-td-sub></div>
  </div>
</template>

<!-- одна подстрока вложенной таблицы -->
<template data-table-subrow>
  <div class="flex">
    <span
      class="w-[205px] shrink-0 border-b border-r border-border-subtle px-3 py-3 text-body-s text-text-primary max-md:w-1/2 max-md:py-3 max-md:text-m-body-s"
      data-sub-1
    ></span>
    <span
      class="flex-1 border-b border-r border-border-subtle px-3 py-3 text-body-s text-text-primary max-md:py-3 max-md:text-m-body-s"
      data-sub-2
    ></span>
  </div>
</template>

<!-- одна строка (future @foreach($block->rows as $row)) -->
<template data-table-row>
  <div class="flex">
    <span
      class="w-[207px] shrink-0 border-b border-r border-border-subtle px-3 py-3 text-body-s text-text-primary max-md:w-1/2 max-md:py-3 max-md:text-m-body-s"
      data-td-1
    ></span>
    <span
      class="flex-1 border-b border-r border-border-subtle px-3 py-3 text-body-s text-text-primary max-md:py-3 max-md:text-m-body-s"
      data-td-2
    ></span>
  </div>
</template>
