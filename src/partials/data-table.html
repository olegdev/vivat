<!-- ==================== СПРАВОЧНАЯ ТАБЛИЦА ===========================
     Figma `table-block` / `table-ordinary-column-cell` (1167:74253 на
     «Для интернет-магазинов»). Блок — шапка 44 и строки по 44, колонки
     207 и 655, отступ в ячейке 12, текст 14/18.

     Строки чередуются белым и #f8f8f8 **строго через одну**, и строка с
     вложенной таблицей считается одной: её метка берёт цвет строки, а
     подстроки продолжают чередование от него же (1167:74289 — id белая,
     title серая, parent_id белая, pictures серая вместе с первой подстрокой,
     position снова белая). Поэтому фон проставляет компонент, а не
     `odd:`/`even:` на контейнере.

     Вертикальных линий в таблице **две штуки на строку и ни одной в шапке**:
     ячейки несут только горизонтальные границы (у шапки нижняя, у строки
     верхняя и нижняя), а разделитель колонок — это левая граница второй
     ячейки, которой у шапки нет (1167:74257 против 1167:74263). Рамка блока
     своя, #e7e7e7 против #eeeeee внутри. Границы в Figma наложены друг на
     друга (`gap=-1`), поэтому здесь нижнюю рисует ячейка, а блок берёт левую,
     правую и верхнюю — линии не удваиваются.

     Ниже md таблица не прокручивается — макет (2209:169154) её перестраивает,
     и ширина у неё всегда по колонке, а не фиксированные 862. Колонки там
     другие: у шапки 207 + 121, у строк **107 + 221**, у вложенной строки
     метка 108 и подколонки по половине от 221; текст в ячейке 12/16, отступ
     по вертикали 6 при минимальной высоте строки 40 (однострочная строка
     центрируется в 40, трёхстрочная вырастает до 60). Шапка и строки в макете
     не выровнены между собой — воспроизведено как есть. -->
