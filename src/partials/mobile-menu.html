<!-- Mobile burger-menu shell (Figma menu 1997:254993). Static frame only:
     overlay, panel header (back / title / close), search, list slot and the
     social row. The drill-down list (data-mm-list) and all stack/focus-trap
     behaviour live in src/components/mobile-menu.js. Below md only. -->
<div data-mm-overlay class="fixed inset-0 z-50 hidden xl:hidden">
  <div data-mm-scrim class="absolute inset-0 bg-overlay-strong"></div>
  <div data-mm-panel class="absolute inset-0 flex flex-col bg-bg-page" role="dialog" aria-modal="true" aria-label="Меню">
    <div class="flex h-12 shrink-0 flex-col justify-center border-b border-divider-light bg-surface-inverted px-4 pt-1 md:h-16 md:pt-0">
      <div class="flex h-10 items-center">
        <button type="button" data-mm-back class="hidden size-10 shrink-0 items-center" aria-label="Назад">
          <img src="../../assets/header/chevron-left.svg" alt="" class="size-6" />
        </button>
        <span data-mm-title class="min-w-0 flex-1 truncate text-m-h2 text-text-primary"></span>
        <button type="button" data-mm-close class="flex size-10 shrink-0 items-center justify-end" aria-label="Закрыть меню">
          <img src="../../assets/header/icon-close-s.svg" alt="" class="size-6" />
        </button>
      </div>
    </div>

    <div data-mm-body class="flex min-h-0 flex-1 flex-col overflow-y-auto pb-10 md:pb-6">
      <div class="px-4 pt-4 md:px-6 md:pt-6">
        <!-- the mobile entry point into the search overlay: same `data-search`
             contract as the desktop header's field, so components/search.js
             opens the overlay from either one (the mobile frames draw no search
             in the header itself). -->
        <form data-search action="/search" method="get" class="flex h-11 items-center gap-4 rounded-pill bg-components-subtle px-4" role="search">
          <input
            type="search"
            name="q"
            placeholder="Найти на сайте"
            aria-label="Найти на сайте"
            autocomplete="off"
            class="min-w-0 flex-1 bg-transparent text-body-s-accent text-text-primary outline-none placeholder:text-text-muted"
          />
          <img src="../../assets/header/icon-search.svg" alt="" class="size-6 shrink-0" />
        </form>
      </div>
      <div class="mt-8 flex flex-1 flex-col justify-between px-4 md:mt-4 md:px-6">
        <nav data-mm-list class="flex flex-col md:gap-2"></nav>
        <!-- Нижний блок меню. У покупателя (360: 1997:255057) блока `bottom`
             нет вовсе: под списком лежит один ряд соцсетей 232x40 у ЛЕВОГО
             края контейнера, кнопки «Личный кабинет» нет ни в одном кадре.
             У дилера (360: 2483:200904, 328x116; 768: 2483:194639, 720x116)
             это `bottom` при зазоре 32: кнопка на всю ширину (мастер
             `fill-width=on`, 188 в нём — ширина мастера) и под ней тот же ряд
             соцсетей, но ПО ЦЕНТРУ — 48 из 328 и 244 из 720. Кнопка и
             выравнивание включаются одним `data-user="dealer"` на <body>.
             Покупательского кадра на 768 нет; планшетный 2483:187171 несёт
             кнопку, то есть дилерский, — покупатель на 768 следует своему 360.
             Блока НЕТ на шагах вглубь: «step 2» и «Menu catalog» на обеих
             ширинах несут только список (2483:196959 / 1997:255130), поэтому
             он живёт на первом шаге и скрывается вместе с ним.
             Иконок ПЯТЬ: zen, vk, tg, yt, rt. MAX есть в наборе и в подвале
             (там ряд 280), но ни в одном кадре меню его нет. -->
        <div data-mm-bottom class="mt-auto flex shrink-0 flex-col gap-8">
          <!-- 360 и 768 (2483:200905 / 2483:194640): текст 14/20, стрелка 20 light -->
          <a href="#" class="btn btn-m btn-primary hidden w-full gap-2 text-m-button-m group-data-[user=dealer]:flex" data-mm-cabinet>
            <span>Личный кабинет</span>
            <img src="../../assets/header/icon-arrow-right-light.svg" alt="" class="size-5" />
          </a>
          <div class="flex shrink-0 items-center gap-2 group-data-[user=dealer]:justify-center">
            <a href="https://dzen.ru/id/62222e6dcff736707b7af89b" target="_blank" rel="noopener" aria-label="Дзен" class="social-icon size-10"><span class="size-8 social-zen"></span></a>
            <a href="https://vk.com/vivatmebel_official" target="_blank" rel="noopener" aria-label="ВКонтакте" class="social-icon size-10"><span class="size-8 social-vk"></span></a>
            <a href="https://t.me/mebeloptom_news" target="_blank" rel="noopener" aria-label="Telegram" class="social-icon size-10"><span class="size-8 social-tg"></span></a>
            <a href="https://www.youtube.com/channel/UC0SbbyXmypztxDawulCWnAQ" target="_blank" rel="noopener" aria-label="YouTube" class="social-icon size-10"><span class="size-8 social-yt"></span></a>
            <a href="https://rutube.ru/channel/25863947/" target="_blank" rel="noopener" aria-label="Rutube" class="social-icon size-10"><span class="size-8 social-rt"></span></a>
            <!-- шестая — MAX, как везде, где соцсети (клиент 15.09) -->
            <a href="#" aria-label="MAX" class="social-icon size-10"><span class="size-8 social-max"></span></a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- drill-down row units cloned by mobile-menu.js (future @foreach) -->
  <template data-mm-link>
    <a href="#" class="mobile-menu-item" data-menu-index>
      <span class="min-w-0 flex-1 text-m-body-n-accent text-text-primary" data-label></span>
      <img src="../../assets/header/chevron-right-s.svg" alt="" class="size-6 shrink-0" />
    </a>
  </template>
  <template data-mm-button>
    <button type="button" class="mobile-menu-item" data-menu-index aria-haspopup="true">
      <span class="min-w-0 flex-1 text-m-body-n-accent text-text-primary" data-label></span>
      <img src="../../assets/header/chevron-right-s.svg" alt="" class="size-6 shrink-0" />
    </button>
  </template>
  <template data-mm-caption>
    <p class="mobile-menu-item text-m-body-n-accent text-text-muted" data-label></p>
  </template>
</div>
