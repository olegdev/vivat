<!-- ==================== PRODUCTS GRID =================================
     Figma products 2250:137837 (покупатель) / 1686:158729 (дилер) — сетка
     из `cards-kitchen size=m` 322×389 в 4 колонки на 1440 и 168×259 в две
     колонки на 360. Фреймы совпадают, поэтому партиал один.

     Одна чистая карточка живёт в <template> ниже (это и есть будущее тело
     Blade @foreach); components/catalog-listing.js клонирует её на товар и
     ничего не строит из строк.

     Ссылок на товар три — снимок, заголовок (обе `[data-card-link]`) и счётчик
     отзывов с якорем `#reviews`, как и в общей карточке
     (partials/product-card.html). -->
<template data-card-tpl>
  <article class="flex flex-col" data-card>
    <div class="relative overflow-hidden rounded-n bg-bg-subtle">
      <!-- Коробка снимка задана пропорцией, а не высотой: карточка на десктопе
           тянется (322 → 404 на 1785), и 322/242 = 404/303.63 = 224/168.24 —
           одно и то же отношение на всех ширинах (2338:259415, 2500:178269,
           2483:232001). -->
      <a href="#" class="block relative aspect-[322/242] w-full touch-pan-y overflow-hidden max-md:aspect-[168/125]" data-card-gallery data-card-link draggable="false">
        <div class="flex h-full w-full transition-transform duration-300 ease-out will-change-transform" data-card-track></div>
        <div class="card-zones" data-card-zones></div>
      </a>
      <div data-card-badges class="absolute right-2 top-2 flex items-center gap-1 max-md:right-1 max-md:top-1"></div>
      <!-- Filled per photo by fillGallery(); the dots the design draws here
           are the gallery's, not decoration. -->
      <div class="pointer-events-none absolute inset-x-0 bottom-2 flex items-center justify-center gap-2 [&>*]:pointer-events-auto max-md:bottom-1 max-md:gap-1" data-card-dots></div>
    </div>
    <div class="flex flex-col gap-1 px-1 py-3 max-md:gap-0 max-md:pb-0 max-md:pt-1.5">
      <div class="flex items-start gap-4 max-md:gap-0">
        <div class="flex min-w-0 flex-1 flex-col gap-0.5 max-md:gap-0">
          <!-- price-container 632:25141: «от»↔цена — 4px, цена↔старая — 8px,
               два разных зазора, не один общий. -->
          <div class="flex items-baseline gap-2 max-md:gap-1">
            <div class="flex items-baseline gap-1">
              <!-- у дилера цена идёт без «от» (Figma dealer/Catalog 953:121911) -->
              <span class="text-body-n-accent text-text-primary group-data-[user=dealer]:hidden max-xl:text-m-body-n-accent">от</span>
              <span data-card-price class="text-h3 font-medium text-text-primary max-xl:text-m-body-n-accent"></span>
            </div>
            <span data-card-oldprice class="text-body-n text-text-muted line-through max-xl:text-m-body-s-crossed max-xl:text-text-secondary empty:hidden"></span>
          </div>
          <!-- На планшете карточка берёт мобильную типографику: во фрейме
               (2483:237851) строка цены 22 высотой при кегле 16 и «от» 14,
               описание 40 — две строки по 20. Десктопные 24 в 224-й карточке
               просто не помещаются и ломают цену на две строки. -->
          <a href="#" data-card-title data-card-link class="line-clamp-2 h-12 text-body-n text-text-primary max-xl:h-10 max-xl:text-m-body-compact"></a>
        </div>
        <button type="button" data-add-to-cart class="icon-btn max-md:hidden" aria-label="В корзину">
          <img src="../../assets/header/icon-order-dark.svg" alt="" class="size-6" data-idle-only />
          <img src="../../assets/header/icon-order-ok-light.svg" alt="" class="size-6" data-in-cart-only />
        </button>
      </div>
      <div class="flex items-center gap-4 py-1 max-md:gap-2">
        <div class="flex min-w-0 flex-1 items-center gap-2 max-md:gap-1">
          <div data-card-swatches class="flex items-center gap-2 max-md:gap-1"></div>
          <span data-card-more class="text-body-s text-text-secondary empty:hidden max-xl:text-m-body-xs"></span>
        </div>
        <a href="#reviews" class="flex items-center gap-1" data-card-reviews-link aria-label="Отзывы">
          <span data-card-comments class="text-body-s text-text-secondary max-xl:text-m-body-xs"></span>
          <img src="../../assets/header/icon-comment.svg" alt="" class="size-6 -m-1" />
        </a>
      </div>
    </div>
    <!-- full-width "в корзину" pill — mobile only (Figma малая плитка,
         1884:363392). Сидит СНАРУЖИ паддинга «container» выше — во всю
         ширину карточки, а не card_width−8. -->
    <button type="button" data-add-to-cart class="hidden h-8 w-full items-center justify-center gap-1.5 rounded-pill bg-components-subtle px-3 transition-colors hover:bg-components-subtle-hover max-md:mt-1.5 max-md:flex">
      <img src="../../assets/header/icon-order-dark.svg" alt="" class="size-4" data-idle-only />
      <img src="../../assets/header/icon-order-ok-light.svg" alt="" class="size-4" data-in-cart-only />
      <span class="text-m-button-s text-text-primary" data-idle-only>в корзину</span>
      <span class="text-m-button-s" data-in-cart-only>в корзине</span>
    </button>
  </article>
</template>

<!-- Колонки: на десктопе сетка ДОБИРАЕТ их сама — карточка не уже 322, а
     свободное место делится поровну. Это ровно то, что показывает
     последовательность 1440 → 1785 → 1786 (2500:170534 / 172560 / 168101):
     четыре по 322, четыре растянутых, пять снова по 322 на 1786 = 40 + 5×322 +
     4×24 + 40. На планшете правило другое и своё: три колонки по 224
     (2483:234511), это ниже минимума 322, поэтому диапазон задан явно. -->
<div
  data-grid
  class="page-x grid gap-6 [grid-template-columns:repeat(auto-fill,minmax(322px,1fr))] max-xl:grid-cols-3 max-md:grid-cols-2 max-md:gap-x-2 max-md:gap-y-6 max-md:px-2"
></div>

<!-- empty state (shown by catalog-listing.js when a filter matches nothing) -->
<div data-grid-empty class="hidden px-10 py-24 text-center max-md:px-4 max-md:py-16">
  <p class="text-h4 text-text-primary">Ничего не найдено</p>
  <p class="pt-2 text-body-n text-text-secondary">Попробуйте ослабить фильтры или сбросить их.</p>
  <button type="button" data-filter-clear class="btn btn-m btn-secondary mt-6">Сбросить фильтры</button>
</div>
