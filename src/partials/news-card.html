<!-- News card unit — Figma `news-item` 882:110636
     (device=desktop, layout=card, condition=default), 436×263 on `bg-subtle`
     with 24px padding. Three rows: title, a four-line lead, and the date
     pinned to the bottom in `text-secondary`.

     The card carries no width of its own — the dealer home page's `4item` row
     sizes its children (`*:w-[436px]`), so the same unit drops into a grid on
     a future news listing page. Cloned per datum by components/news-card.js;
     in Blade this template is the body of an @foreach. -->
<template data-news-card>
  <article class="flex h-[263px] flex-col justify-between rounded-[var(--radius-l)] bg-bg-subtle p-6">
    <div class="flex flex-col gap-3">
      <a href="#" class="text-body-n-accent text-text-primary" data-news-title></a>
      <p class="line-clamp-4 text-body-n text-text-primary" data-news-desc></p>
    </div>
    <time class="text-body-s text-text-secondary" data-news-date></time>
  </article>
</template>
