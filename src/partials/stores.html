<!-- ==================== НАШИ САЛОНЫ (map + dealer list) ================
     Figma customer/Main › map-general (878:103602). Shell is static HTML here
     (one future Blade partial); the live Yandex map, selection and filtering are
     wired by components/stores-map.js, which queries the hooks below. The dealer
     card and metro chip are <template>s the script clones per store — the future
     @foreach over $stores / $store->metro.

     Below `md` the section keeps only the title block and a 320px map with a
     centred "Где купить" CTA (Figma section / Наши салоны 1968:71568).

     The title and description are the only thing that differs per host — the
     PDP mounts the same block as "Где купить" (map-general 1686:58697) — so
     they carry data hooks and the copy below is the default. In Blade this
     becomes @include('partials.stores', ['title' => …, 'description' => …]).

     A third host is the order page's шаг 1 (Figma map-general 942:110251),
     which mounts the same block to PICK a dealer: white surface instead of the
     green one, the step's own copy in the title hooks, and cards that select.
     `renderStoresMap({ selectable: true })` adds `.stores-select`, which also
     turns the block into a full-screen map + bottom sheet below `md`
     (2032:158435 / 2059:169141) — see app.css. -->
<section id="where" class="flex w-full flex-col bg-surface-accent pb-16 max-xl:pb-0 max-md:bg-bg-page max-md:pb-10" data-stores-section>
  <div class="page-x" data-stores-head>
    <div class="h-20 max-xl:h-16 max-md:h-10"></div>
    <div class="flex w-[783px] flex-col max-xl:w-auto max-xl:min-w-0 max-xl:flex-1 max-md:w-full">
      <div class="flex min-h-11 items-center max-md:min-h-6">
        <h2 class="text-h2 text-text-primary max-md:text-m-h2" data-stores-title>Наши салоны</h2>
      </div>
      <div class="h-2 max-md:h-1"></div>
      <p class="text-body-n-accent text-text-primary max-md:text-m-body-n" data-stores-desc>
        Наша продукция продается в сотнях городов России в наших официальных
        магазинах и дилерских центрах.
      </p>
    </div>
    <div class="h-6 max-md:h-3"></div>
  </div>

  <!-- Карта уходит в край ТОЛЬКО на планшете (map 2477:114285, padH=0, радиус 4).
       На 360 она вставлена на 16 со скруглением 8 (Наши салоны 2395:106203:
       `Frame 2087325510` 328x320 @16), поэтому вариант ограничен диапазоном
       планшета — `max-xl:` один покрывал бы и мобилу. -->
  <div class="page-x md:max-xl:px-0" data-map-wrap>
    <!-- Рамки у карты нет: у инстанса `map` (2395:105929, 953:120995,
         планшетный 2477:114285) обводка нарисована, но `strokeWeight: 0` —
         видно только радиус 8 и тень внутреннего контейнера 946:117282
         (DROP_SHADOW 0 4 17.6 rgba(0,0,0,.14) — это и есть `shadow-dropdown`).
         Один раз уже было прочитано наоборот, по `strokePaints` без веса. -->
    <div class="relative flex overflow-hidden rounded-[var(--radius-l)] shadow-dropdown max-md:shadow-none" data-map-frame>
      <!-- left panel -->
      <aside class="flex h-[680px] w-[440px] shrink-0 flex-col bg-surface-inverted max-md:hidden" data-store-panel>
        <!-- Sheet-only chrome (Figma 1821:331970 / 2059:169141): a drag handle
             above the city + toggle block, and the address search below it.
             Both are `hidden` for the pages that mount this block for reading;
             `.stores-select` brings them back below `md`. The city and the
             "только фирменные" toggle are shared — the sheet shows the same
             ones, so there is one input, not two. -->
        <!-- `touch-none` обязателен: без него браузер на тач-экране считает жест
             скроллом и обрывает pointermove — лист «не тянется», хотя мышью
             всё работает. -->
        <div class="hidden h-5 shrink-0 cursor-grab touch-none items-center justify-center pt-1" data-sheet-grip>
          <span class="h-1 w-8 rounded-full bg-surface-raised"></span>
        </div>

        <div class="relative flex flex-col gap-2 border-b border-divider-light pb-4 pl-10 pr-6 pt-6" data-panel-head>
          <!-- Город в шапке панели — он же селектор: на Контактах по нему
               выбирают город (в опте) или город области (в рознице). На
               остальных страницах это просто подпись, меню там никто не
               наполняет и кнопка ведёт себя как текст. -->
          <!-- Стрелка назад — только в состоянии «список городов»
               (`type=city` 1859:335134: icon-container 40 слева от города).
               Возвращает панель к списку салонов. -->
          <button
            type="button"
            class="hidden size-10 shrink-0 items-center justify-center self-start"
            data-panel-back
            aria-label="Назад к списку салонов"
          >
            <img src="../../assets/header/chevron-left.svg" alt="" class="size-6" />
          </button>
          <!-- Имя магазина в шапке — состояние «карточка магазина» на шаге
               выбора дилера (2397:152957): слева стрелка назад, рядом имя, а
               город и тумблер на это время уходят. -->
          <span class="hidden h-8 items-center text-h3 text-text-primary max-md:text-m-h3" data-panel-title></span>
          <button type="button" class="flex h-8 items-center gap-1" data-city-toggle>
            <span
              class="text-h3 text-text-primary underline decoration-dotted decoration-1 underline-offset-4"
              data-panel-city
              >Москва</span
            >
            <img src="../../assets/header/icon-pin.svg" alt="" class="size-6" />
          </button>
          <!-- Область — вторая строка селектора, её показывает только розница -->
          <button type="button" class="hidden h-6 items-center gap-1" data-region-toggle>
            <span
              class="text-body-n text-text-secondary underline decoration-dotted decoration-1 underline-offset-4"
              data-panel-region
            ></span>
            <img src="../../assets/header/chevron-down.svg" alt="" class="size-4 opacity-60" />
          </button>
          <!-- Выпадашка городов для читающих страниц: у Контактов свой
               селектор и своё меню ниже, поэтому это отдельный контейнер. -->
          <div
            class="absolute left-10 top-16 z-30 hidden max-h-80 w-[280px] overflow-y-auto rounded-[var(--radius-l)] bg-surface-inverted py-2 shadow-dropdown"
            data-city-menu
          ></div>
          <!-- Меню обоих селекторов: один <template> строки на оба -->
          <div
            class="absolute left-10 top-16 z-20 hidden max-h-80 w-[280px] overflow-y-auto rounded-[var(--radius-l)] bg-surface-inverted py-2 shadow-dropdown"
            data-place-menu
          ></div>
          <div class="flex items-center gap-2">
            <span class="text-body-n text-text-primary">Только фирменные магазины</span>
            <label class="relative inline-flex cursor-pointer items-center">
              <input type="checkbox" data-brand-only class="peer sr-only" />
              <span class="block h-6 w-10 rounded-full bg-components-disabled transition-colors peer-checked:bg-components-red"></span>
              <span class="pointer-events-none absolute left-0.5 top-0.5 size-5 rounded-full bg-surface-inverted transition-transform peer-checked:translate-x-4"></span>
            </label>
          </div>
        </div>
        <!-- Пусто: регион, магазины которого ещё не пришли с бэка. Копия та
             же, что у пустой выдачи каталога. -->
        <p class="hidden px-10 py-10 text-body-n text-text-secondary max-md:px-4" data-store-empty>
          Ничего не найдено
        </p>
        <label class="mx-4 mb-2 mt-3 hidden h-11 items-center gap-2 rounded-[var(--radius-l)] bg-components-subtle px-3" data-sheet-search>
          <input
            type="search"
            data-store-search
            placeholder="Найти по адресу"
            class="min-w-0 flex-1 bg-transparent text-m-body-n text-text-primary outline-none placeholder:text-text-secondary"
          />
          <img src="../../assets/header/icon-search.svg" alt="" class="size-5 shrink-0 opacity-60" />
        </label>

        <div data-store-list class="stores-scroll h-[580px] overflow-y-auto pl-4 max-md:min-h-0 max-md:flex-1 max-md:pl-0"></div>

        <!-- Третье тело панели — список городов (`type=city` 1859:335134,
             блок `Cities`: поля 10 по бокам и 24 сверху, строки 44, зазор 8).
             Подменяет список салонов ниже `md`; выше `md` город выбирают
             выпадашкой, поэтому это тело там не показывается. -->
        <div class="hidden flex-col gap-2 overflow-y-auto px-2.5 pb-6 pt-6" data-city-panel></div>

        <!-- Второе тело панели — вариант `type=contact page` (1456:56787):
             вместо списка салонов один адрес. Показывается режимом
             contactPage в components/stores-map.js, там же и наполняется.
             general-container 440×442: padH=24, зазор между блоками 24. -->
        <!-- Слот сегментов «Опт / Розница» на 360: в мобильном варианте
             (2225:107318) они стоят внутри панели под шапкой, а на 1440 — над
             всем блоком карты. Страница клонирует в него свой <template>. -->
        <div class="hidden px-4 py-2 md:hidden" data-store-audience></div>

        <!-- Второе тело панели — вариант `type=contact page` (1456:56787):
             вместо списка салонов один адрес. Показывается режимом
             contactPage в components/stores-map.js, там же и наполняется.
             1440: general-container 440×442, padH=24, зазор 24.
             360:  dealer-card 360×442, padH=16, зазор 16. -->
        <div class="hidden flex-col gap-6 px-6 max-md:gap-4 max-md:px-4" data-store-detail>
          <!-- top-container 392×56: отбивка 32 и название 24 -->
          <p class="pt-8 text-h5 text-text-primary max-md:pt-3" data-detail-name></p>

          <!-- adress: описание 48 (адрес 24 + метро 18, зазор 6) -->
          <div class="flex flex-col gap-1.5">
            <p class="text-body-n text-text-primary max-md:text-m-body-l" data-detail-address></p>
            <span class="flex items-center gap-2 empty:hidden" data-detail-metro>
              <img src="../../assets/home/icon-metro.svg" alt="" class="size-4 shrink-0" />
              <span class="text-body-s text-text-secondary" data-detail-metro-name></span>
            </span>
          </div>

          <!-- Кнопка. На 1440 она идёт сразу за адресом и в 12 под ним (adress
               392×104 = 48 + 12 + 44), поэтому -mt-3 гасит зазор колонки с 24
               до 12. На 360 она уходит в самый низ карточки и растягивается на
               всю ширину (2225:107919, 328×44, содержимое по центру). -->
          <a
            href="#"
            class="-mt-3 inline-flex h-11 w-fit items-center gap-2 rounded-pill bg-components-subtle px-4 text-button-m text-text-primary max-md:order-last max-md:mt-0 max-md:w-full max-md:justify-center max-md:text-m-button-m"
            data-detail-route
          >
            <span data-detail-route-label></span>
            <img src="../../assets/contacts/icon-route.svg" alt="" class="size-6 shrink-0 max-md:size-5" />
          </a>

          <!-- consult 392×108: заголовок 24, зазор 8, столбец 76 -->
          <div class="flex flex-col gap-2 max-md:gap-1">
            <p class="text-h5 text-text-primary max-md:text-m-h4" data-detail-dept-title></p>
            <div class="flex flex-col gap-2" data-detail-dept-rows></div>
          </div>

          <!-- wh 392×102: заголовок 24, зазор 8, колонки 52 и 91.
               На 360 колонки равные по 160 (row 328 = 160 + 8 + 160). -->
          <div class="flex flex-col gap-2 max-md:gap-1">
            <p class="text-h5 text-text-primary max-md:text-m-h4" data-detail-hours-title></p>
            <div class="flex gap-2">
              <div class="flex w-[52px] flex-col gap-2 empty:hidden max-md:w-40 max-md:gap-1" data-detail-hours-labels></div>
              <div class="flex flex-col gap-2 max-md:w-40 max-md:gap-1" data-detail-hours-values></div>
            </div>
          </div>
        </div>
      </aside>

      <!-- map -->
      <div class="relative h-[680px] flex-1 max-md:h-80" data-map-pane>
        <div data-map class="size-full"></div>
        <div class="pointer-events-none absolute inset-x-0 top-0 z-10 hidden h-10 bg-linear-to-b from-alpha-black-100 to-transparent max-md:block"></div>
        <button type="button" class="btn btn-m btn-accent absolute left-1/2 top-1/2 z-10 hidden -translate-x-1/2 -translate-y-1/2 px-6 max-md:flex" data-map-cta>Где купить</button>
        <!-- Крышка раскрытой карты — `close-panel` 1859:338372: полоса 40 с
             тёмным круглым крестиком у правого края (контейнер 28 на #141414/0.9,
             поле 8). Видна только пока карта раскрыта на весь экран. -->
        <button
          type="button"
          class="absolute right-2 top-2 z-30 hidden size-7 items-center justify-center rounded-full bg-overlay-strong"
          data-map-close
          aria-label="Закрыть карту"
        >
          <img src="../../assets/header/icon-close.svg" alt="" class="size-6" />
        </button>
        <div class="absolute bottom-6 right-6 z-10 flex flex-col gap-2 max-md:hidden">
          <button type="button" data-zoom="1" class="map-ctrl" aria-label="Приблизить">+</button>
          <button type="button" data-zoom="-1" class="map-ctrl" aria-label="Отдалить">−</button>
        </div>
      </div>
    </div>
  </div>

  <!-- one dealer card (future @foreach($stores as $store)) -->
  <template data-store-card>
    <button type="button" data-store aria-expanded="false" class="store-card">
      <div class="flex w-full flex-col gap-1">
        <div class="flex w-full items-start justify-between gap-2">
          <!-- The sheet's cards carry a radio (2059:169141); the reading list
               and the desktop step-1 list do not — select mode un-hides it. -->
          <span data-store-radio class="mr-2 hidden size-6 shrink-0 items-center justify-center">
            <span class="size-6 rounded-full border border-border-default bg-surface-inverted"></span>
          </span>
          <p data-store-name class="flex-1 pr-6 text-h5 text-text-primary max-md:text-m-h4"></p>
          <img src="../../assets/header/chevron-down.svg" alt="" data-chevron class="size-6 shrink-0" />
        </div>
        <div class="flex flex-col gap-1.5">
          <p data-store-address class="text-body-n text-text-primary"></p>
          <div data-store-metro class="flex flex-wrap gap-2 empty:hidden"></div>
        </div>
      </div>
      <!-- Кнопка карточки на шаге выбора дилера: «Выбрать магазин» (серая,
           946:134818) и «Магазин выбран» с белой стрелкой на #414141
           (953:55451) у выбранной. Ниже `md` её нет — там карточку выбирает
           радиокнопка. Это `span`, а не кнопка: карточка сама и есть кнопка,
           вложить в неё вторую нельзя. -->
      <span
        data-store-pick
        class="mt-1.5 hidden h-8 items-center gap-1.5 self-end rounded-pill bg-components-subtle px-3 text-body-s text-text-primary"
      >
        <span data-store-pick-label>Выбрать магазин</span>
        <img src="../../assets/header/icon-arrow-right-light.svg" alt="" class="hidden size-4" data-store-pick-icon />
      </span>

      <!-- Раскрытая карточка (`condition=pressed` 953:55651): расписание в две
           колонки, телефон + соцсети, почта/сайт, «Проложить маршрут». Общий
           для всех точек контент (кроме телефона) — единственный реальный
           источник в файле — плейсхолдер мастера; см. BACKLOG.md. Ссылки —
           `span`, не `a`: карточка сама кнопка, вложенный `a` в ней невалиден,
           как и со `data-store-pick` выше. -->
      <div data-details hidden class="flex flex-col gap-4 pt-3">
        <div class="flex items-start justify-between gap-3">
          <div class="flex flex-col gap-2">
            <span class="text-body-s-accent text-text-primary">Консультация:</span>
            <div class="flex gap-2">
              <div class="flex flex-col gap-1 text-body-s text-text-secondary">
                <span>будни:</span><span>сб.:</span><span>вс.:</span>
              </div>
              <div data-store-consult class="flex flex-col gap-1 text-body-s text-text-primary"></div>
            </div>
          </div>
          <div class="flex flex-col gap-2">
            <span class="text-body-s-accent text-text-primary">Самовывоз:</span>
            <div class="flex gap-2">
              <div class="flex flex-col gap-1 text-body-s text-text-secondary">
                <span>будни:</span><span>сб.:</span><span>вс.:</span>
              </div>
              <div data-store-pickup class="flex flex-col gap-1 text-body-s text-text-primary"></div>
            </div>
          </div>
        </div>
        <div class="flex items-center justify-between gap-3">
          <span data-store-detail-phone class="text-body-l-semibold text-text-primary"></span>
          <span class="flex items-center gap-0.5">
            <span aria-label="ВКонтакте" class="social-icon size-10"><span class="size-8 social-vk"></span></span>
            <span aria-label="Telegram" class="social-icon size-10"><span class="size-8 social-tg"></span></span>
            <span aria-label="MAX" class="social-icon size-10"><span class="size-8 social-max"></span></span>
          </span>
        </div>
        <div class="flex flex-col">
          <span data-store-email class="w-fit text-body-n text-text-primary underline"></span>
          <span data-store-website class="w-fit text-body-n text-text-primary underline"></span>
        </div>
        <span class="flex items-center gap-1 self-end text-body-s text-text-primary">
          <span class="link-dotted">Проложить маршрут</span>
          <img src="../../assets/header/icon-pin.svg" alt="" class="size-6 -m-1" />
        </span>
      </div>
    </button>
  </template>

  <!-- одна строка меню города/области (future @foreach) -->
  <template data-place-option>
    <button
      type="button"
      class="flex w-full items-center px-4 py-2.5 text-left text-body-n text-text-primary transition-colors hover:bg-components-subtle aria-[current=true]:bg-components-subtle"
    ></button>
  </template>

  <!-- one metro chip (future @foreach($store->metro as $m)) -->
  <template data-metro-chip>
    <span class="flex items-center gap-0.5">
      <img src="../../assets/home/icon-metro.svg" alt="" class="size-4 shrink-0" />
      <span data-metro-name class="text-body-s text-text-secondary"></span>
    </span>
  </template>

  <!-- Shown in place of the map when the Yandex Maps API fails to load (no key,
       offline, blocked). The list of salons beside it stays useful either way. -->
  <template data-map-failed>
    <div class="flex size-full flex-col items-center justify-center gap-2 bg-surface-default px-10 text-center">
      <p class="text-h5 text-text-primary">Карта временно недоступна</p>
      <p class="text-body-s text-text-secondary">Список салонов рядом — актуален.</p>
    </div>
  </template>
</section>
