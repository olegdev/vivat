<!-- Роль читателя на общих страницах раздела «Для бизнеса».
     Скрипт встроенный и синхронный не по недосмотру: модуль страницы отложен
     и выполнится уже после разбора <body>, то есть шапка успеет отрисоваться
     покупательской и мигнуть. Логика роли — в components/session.js; здесь
     только то, что обязано случиться до первой отрисовки.
     В Blade этот партиал не нужен — сервер отрендерит data-user сразу в <body>. -->
<script>
  try {
    if (localStorage.getItem("vivat:user") === "dealer")
      document.body.dataset.user = "dealer";
  } catch (e) {
    /* приватный режим — остаёмся покупателем */
  }
</script>
