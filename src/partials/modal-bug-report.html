<!-- ==================== СООБЩИТЬ ОБ ОШИБКЕ ============================
     Своего фрейма нет: окно заказано клиентом для страницы конструктора и
     собрано по форме «Стать дилером» (1003:166072) — тот же общий
     modal-shell, шапка из одного крестика, заголовок первым блоком тела,
     согласие и одна коралловая кнопка во всю ширину.

     Отличие одно: к полям добавлены описание проблемы и вложение. Оба
     контрола в макете не нарисованы, поэтому собраны из того, что уже есть:
     поле — тот же `.order-input`, только многострочный, кнопка выбора файла —
     `btn-s btn-secondary`. Имя файла печатает components/modals.js: нативную
     подпись «No file chosen» браузер рисует по-своему в каждой ОС и не
     переводит, поэтому сам `<input type="file">` спрятан. -->
<div class="modal-scrim" data-modal="bug-report">
  <div class="modal-panel" data-modal-panel>
    <div class="flex h-[59px] items-center justify-end px-4 max-md:h-14">
      <button type="button" class="flex size-6 items-center justify-center" data-modal-close aria-label="Закрыть">
        <img src="../../assets/header/icon-close-dark.svg" alt="" class="size-6" />
      </button>
    </div>

    <form class="px-10 pb-6 max-md:px-4" data-modal-form>
      <h2 class="text-center text-h4 text-text-primary max-md:text-m-h3">Сообщить об ошибке</h2>

      <div class="flex flex-col gap-4 pt-6">
        <label class="flex flex-col gap-1">
          <span class="text-body-s text-text-primary max-md:text-m-body-s">Ваше имя</span>
          <input type="text" name="name" required class="order-input" />
        </label>
        <label class="flex flex-col gap-1">
          <span class="text-body-s text-text-primary max-md:text-m-body-s">Адрес электронной почты</span>
          <input type="email" name="email" required class="order-input" />
        </label>
        <label class="flex flex-col gap-1">
          <span class="text-body-s text-text-primary max-md:text-m-body-s">Телефон</span>
          <input type="tel" name="phone" required class="order-input" />
        </label>
        <label class="flex flex-col gap-1">
          <span class="text-body-s text-text-primary max-md:text-m-body-s">
            Подробно опишите проблему. Постарайтесь вспомнить действия, которые привели к
            появлению ошибки, если ошибка носит технический характер.
          </span>
          <textarea name="message" rows="4" required class="order-input h-auto resize-none py-3"></textarea>
        </label>

        <div class="flex items-center gap-3">
          <input type="file" name="attachment" class="hidden" data-bug-file />
          <button type="button" class="btn btn-s btn-secondary shrink-0" data-bug-file-pick>Выбрать файл</button>
          <span class="min-w-0 flex-1 truncate text-body-s text-text-secondary max-md:text-m-body-s" data-bug-file-name>
            Файл не выбран
          </span>
        </div>
      </div>

      <label class="mt-4 flex items-start gap-3 py-1.5">
        <input type="checkbox" name="consent" required class="filter-check" />
        <span class="text-body-xs text-text-primary max-md:text-m-body-s">
          Нажимая кнопку «Отправить», я даю своё согласие на обработку персональной информации в
          соответствии с <a href="#" class="link-dotted">Политикой конфиденциальности</a>
        </span>
      </label>

      <button type="submit" class="btn btn-m btn-accent mt-6 w-full max-md:text-m-button-m">Отправить</button>
    </form>
  </div>
</div>
