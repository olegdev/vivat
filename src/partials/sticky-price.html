<!-- ==================== STICKY PRICE BAR ================================
     Figma `sticky-price` device=desktop (1884:366292), shown in the "sticky
     price" frame 1884:366246: a 48px white bar pinned to the bottom of the
     viewport once the summary panel's order button has scrolled away. Two
     `text-action` links on the left, the product + price and a size=s dark
     button on the right. `shadow-navbar` is the upward shadow the frame draws
     above the bar (the same token the mobile bottom nav uses).

     Visibility is one class (`is-visible`) toggled by components/pdp.js.

     Neither bar has a dealer frame; the dealer PDP mounts these two, with the
     price reduced to the one line the b2b summary draws — no «от», no old price.
     Their price carries `data-price-base`, so it follows the price list like
     every card price. See BACKLOG. -->
<!-- Бар, открываемый скроллом, — только десктопный: ниже `xl` всегда виден
     другой, `modal-button-container` (на планшете 768x64, см. ниже). -->
<div class="pdp-sticky fixed inset-x-0 bottom-0 z-40 hidden h-12 bg-surface-inverted shadow-navbar xl:block" data-sticky-price>
  <div class="page-x flex h-full items-center justify-between">
    <div class="flex items-center gap-4">
      <a href="#where" class="flex items-center gap-1 text-body-s text-text-primary transition-colors hover:text-text-secondary">
        <span>Где посмотреть / купить</span>
        <img src="../../assets/header/icon-pin-20.svg" alt="" class="size-4" />
      </a>
      <a href="#reviews" class="flex items-center gap-1 text-body-s text-text-primary transition-colors hover:text-text-secondary">
        <span>Читать отзывы</span>
        <img src="../../assets/header/icon-comment.svg" alt="" class="size-6 -m-1" />
      </a>
    </div>

    <div class="flex items-center gap-7">
      <div class="flex items-center gap-4">
        <span class="text-body-n-accent text-text-primary" data-sticky-title></span>
        <div class="flex items-baseline gap-1">
          <span class="text-body-s text-text-primary group-data-[user=dealer]:hidden">от</span>
          <span class="text-h4 text-text-primary" data-sticky-price-value></span>
          <span class="text-body-s text-text-secondary line-through empty:hidden group-data-[user=dealer]:hidden" data-sticky-oldprice></span>
        </div>
      </div>
      <button type="button" class="btn btn-s btn-primary" data-pdp-order>Сформировать заказ</button>
    </div>
  </div>
</div>

<!-- ==================== MOBILE CTA BAR =================================
     Figma `modal-button-container` 2027:89990, from the DPD viewport frame
     (2027:83602). A different component from the desktop bar, and a different
     behaviour: it is **always** on screen, not revealed by scroll — the mobile
     summary has no order button at all, so this is the only way to order.

     It stacks directly on top of the bottom nav (60px bar over the 72px nav,
     which is why the page reserves 132px at the bottom below `md`). -->
<!-- На планшете это 2483:246944 в экранном кадре 2483:246910: бар 768x64,
     поле 24, зазор 8 — и две РАВНЫЕ области по 356 (`text-action` @24 и
     `buttons` @388). Каждая область заполняется своим ребёнком целиком:
     `link-container` 356x48 с содержимым по центру (иконка 20 + зазор 4 +
     текст 84 = 108, по 124 слака с боков), `button-container` 356x44 с
     подписью 181 по центру. Мастер кнопки так и называется — `fill-width=on`,
     `stackChildPrimaryGrow=1`: 188 в мастере это ШИРИНА МАСТЕРА, а не кнопки.
     `inst` на самом баре врёт — отдаёт 537x44 ключом на дочерний узел мастера
     (2027:89962); считать надо по собственным детям инстанса, у них есть
     абсолютные координаты, и они сходятся с геометрией кадра
     (768 − 2·24 = 720, (720 − 8)/2 = 356).
     Ниже `md` (2027:89990) области не равны: ссылка 129 (содержимое 98 плюс
     по 16 с боков), кнопка забирает остаток — 191 при поле 16 и зазоре 8.
     Кегль тоже разный: 16/24 на планшете против 14/20 на телефоне —
     подтверждено глифами derivedTextData, а не полем `fontSize`. -->
<!-- Тень вверх рисует именно этот бар (2027:89990), а не тапбар под ним. -->
<div
  class="fixed inset-x-0 bottom-[72px] z-40 flex h-16 items-center gap-2 bg-surface-inverted px-6 shadow-navbar xl:hidden max-md:h-[60px] max-md:px-4"
  data-cta-bar
>
  <!-- Область и её ребёнок — разные ящики, и обёртка тут не для красоты:
       `flex-1` прямо на кнопке даёт 340/372, а не 356/356, потому что при
       `box-sizing: border-box` основа 0 упирается в её собственные поля 2x16.
       Обёртка делит ширину, ребёнок внутри растягивается на всю область. -->
  <div class="flex flex-1 max-md:flex-none">
    <a
      href="#where"
      class="flex h-12 w-full items-center justify-center gap-1 text-button-m text-text-secondary max-md:h-11 max-md:px-4 max-md:text-m-body-n-accent"
    >
      <img src="../../assets/header/icon-pin-20.svg" alt="" class="size-5 shrink-0 opacity-60" />
      <span>Где купить</span>
    </a>
  </div>
  <!-- The button's icon slot renders empty in the live frame — text only. -->
  <div class="flex flex-1">
    <button type="button" class="btn btn-m btn-accent w-full max-md:text-m-button-m" data-pdp-order>
      <span
        >Оформить&nbsp;•
        <span class="group-data-[user=dealer]:hidden">от </span
        ><span data-sticky-price-value></span
      ></span>
    </button>
  </div>
</div>
