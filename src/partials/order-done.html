<!-- ==================== «ВАШ ЗАКАЗ ОТПРАВЛЕН» =========================
     Figma form 2241:158412 (desktop modal 485×725) / 2241:158297 (mobile, full
     screen over the bottom nav); the dealer page's own frame, 2238:157458, is
     the same thing under dealer chrome. One overlay: a centred card above
     `md`, the whole viewport below it.

     Both order pages mount this — the customer's and the dealer's — and its
     two links point at sibling pages (`main.html`, `catalog.html`), which
     resolve inside whichever page's folder splices it in. -->
<!-- below `md` the bottom nav stays visible under it (2241:158305), so the
     overlay reserves its 72px rather than covering the whole viewport -->
<div class="modal-scrim z-[60] max-md:items-center max-md:bg-transparent max-md:pb-[72px]" data-order-done>
  <div class="modal-panel relative h-[725px] overflow-hidden max-md:h-full max-md:max-h-none max-md:rounded-none">
    <!-- Снимок обрезан по макету, и на 1440 и на 360 это РАЗНЫЕ куски одного
         кадра: fill-transform у 2241:161138 берёт 0.312–0.818 по ширине, у
         2241:158299 — 0.383–0.747, и высоты тоже не совпадают. Поэтому два
         файла, а не один `object-cover`: он бы центрировал кадр и увёл чайник
         за нижний край. -->
    <img src="../../assets/order/thanks-src.jpg" alt="" class="absolute inset-0 size-full object-cover max-md:hidden" />
    <img src="../../assets/order/thanks-mobile-src.jpg" alt="" class="absolute inset-0 hidden size-full object-cover max-md:block" />

    <!-- Закрыть: на 1440 это простой тёмный глиф 24 у правого края шапки
         (modal-header 2241:158413), на 360 — круглая кнопка `close-panel`
         2241:158304, та же, что накрывает карту. -->
    <a
      href="../customer/main.html"
      data-half
      class="absolute right-4 top-[18px] z-10 flex size-6 items-center justify-center max-md:right-2 max-md:top-1.5 max-md:size-7 max-md:rounded-full max-md:bg-overlay-strong"
      aria-label="Закрыть"
    >
      <img src="../../assets/header/icon-close-dark.svg" alt="" class="size-6 max-md:hidden" />
      <img src="../../assets/header/icon-close.svg" alt="" class="hidden size-4 max-md:block" />
    </a>

    <!-- Блок текста стоит над спокойной частью снимка — чайник ниже. На 1440
         это 59 шапки + 112 отбивки (thank you frame 2241:161140), на 360 —
         186 от верха (Thank you container 2241:158300). Заголовок 30/36 на
         1440 (Desktop/H2), 22/26 на 360 (Mobile/H2) — разные токены. -->
    <div class="relative flex flex-col items-center gap-6 px-16 pt-[171px] text-center max-md:px-10 max-md:pt-[186px]">
      <div class="flex flex-col gap-4 max-md:gap-3">
        <p class="text-h2 text-text-primary max-md:text-m-h2">Ваш заказ отправлен!</p>
        <p class="text-body-l text-text-primary max-md:text-m-body-l">
          С вами свяжется представитель дилера для подтверждения заказа
        </p>
      </div>
      <a href="../customer/catalog.html" data-half class="btn btn-l btn-accent w-full max-md:h-11 max-md:text-m-button-l">
        Продолжить покупки
      </a>
    </div>
  </div>
</div>
