<!-- ==================== CN: Подпишитесь на нас =================== -->
<!-- Отбивка блока НЕ симметричная: `CN-container` во всех двенадцати
     экземплярах — это распорка сверху плюс сам `social`, и снизу ничего.
     1440 и 1900: 96 + 220 = 316. 768: 64 + 220 = 284. 360: 64 + 168 + 32 = 264
     (единственная ширина с хвостом). Стояло `items-center`, то есть 48/48 на
     1440 и 32/32 на 768 — общая высота сходилась, поэтому дефект пережил и
     сверку копии, и скриншоты; поймал `npm run audit:spacing`. -->
<section
  class="page-x flex h-[316px] items-start pt-24 max-xl:h-[284px] max-xl:pt-16 max-md:h-auto max-md:pb-8 max-md:pt-16"
>
  <div
    class="flex w-full flex-col items-center gap-4 rounded-pill bg-accent-green-200 px-10 py-8 max-xl:rounded-[var(--radius-l)] max-md:px-0"
  >
    <div class="flex flex-col items-center gap-1 text-center max-md:gap-0">
      <p class="text-h4 text-text-primary max-md:text-m-h3">Подпишитесь на нас в соцсетях</p>
      <p class="text-body-n text-text-primary max-md:text-m-body-l">чтобы быть всегда в курсе!</p>
    </div>
    <!-- 6 separate links; sizes from Figma Container 878:105096 (80px box,
         64px glyph, 12px gap) and 1968:220411 on mobile (40 / 32 / 8). -->
    <div class="flex items-center gap-3 max-md:gap-2">
      <a href="#" aria-label="Дзен" class="social-icon size-20 max-md:size-10"><span class="size-16 max-md:size-8 social-zen"></span></a>
      <a href="#" aria-label="ВКонтакте" class="social-icon size-20 max-md:size-10"><span class="size-16 max-md:size-8 social-vk"></span></a>
      <a href="#" aria-label="Telegram" class="social-icon size-20 max-md:size-10"><span class="size-16 max-md:size-8 social-tg"></span></a>
      <a href="#" aria-label="YouTube" class="social-icon size-20 max-md:size-10"><span class="size-16 max-md:size-8 social-yt"></span></a>
      <a href="#" aria-label="Rutube" class="social-icon size-20 max-md:size-10"><span class="size-16 max-md:size-8 social-rt"></span></a>
      <a href="#" aria-label="MAX" class="social-icon size-20 max-md:size-10"><span class="size-16 max-md:size-8 social-max"></span></a>
    </div>
  </div>
</section>
