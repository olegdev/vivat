<!-- ==================== PDP SUMMARY PANEL ==============================
     Figma `summary` device=desktop Customer=b2c Type=PDP (922:98746) and its
     mobile counterpart (1997:313148). Desktop: a 412px card beside the photo
     column — 1px `border-light`, radius `n`, white. Mobile: full width, no
     border, and the price sits in a `bg-subtle` card at the bottom.

     **The two faces order the blocks differently**, which is the only reason
     `order-*` appears here: desktop reads title → colours → size → geometry →
     price, mobile reads title → size → geometry → colours → price. The DOM is
     authored in desktop order and `max-md:order-*` re-sequences it, so there is
     one set of markup rather than two (and the Blade port stays one partial).

     The dealer page mounts the same partial as the `Customer=b2b` variant
     (953:142727): the price is one line — «от», the struck-through old price
     (953:142751) and the discount badge (953:142753) are all hidden in that
     master — and the notice below the button is gone. Those four `hidden`s under
     `group-data-[user=dealer]` are the whole 441 → 392 difference.

     **Панель плавает по колонке фотографий.** Дизайн этого не рисует — это
     решение клиента: выше `md` карточка `sticky` в 24px от верха окна и едет
     вместе со скроллом внутри секции `#photos`, то есть останавливается у
     нижнего края третьего снимка. Ниже `md` панель обычная: там кнопки в ней
     нет вовсе, CTA живёт в нижней панели.

     Structure only; pdp.js fills the swatches from data and drives the two
     controls. The desktop title's share icon hides below `md` — mobile's own
     share action lives on the photo instead (partials/pdp-photo-overlay.html). -->
<aside
  class="flex w-[412px] shrink-0 flex-col self-start rounded-n border border-border-light bg-surface-inverted xl:sticky xl:top-6 max-xl:w-full max-xl:rounded-none max-xl:border-0 max-xl:pt-2"
  data-pdp-summary
>
  <!-- `contents` below `md` so the four blocks become direct flex children of
       the panel and their `order-*` applies against the price block too. Their
       own padding moves onto each block, since this wrapper has no box then. -->
  <div class="flex flex-col gap-4 p-6 max-xl:contents">
    <!-- title 922:92247, share icon 24 to its right -->
    <div class="flex items-center gap-3 max-xl:order-1 max-xl:px-6 max-xl:pb-2 max-md:px-4">
      <h1 class="min-w-0 flex-1 text-h3 text-text-primary" data-pdp-title>Кухня Фьюжн-05</h1>
      <button type="button" class="flex size-6 shrink-0 items-center justify-center max-md:hidden" data-modal-open="share" aria-label="Поделиться">
        <img src="../../assets/pdp/icon-share.svg" alt="" class="size-6" />
      </button>
    </div>

    <!-- colour swatches + the selected colour's name -->
    <div class="flex flex-col gap-2.5 max-xl:order-4 max-xl:px-6 max-xl:pb-2 max-md:px-4">
      <div class="flex items-center gap-3 max-md:gap-4" data-pdp-colors></div>
      <p class="text-body-s text-text-secondary" data-pdp-color-name></p>
    </div>

    <!-- size / material, with the link into the Характеристики block -->
    <div class="flex flex-col max-xl:order-2 max-xl:px-6 max-xl:pb-2 max-md:px-4">
      <p class="text-body-n text-text-primary max-md:text-m-body-n" data-pdp-size></p>
      <a href="#specs" class="link-dotted w-fit text-body-n text-text-secondary transition-colors hover:text-text-primary max-md:text-m-body-n" data-pdp-more>Подробнее</a>
    </div>

    <!-- geometry (Прямая / Угловая) — `segments` size=l outline=on, 32px pills.
         Only two fit the 160px desktop frame; below `md` the pair fills the row
         (1997:313165), so the segments grow instead of hugging their labels. -->
    <div class="flex items-center gap-1 py-1 max-xl:order-3 max-xl:gap-2 max-xl:px-6 max-xl:pb-2 max-md:px-4" role="radiogroup" aria-label="Геометрия" data-pdp-geometry>
      <button type="button" class="pdp-segment max-xl:flex-1" aria-checked="true" role="radio" value="pryamaya">Прямая</button>
      <button type="button" class="pdp-segment max-xl:flex-1" aria-checked="false" role="radio" value="uglovaya">Угловая</button>
    </div>
  </div>

  <!-- Price block. Desktop: a divider inside the white card. Mobile: a
       `bg-subtle` card inset by 16px, and NO order button — the mobile CTA
       lives in the bottom bar (partials/sticky-price.html). -->
  <!-- Разделитель над ценой не доходит до краёв панели: в макете это верхняя
       граница ВНУТРЕННЕГО контейнера 364 (922:92211, 1px #e7e7e7), то есть он
       вставлен на те же 24, что и остальное содержимое. -->
  <div class="flex flex-col px-6 max-xl:order-5 max-xl:mx-6 max-xl:rounded-n max-xl:bg-bg-subtle max-xl:px-0 max-md:mx-4">
    <div class="flex flex-col gap-3 border-t border-divider-light py-6 max-xl:gap-3 max-xl:border-0 max-xl:p-6 max-md:p-4">
    <div class="flex items-center gap-4 max-md:gap-2">
      <div class="flex items-baseline gap-2">
        <span class="text-body-n-accent text-text-primary group-data-[user=dealer]:hidden max-md:text-m-body-n-accent">от</span>
        <span class="text-h3 text-text-primary max-md:text-m-h2" data-pdp-price></span>
        <span class="text-body-n text-text-secondary line-through empty:hidden group-data-[user=dealer]:hidden max-md:text-m-body-s-crossed" data-pdp-oldprice></span>
      </div>
      <span class="badge badge-s badge-discount empty:hidden group-data-[user=dealer]:hidden" data-pdp-discount></span>
    </div>

    <button type="button" class="btn btn-m btn-primary w-fit max-xl:hidden" data-pdp-order>Сформировать заказ</button>

    <!-- `notice` 943:108544 — 16px warning glyph + 14/18 muted copy. Дилерский
         вариант сводки (953:142727) её не несёт, как и «от» выше: там цена одна
         строкой, поэтому панель на 49px ниже покупательской. -->
    <p class="flex gap-2 pt-0.5 text-body-s text-text-secondary group-data-[user=dealer]:hidden max-md:pt-0">
      <img src="../../assets/pdp/icon-warning.svg" alt="" class="-mt-0.5 size-6 -m-1 shrink-0" />
      <span>Дилерская наценка может отличаться в зависимости от региона!</span>
    </p>
    </div>
  </div>
</aside>

<!-- one colour swatch (future @foreach($product->colors as $color)).
     `color-swatch` 629:26578 is a solid `color` frame with an optional image
     over it, so a datum carries either — the same split as the product card's
     swatches. 28px on desktop, 32px below `md` (1997:313155). -->
<template data-pdp-swatch>
  <button type="button" class="pdp-swatch max-md:size-8" aria-checked="false" role="radio"></button>
</template>
<template data-pdp-swatch-img>
  <img alt="" class="size-full rounded-full object-cover" />
</template>

<!-- one dot under the mobile photo rail -->
<template data-pdp-photo-dot>
  <button type="button" class="carousel-dot" aria-current="false"><span></span></button>
</template>
