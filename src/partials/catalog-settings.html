<!-- ==================== CATALOG SETTINGS (filters bar + sort) ==========
     Figma catalog-settings — один компонент с вариантами device × type:
     покупательский 768:28896 (1440) / 1806:237126 (360), дилерский
     880:17203 (1440) / 1806:238139 (360). Дилерский отличается ровно одним:
     тумблером «Только модули», поэтому здесь он и живёт, под
     `group-data-[user=dealer]`. Будущий Blade: <x-catalog-settings/>.

     Все элементы этой панели открывают или ведут один и тот же ящик фильтров
     и состояние URL; обвязка — в components/catalog-listing.js. -->
<div data-catalog-settings class="page-x flex flex-col gap-3 py-6 max-md:py-3">
  <div class="flex items-center justify-between max-md:flex-wrap max-md:gap-2">
    <!-- filter openers. Ниже `xl` именованные пилюли схлопываются в одну
         воронку (Figma catalog-settings 1806:237128 на 360, 2483:206306 на
         768) — ящик фильтров становится единственным входом. На планшете ряд
         тот же, что на мобиле: воронка 44 слева, сортировка 280 справа. -->
    <div class="flex items-center gap-2">
      <!-- funnel. `icon-button` (881:51240) is an auto-layout ROW — 44px
           circle + 20px badge at gap -12, badge top-aligned — so the whole
           control is 52 wide and the badge pushes the pills right by 8.
           Reproduced as a flex row with `-ml-3`, not as an absolute
           overlay; see SOLUTIONS.md › "Badges are layout, not overlay".
           With filters applied the circle flips to the dark variant. -->
      <button type="button" data-filter-open class="filter-funnel flex h-11 shrink-0 items-center" aria-label="Открыть фильтры">
        <!-- service-icons `filter, 24 THIN` (2214:190873) — именно тонкий:
             во фрейме воронки стоит он, а не жирный. Inline + currentColor,
             чтобы глиф инвертировался вместе с кружком. -->
        <span class="filter-funnel__circle">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M8.84961 5.55017C9.26382 5.55017 9.59961 5.88596 9.59961 6.30017C9.59961 6.71438 9.26382 7.05017 8.84961 7.05017H2.75C2.33579 7.05017 2 6.71438 2 6.30017C2 5.88596 2.33579 5.55017 2.75 5.55017H8.84961Z" />
            <path d="M13.1992 6.29999C13.1991 5.30597 12.3935 4.50018 11.3994 4.50018C10.4055 4.50029 9.59972 5.30621 9.59961 6.30017C9.59961 7.29422 10.4054 8.09969 11.3994 8.09979C12.3935 8.09979 13.1992 7.2941 13.1992 6.29999ZM14.6992 6.29999C14.6992 8.12253 13.222 9.59979 11.3994 9.59979C9.57696 9.59969 8.09961 8.12246 8.09961 6.29999C8.09972 4.4776 9.57703 3.00029 11.3994 3.00018C13.2219 3.00018 14.6991 4.47754 14.6992 6.29999Z" />
            <path d="M21.25 5.55017C21.6642 5.55017 22 5.88596 22 6.30017C22 6.71438 21.6642 7.05017 21.25 7.05017H15.4004C14.9862 7.05017 14.6504 6.71438 14.6504 6.30017C14.6504 5.88596 14.9862 5.55017 15.4004 5.55017H21.25Z" />
            <path d="M10.75 16.9502C11.1642 16.9502 11.5 17.286 11.5 17.7002C11.5 18.1144 11.1642 18.4502 10.75 18.4502H2.75C2.33579 18.4502 2 18.1144 2 17.7002C2 17.286 2.33579 16.9502 2.75 16.9502H10.75Z" />
            <path d="M15.0996 17.7C15.0995 16.706 14.2939 15.9002 13.2998 15.9002C12.3058 15.9003 11.5001 16.7062 11.5 17.7002C11.5 18.6942 12.3058 19.4997 13.2998 19.4998C14.2939 19.4998 15.0996 18.6941 15.0996 17.7ZM16.5996 17.7C16.5996 19.5226 15.1223 20.9998 13.2998 20.9998C11.4774 20.9997 10 19.5225 10 17.7C10.0001 15.8776 11.4774 14.4003 13.2998 14.4002C15.1223 14.4002 16.5995 15.8776 16.5996 17.7Z" />
            <path d="M21.25 16.9502C21.6642 16.9502 22 17.286 22 17.7002C22 18.1144 21.6642 18.4502 21.25 18.4502H18.4004C17.9862 18.4502 17.6504 18.1144 17.6504 17.7002C17.6504 17.286 17.9862 16.9502 18.4004 16.9502H21.25Z" />
          </svg>
        </span>
        <span data-filter-badge class="badge-number badge-number--outline -ml-3 hidden self-start">0</span>
      </button>
      <!-- named pills. A group with a selection takes the `condition=active`
           pill (Figma 752:63467): #414141 border + a muted count. -->
      <button type="button" data-filter-open="collection" data-filter-pill="collection" class="filter-pill btn btn-m border border-border-light bg-surface-inverted text-text-primary hover:bg-components-subtle-hover max-xl:hidden">Коллекция<span data-pill-count class="hidden text-text-muted"></span></button>
      <button type="button" data-filter-open="form" data-filter-pill="form" class="filter-pill btn btn-m border border-border-light bg-surface-inverted text-text-primary hover:bg-components-subtle-hover max-xl:hidden">Форма кухни<span data-pill-count class="hidden text-text-muted"></span></button>
      <button type="button" data-filter-open="facade" data-filter-pill="facade" class="filter-pill btn btn-m border border-border-light bg-surface-inverted text-text-primary hover:bg-components-subtle-hover max-xl:hidden">Фасады<span data-pill-count class="hidden text-text-muted"></span></button>
      <button type="button" data-filter-open="color" data-filter-pill="color" class="filter-pill btn btn-m border border-border-light bg-surface-inverted text-text-primary hover:bg-components-subtle-hover max-xl:hidden">Цвет<span data-pill-count class="hidden text-text-muted"></span></button>
      <button type="button" data-filter-open="style" data-filter-pill="style" class="filter-pill btn btn-m border border-border-light bg-surface-inverted text-text-primary hover:bg-components-subtle-hover max-xl:hidden">Стиль<span data-pill-count class="hidden text-text-muted"></span></button>
      <button type="button" data-filter-open="price" data-filter-pill="price" class="filter-pill btn btn-m border border-border-light bg-surface-inverted text-text-primary hover:bg-components-subtle-hover max-xl:hidden">Цена<span data-pill-count class="hidden text-text-muted"></span></button>
    </div>

    <!-- правая группа. На 1440 это фрейм `popular` 480 = текст+тумблер 168,
         зазор 32, сортировка 280 (Figma 882:89384). Ниже `md` группа
         становится `display:contents`, её дети выходят прямыми элементами
         строки — тумблер встаёт справа от воронки, сортировка переносится
         на вторую строку во всю ширину (Figma 1806:238141: колонка 328×96
         из двух рядов по 44 с зазором 8). Никаких `order-*`. -->
    <!-- Ниже `md` обёртка сортировки больше не растягивается: во фрейме
         (1806:237128) воронка стоит слева, а сортировка 240 прижата к правому
         краю — между ними 44. `flex-1` тянул её сразу за воронкой. У дилера
         сортировка по-прежнему уезжает во всю ширину второй строкой. -->
    <div class="flex items-center gap-8 max-md:contents">
      <!-- «Только модули» — единственная дилерская добавка панели
           (Figma text+toggle 882:89379 на 1440, 1806:238263 на 360).
           Тумблер 604:24626: off #e7e7e7/#acacac, on #cbcbcb/#292929 —
           те же токены, что у «Показать цену» в шапке. -->
      <button
        type="button"
        role="switch"
        aria-checked="false"
        data-modules-only
        class="group/sw hidden shrink-0 items-center gap-3 group-data-[user=dealer]:flex"
      >
        <span
          class="whitespace-nowrap text-body-n-accent text-text-primary max-md:text-m-body-n-accent"
          >Только модули</span
        >
        <span
          class="flex h-6 w-10 items-center rounded-pill bg-components-light p-0.5 transition-colors group-hover/sw:bg-components-light-hover group-aria-[checked=true]/sw:bg-surface-raised"
        >
          <span
            class="size-5 translate-x-0 rounded-pill bg-components-disabled-inverted transition-[translate,background-color] group-hover/sw:bg-components-disabled-inverted-hover group-aria-[checked=true]/sw:translate-x-4 group-aria-[checked=true]/sw:bg-components-strong"
          ></span>
        </span>
      </button>

      <!-- sort dropdown — fills the row width on mobile; у дилера ниже `md`
           это отдельная строка целиком (Figma 1806:238151, 328×44). -->
      <div
        class="relative max-md:min-w-0 max-md:group-data-[user=dealer]:w-full max-md:group-data-[user=dealer]:flex-none"
        data-sort
      >
        <button
          type="button"
          data-sort-toggle
          class="flex h-11 w-[280px] items-center justify-between gap-2 rounded-pill bg-components-subtle px-4 text-button-m text-text-primary transition-colors hover:bg-components-subtle-hover max-md:w-[240px] max-md:group-data-[user=dealer]:w-full"
          aria-expanded="false"
        >
          <span data-sort-label>Сначала популярные</span>
          <img src="../../assets/header/chevron-down.svg" alt="" class="size-6 transition-transform" data-sort-chevron />
        </button>
        <div
          data-sort-menu
          class="absolute right-0 top-[calc(100%+8px)] z-30 hidden w-[280px] overflow-hidden rounded-[var(--radius-l)] bg-surface-inverted py-2 shadow-dropdown max-md:w-[240px] max-md:group-data-[user=dealer]:w-full"
        >
          <button type="button" class="flex w-full items-center px-4 py-2.5 text-left text-body-n text-text-primary transition-colors hover:bg-components-subtle" data-sort-value="popular" aria-current="true">Сначала популярные</button>
          <button type="button" class="flex w-full items-center px-4 py-2.5 text-left text-body-n text-text-primary transition-colors hover:bg-components-subtle" data-sort-value="cheap">Сначала дешёвые</button>
          <button type="button" class="flex w-full items-center px-4 py-2.5 text-left text-body-n text-text-primary transition-colors hover:bg-components-subtle" data-sort-value="expensive">Сначала дорогие</button>
          <button type="button" class="flex w-full items-center px-4 py-2.5 text-left text-body-n text-text-primary transition-colors hover:bg-components-subtle" data-sort-value="new">По новизне</button>
          <button type="button" class="flex w-full items-center px-4 py-2.5 text-left text-body-n text-text-primary transition-colors hover:bg-components-subtle" data-sort-value="discount">По размеру скидки</button>
        </div>
      </div>
    </div>
  </div>

  <!-- quick-filter chips: shortcuts that toggle a drawer option + re-apply.
       `data-quickfilter="param=value"` names the field it drives.

       Two states of one row (Figma Catalog-default 882:89752 vs
       Catalog-selected-parameters 882:88832 / 1806:237553): with nothing
       selected the row is the full shortcut list ending in "Больше ···";
       as soon as a shortcut is on, the row becomes the *selected
       parameters* — only the active chips (grey fill + ×, click to
       release) followed by an "Очистить все" chip. catalog-listing.js ›
       syncChips() swaps between the two. On mobile the shortcut list is a
       scroll rail; the selected row wraps (the mock shows two rows). -->
  <div
    data-chips
    class="flex flex-wrap items-center gap-2 max-md:gap-1 max-xl:flex-nowrap max-xl:overflow-x-auto max-xl:scroll-rail max-xl:[&>button]:shrink-0 max-md:data-selected:flex-wrap max-md:data-selected:overflow-visible"
  >
    <button type="button" class="catalog-chip" data-quickfilter="form=pryamaya">Прямые кухни<!--#include partials/chip-close.html --></button>
    <button type="button" class="catalog-chip" data-quickfilter="form=uglovaya">Угловые кухни<!--#include partials/chip-close.html --></button>
    <button type="button" class="catalog-chip" data-quickfilter="color=belyy">Белые кухни<!--#include partials/chip-close.html --></button>
    <button type="button" class="catalog-chip" data-quickfilter="color=multicvet">Мультицвет<!--#include partials/chip-close.html --></button>
    <button type="button" class="catalog-chip" data-quickfilter="facade=mdf">Фрезированые фасады<!--#include partials/chip-close.html --></button>
    <button type="button" class="catalog-chip" data-quickfilter="facade=mdf">МДФ<!--#include partials/chip-close.html --></button>
    <button type="button" class="catalog-chip" data-quickfilter="facade=mdf-steklo">Стекло<!--#include partials/chip-close.html --></button>
    <button type="button" class="catalog-chip" data-quickfilter="style=klassika">Классика<!--#include partials/chip-close.html --></button>
    <button type="button" data-filter-open data-chip-more class="catalog-chip">Больше <span class="tracking-widest">···</span></button>
    <!-- shown only while something is selected -->
    <button type="button" data-filter-clear data-chip-clear class="catalog-chip catalog-chip--dismiss hidden">Очистить все<!--#include partials/chip-close.html --></button>
  </div>
</div>
