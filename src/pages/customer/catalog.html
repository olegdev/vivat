<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VIVAT — Каталог: Кухни</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="./catalog.js"></script>
  </head>
  <body class="bg-bg-page text-text-primary">
    <!-- Catalog listing page. Desktop = Figma Catalog-default 759:60482 (fixed
         1440 canvas); mobile = Figma catalog 1997:267656 ("малая плитка" — 2-col
         grid, funnel-only filter bar, bottom-nav). One responsive DOM, `max-md:`
         at the call site, exactly like main.html. Shared chrome (header, menus,
         bottom-nav, footer) is spliced from src/partials/; see the PHP Blade note
         in CLAUDE.md. -->
    <div class="mx-auto w-full max-md:pb-[72px] md:w-[1440px]">
      <!-- ==================== SITE HEADER ============================== -->
      <!--#include partials/header.html -->

      <!-- ==================== CATALOG MEGA-MENU ======================== -->
      <div data-catalog><!--#include partials/catalog-menu.html --></div>

      <!-- ==================== MOBILE BURGER MENU ======================= -->
      <div data-mobile-menu-root><!--#include partials/mobile-menu.html --></div>

      <!-- product-card <template>s cloned by the Популярные carousel below -->
      <!--#include partials/product-card.html -->

      <!-- ==================== BREADCRUMBS ============================== -->
      <nav class="flex items-center gap-2 px-10 py-4 text-body-s text-text-secondary max-md:px-4 max-md:py-2 max-md:text-m-body-s">
        <a href="main.html" class="transition-colors hover:text-text-primary">Главная</a>
        <img src="../../assets/header/chevron-right-s.svg" alt="" class="size-4 opacity-60" />
        <a href="#" class="transition-colors hover:text-text-primary">Каталог</a>
        <img src="../../assets/header/chevron-right-s.svg" alt="" class="size-4 opacity-60" />
        <span class="text-text-primary">Кухни VIVAT</span>
      </nav>

      <!-- ==================== TITLE BLOCK ============================== -->
      <div class="px-10 pt-2 max-md:px-4 max-md:pt-1">
        <h1 class="text-h1 text-text-primary max-md:text-m-h1">Кухни VIVAT</h1>
      </div>

      <!-- ==================== CATALOG SETTINGS (filters bar + sort) ====
           Figma catalog-settings 882:89607. Every control here opens or drives
           the same filter drawer / URL state; wiring is in catalog.js. -->
      <div class="flex flex-col gap-3 px-10 py-6 max-md:px-4 max-md:py-3">
        <div class="flex items-center justify-between max-md:gap-2">
          <!-- filter openers. Below `md` the named pills collapse to the single
               funnel button (Figma catalog-settings 1806:237128) — the drawer is
               the only way into the filters on mobile. -->
          <div class="flex items-center gap-2">
            <!-- funnel. `icon-button` (881:51240) is an auto-layout ROW — 44px
                 circle + 20px badge at gap -12, badge top-aligned — so the whole
                 control is 52 wide and the badge pushes the pills right by 8.
                 Reproduced as a flex row with `-ml-3`, not as an absolute
                 overlay; see SOLUTIONS.md › "Badges are layout, not overlay".
                 With filters applied the circle flips to the dark variant. -->
            <button type="button" data-filter-open class="filter-funnel flex h-11 shrink-0 items-center" aria-label="Открыть фильтры">
              <!-- service-icons `filter, 24 Bold` (752:60735), exported from
                   Figma; inline + currentColor so it inverts with the circle. -->
              <span class="filter-funnel__circle">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path fill-rule="evenodd" clip-rule="evenodd" d="M13 12c2.209 0 4 1.791 4 4s-1.791 4-4 4a4.002 4.002 0 0 1-3.876-3.009A1 1 0 0 1 9 17H3a1 1 0 1 1 0-2h6c.042 0 .083.003.124.008A4.002 4.002 0 0 1 13 12Zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z" />
                  <path d="M21 15a1 1 0 1 1 0 2h-2a1 1 0 1 1 0-2h2Z" />
                  <path fill-rule="evenodd" clip-rule="evenodd" d="M10 2c2.209 0 4 1.791 4 4s-1.791 4-4 4a4.002 4.002 0 0 1-3.876-3.009A1 1 0 0 1 6 7H3a1 1 0 0 1 0-2h3c.042 0 .083.003.124.008A4.002 4.002 0 0 1 10 2Zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z" />
                  <path d="M21 5a1 1 0 1 1 0 2h-5a1 1 0 1 1 0-2h5Z" />
                </svg>
              </span>
              <span data-filter-badge class="badge-number badge-number--outline -ml-3 hidden self-start">0</span>
            </button>
            <!-- named pills. A group with a selection takes the `condition=active`
                 pill (Figma 752:63467): #414141 border + a muted count. -->
            <button type="button" data-filter-open="collection" data-filter-pill="collection" class="filter-pill btn btn-m border border-border-light bg-surface-inverted text-text-primary hover:bg-components-subtle-hover max-md:hidden">Коллекция<span data-pill-count class="hidden text-text-muted"></span></button>
            <button type="button" data-filter-open="form" data-filter-pill="form" class="filter-pill btn btn-m border border-border-light bg-surface-inverted text-text-primary hover:bg-components-subtle-hover max-md:hidden">Форма кухни<span data-pill-count class="hidden text-text-muted"></span></button>
            <button type="button" data-filter-open="facade" data-filter-pill="facade" class="filter-pill btn btn-m border border-border-light bg-surface-inverted text-text-primary hover:bg-components-subtle-hover max-md:hidden">Фасады<span data-pill-count class="hidden text-text-muted"></span></button>
            <button type="button" data-filter-open="color" data-filter-pill="color" class="filter-pill btn btn-m border border-border-light bg-surface-inverted text-text-primary hover:bg-components-subtle-hover max-md:hidden">Цвет<span data-pill-count class="hidden text-text-muted"></span></button>
            <button type="button" data-filter-open="style" data-filter-pill="style" class="filter-pill btn btn-m border border-border-light bg-surface-inverted text-text-primary hover:bg-components-subtle-hover max-md:hidden">Стиль<span data-pill-count class="hidden text-text-muted"></span></button>
            <button type="button" data-filter-open="price" data-filter-pill="price" class="filter-pill btn btn-m border border-border-light bg-surface-inverted text-text-primary hover:bg-components-subtle-hover max-md:hidden">Цена<span data-pill-count class="hidden text-text-muted"></span></button>
          </div>

          <!-- sort dropdown — fills the row width on mobile -->
          <div class="relative max-md:min-w-0 max-md:flex-1" data-sort>
            <button
              type="button"
              data-sort-toggle
              class="flex h-11 w-[280px] items-center justify-between gap-2 rounded-pill bg-components-subtle px-4 text-button-m text-text-primary transition-colors hover:bg-components-subtle-hover max-md:w-full max-md:text-m-button-m"
              aria-expanded="false"
            >
              <span data-sort-label>Сначала популярные</span>
              <img src="../../assets/header/chevron-down.svg" alt="" class="size-6 transition-transform" data-sort-chevron />
            </button>
            <div
              data-sort-menu
              class="absolute right-0 top-[calc(100%+8px)] z-30 hidden w-[280px] overflow-hidden rounded-[var(--radius-l)] bg-surface-inverted py-2 shadow-dropdown max-md:w-full"
            >
              <button type="button" class="flex w-full items-center px-4 py-2.5 text-left text-body-n text-text-primary transition-colors hover:bg-components-subtle" data-sort-value="popular" aria-current="true">Сначала популярные</button>
              <button type="button" class="flex w-full items-center px-4 py-2.5 text-left text-body-n text-text-primary transition-colors hover:bg-components-subtle" data-sort-value="cheap">Сначала дешёвые</button>
              <button type="button" class="flex w-full items-center px-4 py-2.5 text-left text-body-n text-text-primary transition-colors hover:bg-components-subtle" data-sort-value="expensive">Сначала дорогие</button>
              <button type="button" class="flex w-full items-center px-4 py-2.5 text-left text-body-n text-text-primary transition-colors hover:bg-components-subtle" data-sort-value="new">По новизне</button>
              <button type="button" class="flex w-full items-center px-4 py-2.5 text-left text-body-n text-text-primary transition-colors hover:bg-components-subtle" data-sort-value="discount">По размеру скидки</button>
            </div>
          </div>
        </div>

        <!-- quick-filter chips: shortcuts that toggle a drawer option + re-apply.
             `data-quickfilter="param=value"` names the field it drives.

             Two states of one row (Figma Catalog-default 882:89752 vs
             Catalog-selected-parameters 882:88832 / 1806:237553): with nothing
             selected the row is the full shortcut list ending in "Больше ···";
             as soon as a shortcut is on, the row becomes the *selected
             parameters* — only the active chips (grey fill + ×, click to
             release) followed by an "Очистить все" chip. catalog.js ›
             syncChips() swaps between the two. On mobile the shortcut list is a
             scroll rail; the selected row wraps (the mock shows two rows). -->
        <div
          data-chips
          class="flex flex-wrap items-center gap-2 max-md:flex-nowrap max-md:overflow-x-auto max-md:scroll-rail max-md:[&>button]:shrink-0 max-md:data-selected:flex-wrap max-md:data-selected:overflow-visible"
        >
          <button type="button" class="catalog-chip" data-quickfilter="form=pryamaya">Прямые кухни<!--#include partials/chip-close.html --></button>
          <button type="button" class="catalog-chip" data-quickfilter="form=uglovaya">Угловые кухни<!--#include partials/chip-close.html --></button>
          <button type="button" class="catalog-chip" data-quickfilter="color=belyy">Белые кухни<!--#include partials/chip-close.html --></button>
          <button type="button" class="catalog-chip" data-quickfilter="color=multicvet">Мультицвет<!--#include partials/chip-close.html --></button>
          <button type="button" class="catalog-chip" data-quickfilter="facade=mdf">Фрезированые фасады<!--#include partials/chip-close.html --></button>
          <button type="button" class="catalog-chip" data-quickfilter="facade=mdf">МДФ<!--#include partials/chip-close.html --></button>
          <button type="button" class="catalog-chip" data-quickfilter="facade=mdf-steklo">Стекло<!--#include partials/chip-close.html --></button>
          <button type="button" class="catalog-chip" data-quickfilter="style=klassika">Классика<!--#include partials/chip-close.html --></button>
          <button type="button" data-filter-open data-chip-more class="catalog-chip">Больше <span class="tracking-widest">···</span></button>
          <!-- shown only while something is selected -->
          <button type="button" data-filter-clear data-chip-clear class="catalog-chip catalog-chip--dismiss hidden">Очистить все<!--#include partials/chip-close.html --></button>
        </div>
      </div>

      <!-- ==================== PRODUCTS GRID ===========================
           Figma products 2250:137837 — a 4-col grid of `cards-kitchen` size=m
           (322px). One clean card unit lives in the <template> below (the future
           Blade @foreach body); catalog.js clones it per product. -->
      <template data-card-tpl>
        <article class="flex flex-col" data-card>
          <div class="relative overflow-hidden rounded-n bg-bg-subtle">
            <div class="relative h-[242px] w-full touch-pan-y overflow-hidden max-md:aspect-[168/125] max-md:h-auto" data-card-gallery>
              <div class="flex h-full w-full transition-transform duration-300 ease-out will-change-transform" data-card-track></div>
              <div class="card-zones" data-card-zones></div>
            </div>
            <div data-card-badges class="absolute right-2 top-2 flex items-center gap-1 max-md:right-1 max-md:top-1"></div>
            <!-- Filled per photo by fillGallery(); the dots the design draws here
                 are the gallery's, not decoration. -->
            <div class="pointer-events-none absolute inset-x-0 bottom-2 flex items-center justify-center gap-2 [&>*]:pointer-events-auto max-md:bottom-1 max-md:gap-1" data-card-dots></div>
          </div>
          <div class="flex flex-col gap-1 px-1 py-3 max-md:gap-0 max-md:py-1.5">
            <div class="flex items-start gap-4 max-md:gap-0">
              <div class="flex min-w-0 flex-1 flex-col gap-0.5 max-md:gap-0">
                <div class="flex items-center gap-2 max-md:gap-1">
                  <span class="text-body-n-accent text-text-primary max-md:text-m-body-n-accent">от</span>
                  <span data-card-price class="text-h3 font-medium text-text-primary max-md:text-m-body-n-accent"></span>
                  <span data-card-oldprice class="text-body-n text-text-muted line-through max-md:text-m-body-s-crossed max-md:text-text-secondary empty:hidden"></span>
                </div>
                <p data-card-title class="line-clamp-2 h-12 text-body-n text-text-primary max-md:h-10 max-md:text-m-body-compact"></p>
              </div>
              <button type="button" data-add-to-cart class="icon-btn max-md:hidden" aria-label="В корзину">
                <img src="../../assets/header/icon-order-dark.svg" alt="" class="size-6" />
              </button>
            </div>
            <div class="flex items-center gap-4 py-1 max-md:gap-2 max-md:py-0.5">
              <div class="flex min-w-0 flex-1 items-center gap-2 max-md:gap-1">
                <div data-card-swatches class="flex items-center gap-2 max-md:gap-1"></div>
                <span data-card-more class="text-body-s text-text-secondary empty:hidden max-md:text-m-body-xs"></span>
              </div>
              <div class="flex items-center gap-1">
                <span data-card-comments class="text-body-s text-text-secondary max-md:text-m-body-xs"></span>
                <img src="../../assets/header/icon-comment.svg" alt="" class="size-4" />
              </div>
            </div>
            <!-- full-width "в корзину" pill — mobile only (Figma малая плитка) -->
            <button type="button" data-add-to-cart class="hidden h-8 w-full items-center justify-center gap-1.5 rounded-pill bg-components-subtle px-3 transition-colors hover:bg-components-subtle-hover max-md:mt-1 max-md:flex">
              <img src="../../assets/header/icon-order-dark.svg" alt="" class="size-4" />
              <span class="text-m-button-s text-text-primary">в корзину</span>
            </button>
          </div>
        </article>
      </template>

      <div data-grid class="grid grid-cols-4 gap-6 px-10 max-md:grid-cols-2 max-md:gap-2 max-md:px-2"></div>

      <!-- empty state (shown by catalog.js when a filter matches nothing) -->
      <div data-grid-empty class="hidden px-10 py-24 text-center max-md:px-4 max-md:py-16">
        <p class="text-h4 text-text-primary">Ничего не найдено</p>
        <p class="pt-2 text-body-n text-text-secondary">Попробуйте ослабить фильтры или сбросить их.</p>
        <button type="button" data-filter-clear class="btn btn-m btn-secondary mt-6">Сбросить фильтры</button>
      </div>

      <!-- ==================== PAGINATION ==============================
           Presentational in the prototype — real paging is a server concern
           (part of the same request seam as the filters). -->
      <section class="flex flex-col items-center gap-10 px-10 py-16 max-md:gap-8 max-md:px-4 max-md:py-10">
        <button type="button" class="btn btn-m btn-primary max-md:w-full max-md:text-m-button-m">
          Показать еще 40 товаров из <span data-grid-total>123</span>
        </button>
        <nav class="flex items-center gap-6 text-body-n">
          <a href="#" class="flex items-center gap-2 text-text-secondary transition-colors hover:text-text-primary max-md:hidden">
            <img src="../../assets/header/chevron-left.svg" alt="" class="size-5 opacity-60" />
            В начало
          </a>
          <!-- On mobile the middle pages collapse to an ellipsis (Figma pagination
               1806:236599): 1 2 3 4 … 7. -->
          <div class="flex items-center gap-1">
            <button type="button" class="flex size-9 items-center justify-center rounded-full bg-components-subtle text-text-primary" aria-current="page">1</button>
            <button type="button" class="flex size-9 items-center justify-center rounded-full text-text-primary transition-colors hover:bg-components-subtle">2</button>
            <button type="button" class="flex size-9 items-center justify-center rounded-full text-text-primary transition-colors hover:bg-components-subtle">3</button>
            <button type="button" class="flex size-9 items-center justify-center rounded-full text-text-primary transition-colors hover:bg-components-subtle">4</button>
            <span class="hidden size-9 items-center justify-center text-text-secondary max-md:flex">…</span>
            <button type="button" class="flex size-9 items-center justify-center rounded-full text-text-primary transition-colors hover:bg-components-subtle max-md:hidden">5</button>
            <button type="button" class="flex size-9 items-center justify-center rounded-full text-text-primary transition-colors hover:bg-components-subtle max-md:hidden">6</button>
            <button type="button" class="flex size-9 items-center justify-center rounded-full text-text-primary transition-colors hover:bg-components-subtle">7</button>
          </div>
          <a href="#" class="flex items-center gap-2 text-text-primary transition-colors hover:text-text-secondary max-md:hidden">
            В конец
            <img src="../../assets/header/chevron-right.svg" alt="" class="size-5" />
          </a>
        </nav>
      </section>

      <!-- ==================== CAROUSEL: Популярные товары ============= -->
      <div data-section="popular"></div>

      <div class="h-20 max-md:h-8"></div>

      <!-- ==================== SEO / INFO BLOCK ======================== -->
      <!--#include partials/seo-kitchens.html -->

      <!-- ==================== BOTTOM NAV (mobile) ===================== -->
      <!--#include partials/bottom-nav.html -->

      <!-- ==================== FOOTER ================================== -->
      <!--#include partials/footer.html -->
    </div>

    <!-- ==================== FILTER DRAWER (overlay) =================== -->
    <!--#include partials/catalog-filters.html -->
  </body>
</html>
