<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VIVAT — Главная (customer)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="./main.js"></script>
  </head>
  <body class="bg-bg-page text-text-primary">
    <!-- Two canvases, one DOM: fluid below `md` (Figma customer/body, 360px)
         and the fixed 1440px desktop canvas (Figma customer/Main) at and above
         it. Shared chrome (header, menus, bottom-nav, footer) lives in
         src/partials/ and is spliced in at build time by the html-includes
         plugin — see the PHP Blade note in CLAUDE.md. -->
    <div class="mx-auto w-full max-md:pb-[72px] md:w-[1440px]">
      <!-- ==================== SITE HEADER (mobile + desktop) ============ -->
      <!--#include partials/header.html -->

      <!-- ==================== CATALOG MEGA-MENU ========================= -->
      <!-- Shell is partials/catalog-menu.html; col1/col2/col3 filled and swapped
           by catalog-menu.js, opened by the "Весь каталог" button. -->
      <div data-catalog><!--#include partials/catalog-menu.html --></div>

      <!-- ==================== MOBILE BURGER MENU ======================== -->
      <!-- Shell is partials/mobile-menu.html; drill-down list + behaviour in
           mobile-menu.js. Below `md` only; opened by the header burger and by
           the bottom-nav "Каталог" item. -->
      <div data-mobile-menu-root><!--#include partials/mobile-menu.html --></div>

      <!-- ==================== SEARCH OVERLAY ============================ -->
      <!-- Shell + templates in partials/search-overlay.html; opened from any
           [data-search] field (desktop header, burger menu) by search.js. -->
      <!--#include partials/search-overlay.html -->

      <!-- product-card <template>s cloned by the carousels (inert markup) -->
      <!--#include partials/product-card.html -->

      <!-- carousel-section <template>s cloned by every rail on this page -->
      <!--#include partials/carousel-section.html -->

      <!-- promo-card <template>s cloned by the promo tiles below -->
      <!--#include partials/promo-card.html -->

      <!-- hero <template>s cloned by hero-slider.js -->
      <!--#include partials/hero.html -->

      <!-- ============================ ALERT ============================= -->
      <div
        class="flex h-10 w-full items-center justify-center bg-accent-yellow-200 px-4 max-md:h-auto max-md:min-h-12 max-md:py-1 md:w-[1440px]"
      >
        <p class="text-center text-body-s text-text-primary max-md:text-m-body-n">
          Обращаем внимание покупателей, что 22.07.2026 мы работаем по сокращенному графику!
          <a href="#" class="underline">Подробнее</a>
        </p>
      </div>

      <!-- ============================ HERO SLIDER ======================== -->
      <div data-hero></div>

      <!-- spacing (mobile uses the section's own 32px lead-in instead) -->
      <div class="h-10 max-md:hidden"></div>

      <!--#include partials/categories.html -->

      <!-- ==================== CAROUSEL: Модульные кухни ================== -->
      <div data-section="modular"></div>

      <!-- ==================== CAROUSEL: Популярные товары =============== -->
      <div data-section="popular"></div>

      <!--#include partials/promo-row.html -->

      <!--#include partials/socials.html -->

      <!-- ==================== CAROUSEL: Акции и скидки ================= -->
      <div data-section="akcii"></div>

      <!-- 96px spacing (mobile: the section's own 40px lead-in) -->
      <div class="h-24 max-md:hidden"></div>

      <!-- ==================== Наши салоны + карта ===================== -->
      <!-- Shell is partials/stores.html; dealer list + live Yandex Maps and the
           "только фирменные" filter are wired by stores-map.js. -->
      <div data-section="salony"><!--#include partials/stores.html --></div>


      <!--#include partials/production.html -->

      <!-- ==================== BOTTOM NAV (mobile) ====================== -->
      <!--#include partials/bottom-nav.html -->

      <!-- ==================== FOOTER ================================== -->
      <!--#include partials/footer.html -->
    </div>

    <!-- ==================== МОДАЛЬНЫЕ ОКНА ============================= -->
    <!--#include partials/modals.html -->
  </body>
</html>
