<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VIVAT — Кухня Фьюжн-05</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="./pdp.js"></script>
  </head>
  <body class="bg-bg-page text-text-primary">
    <!-- Product page (PDP). Desktop = Figma PDP 914:101099 (fixed 1440 canvas),
         plus three frames that are states of it rather than separate screens:
         sticky price 1884:366246, PDP-package 922:126723 and PDP-docs 942:34310
         — the last two are panels of the Характеристики tab bar.

         Mobile is Figma 1997:305719 (the full 360 page) plus the DPD viewport
         frame 2027:83602, which is where the always-on CTA bar comes from, and
         2028:114053 / 2029:116633, the Модули and Документы panels at 360.

         Almost every section below is a component the other pages already own:
         the carousel rail, the product cards, the stores map, the green SEO
         band and the shared chrome from src/partials/.

         Below `md` the page reserves 132px: the 72px bottom nav plus the 60px
         CTA bar stacked on top of it. -->
    <!-- Три слоя: мобильный ниже `md` (1997:305719), планшетный до `xl`
         (PDP 2483:238824 и витрина 2483:246910) и текучий десктопный выше.
         Широкого фрейма у PDP нет — сделано по аналогии с каталогом: что
         тянется, тянется до 1900, пропорции кадров сохраняются.
         Резерв снизу — тапбар 72 плюс бар CTA 60/64 — теперь и на планшете. -->
    <div class="w-full max-xl:pb-[136px] max-md:pb-[132px]">
      <!-- ==================== SITE HEADER ============================== -->
      <!--#include partials/header.html -->

      <!-- ==================== CATALOG MEGA-MENU ======================== -->
      <div data-catalog><!--#include partials/catalog-menu.html --></div>

      <!-- ==================== MOBILE BURGER MENU ======================= -->
      <div data-mobile-menu-root><!--#include partials/mobile-menu.html --></div>

      <!-- ==================== SEARCH OVERLAY ============================ -->
      <!-- Shell + templates in partials/search-overlay.html; opened from any
           [data-search] field (desktop header, burger menu) by search.js. -->
      <!--#include partials/search-overlay.html -->

      <!-- <template>s cloned by the sections below (inert markup) -->
      <!--#include partials/product-card.html -->
      <!--#include partials/review-card.html -->
      <!--#include partials/carousel-section.html -->

      <!-- ==================== BREADCRUMBS ============================== -->
      <!-- Figma breadcrumbs 1058:176780: FOUR steps — Главная / Каталог / Кухни /
           the product — not three; the old "Кухни VIVAT" merged two steps into
           one. "Каталог" has no page of its own — points at catalog.html, same
           as pdp-module.html's own breadcrumbs do for this step. -->
      <nav class="page-x flex items-center gap-2 py-4 text-body-n-accent md:leading-6 text-text-secondary max-md:h-10 max-md:text-m-body-s">
        <a href="main.html" class="transition-colors hover:text-text-primary">Главная</a>
        <span aria-hidden="true">•</span>
        <a href="catalog.html" class="transition-colors hover:text-text-primary">Каталог</a>
        <span aria-hidden="true">•</span>
        <a href="catalog.html" class="transition-colors hover:text-text-primary">Кухни</a>
        <span aria-hidden="true">•</span>
        <span class="text-text-primary">Кухня Фьюжн-05</span>
      </nav>

      <!-- ==================== SECTION ANCHOR BAR ======================
           Figma Tab 914:103288 — five labels over the photo column, each
           jumping to a section of the page. It sits in the flow, not pinned:
           the "sticky price" frame shows the page scrolled well past it with
           no bar in sight. The design's sixth `tab` instance renders empty, so
           it is absent here (CLAUDE.md › don't invent elements). -->
      <!-- На планшете якорный бар остаётся (Tab 2483:238827, 768x50 с полем 24),
           а на мобиле его нет вовсе. -->
      <div class="page-x flex h-[50px] items-center gap-6 max-xl:overflow-x-auto max-xl:scroll-rail max-xl:[&>a]:shrink-0 max-md:hidden" data-section-nav>
        <a href="#photos" class="pdp-tab" aria-selected="true">Фото</a>
        <a href="#specs" class="pdp-tab">Характеристики</a>
        <a href="#modules" class="pdp-tab">Модули</a>
        <a href="#reviews" class="pdp-tab">Отзывы</a>
        <a href="#where" class="pdp-tab">Где купить</a>
      </div>

      <!-- ==================== MEDIA (photos + summary) =================
           Figma media 914:103305 — a 1360 content row: the 900px photo column
           (three 671px shots, 14px apart) and the 412px summary card. The
           summary is `self-start`, so it stays at the top of a much taller
           photo column exactly as the frame draws it.

           Below `md` the same three shots become one swipeable rail of 344×256
           slides (Figma 1997:308027), with the badges and the share action on
           each slide and a dot per photo underneath — one DOM, the column just
           turns into a snapping row. -->
      <!-- Ниже `xl` колонка фотографий становится одним свайпающимся рядом:
           на планшете это кадр 720x536.8 с точками (image-container
           2483:238830), на мобиле — 344x256. Одна и та же разметка, меняется
           только размер слайда. -->
      <!-- Зазор 48 задан явно: колонка фото стала `flex-1`, и без него она
           съедала бы промежуток. На 1440 это даёт нарисованные 900 + 48 + 412,
           на 1900 колонка растёт до 1360, а сводка остаётся 412. -->
      <section class="page-x flex gap-12 max-xl:flex-col max-xl:gap-0 max-xl:px-0" id="photos">
        <div
          class="flex min-w-0 flex-1 flex-col gap-3.5 max-xl:w-full max-xl:flex-none max-xl:snap-x max-xl:snap-mandatory max-xl:flex-row max-xl:overflow-x-auto max-xl:scroll-rail max-xl:scroll-pl-6 max-xl:gap-6 max-xl:px-6 max-md:scroll-pl-2 max-md:gap-2 max-md:px-2"
          data-photo-rail
        >
          <div class="aspect-[900/671] overflow-hidden rounded-n max-xl:relative max-xl:aspect-[720/537] max-xl:w-full max-xl:shrink-0 max-xl:snap-start max-xl:bg-bg-subtle max-md:aspect-[344/256]">
            <img src="../../assets/pdp/photo-1-src.png" alt="Кухня Фьюжн-05" class="size-full object-cover" />
            <!--#include partials/pdp-photo-overlay.html -->
          </div>
          <div class="aspect-[900/671] overflow-hidden rounded-n max-xl:relative max-xl:aspect-[720/537] max-xl:w-full max-xl:shrink-0 max-xl:snap-start max-xl:bg-bg-subtle max-md:aspect-[344/256]">
            <img src="../../assets/pdp/photo-3-src.png" alt="Кухня Фьюжн-05, открытые фасады" class="size-full object-cover" />
            <!--#include partials/pdp-photo-overlay.html -->
          </div>
          <div class="aspect-[900/671] overflow-hidden rounded-n max-xl:relative max-xl:aspect-[720/537] max-xl:w-full max-xl:shrink-0 max-xl:snap-start max-xl:bg-bg-subtle max-md:aspect-[344/256]">
            <img src="../../assets/pdp/photo-2-src.png" alt="Кухня Фьюжн-05, ящик с органайзером" class="size-full object-cover" />
            <!--#include partials/pdp-photo-overlay.html -->
          </div>
        </div>

        <!-- one dot per photo, mobile only; pdp.js mirrors the rail's scroll -->
        <div class="hidden items-center justify-center gap-2 pt-0 max-xl:flex" data-photo-dots></div>

        <!--#include partials/pdp-summary.html -->
      </section>

      <!-- ==================== ХАРАКТЕРИСТИКИ ========================== -->
      <!--#include partials/pdp-specs.html -->

      <!-- ==================== CAROUSEL: Модули ======================== -->
      <div data-section="modules"></div>

      <!-- ==================== CAROUSEL: Добавьте в корзину ============ -->
      <div data-section="add-to-cart"></div>

      <!-- ==================== CAROUSEL: Отзывы ======================== -->
      <div data-section="reviews"></div>

      <!-- ==================== CAROUSEL: Вся коллекция Фьюжн =========== -->
      <div data-section="collection"></div>

      <div class="h-20 max-md:h-10"></div>

      <!-- ==================== ГДЕ КУПИТЬ (map + dealers) ==============
           Figma map-general 1686:58697 — the home page's stores block on its
           own `surface-accent` band, under this page's heading. -->
      <div data-section="salony"><!--#include partials/stores.html --></div>

      <!-- ==================== SEO / INFO BLOCK ======================== -->
      <!--#include partials/seo-kitchens.html -->

      <!-- ==================== BOTTOM NAV (mobile) ===================== -->
      <!--#include partials/bottom-nav.html -->

      <!-- ==================== FOOTER ================================== -->
      <!--#include partials/footer.html -->
    </div>

    <!-- ==================== STICKY PRICE BAR (overlay) ================ -->
    <!--#include partials/sticky-price.html -->

    <!-- ==================== МОДАЛЬНЫЕ ОКНА ============================= -->
    <!--#include partials/modals.html -->
  </body>
</html>
