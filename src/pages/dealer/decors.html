<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VIVAT — Каталог декоров (dealer)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@100;400;500;600&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="./decors.js"></script>
  </head>
  <body class="group bg-bg-page text-text-primary">
    <!--#include partials/session.html -->
    <!-- «Каталог декоров» — контентная страница дилерского раздела.
         1440 — Figma 1488:127306, 360 — 2241:186252.

         Не дерево документов, а сетка образцов: карточка 207×203 — образец
         155 и подпись 48, четыре в ряд с шагом 8.

         Панель настроек здесь — тот же компонент, что у каталога, но в другой
         сборке: воронка и три пилюли, справа тумблер «Товары в этом цвете»
         вместо сортировки. Второй кадр (1488:69674) показывает её с чипсами
         выбранных параметров и счётчиками у пилюль — это состояние собрано, а
         шторка сделана по каталожной, потому что своей макет не рисует:
         названия групп с пилюль, значения — только названные в кадре
         («ДСП», «Светлые»), у «Структуры» пусто. См. BACKLOG. -->
    <div class="w-full max-xl:pb-[72px]">
      <!-- ==================== SITE HEADER ============================== -->
      <!--#include partials/header.html -->

      <!-- ==================== CATALOG MEGA-MENU ======================== -->
      <div data-catalog><!--#include partials/catalog-menu.html --></div>

      <!-- ==================== MOBILE BURGER MENU ======================= -->
      <div data-mobile-menu-root><!--#include partials/mobile-menu.html --></div>

      <!-- ==================== SEARCH OVERLAY ============================ -->
      <!-- Оверлею поиска нужны <template> карточек: рекомендации в пустом
           состоянии и результаты клонируют их. -->
      <!--#include partials/product-card.html -->
      <!--#include partials/search-overlay.html -->

      <!-- ==================== ПРАЙС-ЛИСТ ДИЛЕРА ========================= -->
      <!--#include partials/price-mode.html -->

      <!-- <template>ы, которые клонируются в колонку ниже -->
      

      <!-- ==================== ЗАГОЛОВОК РАЗДЕЛА ========================
           title-block 1167:79694 — spacing 24, строка 44, spacing 24. -->
      <div class="page-x py-6 max-md:hidden">
        <div class="flex h-11 items-center">
          <h1 class="text-h1 text-text-primary">Для бизнеса</h1>
        </div>
      </div>

      <!-- ==================== ШАПКА РАЗДЕЛА НА 360 =====================
           Ниже md заголовочный блок и левое меню заменяются этим блоком
           (2225:132266, 104): «Для бизнеса» и селектор с именем страницы. -->
      <!--#include partials/for-business-header.html -->

      <!-- ==================== МЕНЮ + КОЛОНКА ===========================
           general-container 1167:79696 — 40 + 298 + 40 + 1022 + 40 = 1440. -->
      <div class="page-x flex gap-10 max-xl:flex-col max-xl:gap-0 max-xl:px-0">
        <!--#include partials/menu-b2b.html -->

        <div class="min-w-0 flex-1 px-20 max-xl:w-full max-xl:flex-none max-xl:px-6 max-md:px-4" data-content-column>
          <!-- title-text-page 1488:127313 — 862×36, без верхней отбивки:
               панель настроек начинается сразу под заголовком. -->
          <h2 class="text-h2 text-text-primary max-md:hidden">Каталог декоров</h2>

          <!-- catalog-settings 1488:127314 — 862×92. Ниже md (2241:186647,
               360×68) именованные пилюли схлопываются в одну воронку, как и в
               каталоге, а тумблер остаётся. -->
          <div class="flex flex-col gap-3 py-6 max-md:py-3">
            <div class="flex items-center gap-2">
              <button
                type="button"
                data-filter-open
                class="filter-funnel flex h-11 shrink-0 items-center"
                aria-label="Открыть фильтры"
              >
                <span class="filter-funnel__circle">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M13 12c2.209 0 4 1.791 4 4s-1.791 4-4 4a4.002 4.002 0 0 1-3.876-3.009A1 1 0 0 1 9 17H3a1 1 0 1 1 0-2h6c.042 0 .083.003.124.008A4.002 4.002 0 0 1 13 12Zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z" />
                    <path d="M21 15a1 1 0 1 1 0 2h-2a1 1 0 1 1 0-2h2Z" />
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M10 2c2.209 0 4 1.791 4 4s-1.791 4-4 4a4.002 4.002 0 0 1-3.876-3.009A1 1 0 0 1 6 7H3a1 1 0 0 1 0-2h3c.042 0 .083.003.124.008A4.002 4.002 0 0 1 10 2Zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z" />
                    <path d="M21 5a1 1 0 1 1 0 2h-5a1 1 0 1 1 0-2h5Z" />
                  </svg>
                </span>
                <span data-filter-badge class="badge-number badge-number--outline -ml-3 hidden self-start">0</span>
              </button>
              <button type="button" data-filter-open="structure" data-filter-pill="structure" class="filter-pill btn btn-m border border-border-default bg-surface-inverted font-normal text-text-primary hover:bg-components-subtle-hover max-md:hidden">Структура<span data-pill-count class="hidden text-text-muted"></span></button>
              <button type="button" data-filter-open="material" data-filter-pill="material" class="filter-pill btn btn-m border border-border-default bg-surface-inverted font-normal text-text-primary hover:bg-components-subtle-hover max-md:hidden">Материал<span data-pill-count class="hidden text-text-muted"></span></button>
              <button type="button" data-filter-open="color" data-filter-pill="color" class="filter-pill btn btn-m border border-border-default bg-surface-inverted font-normal text-text-primary hover:bg-components-subtle-hover max-md:hidden">Цвет<span data-pill-count class="hidden text-text-muted"></span></button>

              <label class="group/sw ml-auto flex shrink-0 cursor-pointer items-center gap-3">
                <span class="text-body-n-accent text-text-primary max-md:text-m-body-n-accent">Товары в этом цвете</span>
                <input type="checkbox" class="peer sr-only" data-decor-color-only />
                <span class="relative block h-6 w-10 shrink-0 rounded-full bg-components-disabled transition-colors peer-checked:bg-components-red">
                  <span class="absolute left-0.5 top-0.5 size-5 rounded-full bg-surface-inverted transition-transform peer-checked:translate-x-4"></span>
                </span>
              </label>
            </div>

            <!-- Ряд выбранных параметров: чипсы значений и «Очистить все»
                 (1488:69674). Наполняет decor-filters.js; пустой ряд прячет
                 себя сам, поэтому по умолчанию панель остаётся 92. -->
            <div data-filter-chips class="flex flex-wrap items-center gap-2 empty:hidden"></div>
          </div>

          <!-- сетка 1488:127315 — 4 колонки по 207, шаг 8 -->
          <div
            class="grid grid-cols-[repeat(4,207px)] gap-2 max-xl:grid-cols-4 max-md:grid-cols-2 max-md:gap-2"
            data-decors
          ></div>

          <!-- pagination 1488:127364 — тот же блок, что у каталога, но
               страниц в инстансе три, а не семь. На 360 постранички нет вовсе:
               в кадре (2241:186255) за сеткой сразу идёт отбивка и подвал. -->
          <div class="max-md:hidden">
            <!--#include partials/pagination.html -->
          </div>
        </div>
      </div>

      <div class="h-24 max-md:h-20"></div>

      <!-- ==================== BOTTOM NAV (mobile) ===================== -->
      <!--#include partials/bottom-nav.html -->

      <!-- ==================== FOOTER ================================== -->
      <!--#include partials/footer.html -->
    </div>

    <!-- одна карточка декора (future @foreach($decors as $d)) -->
    <template data-decor-card>
      <article class="flex flex-col">
        <img class="aspect-[207/155] w-full object-cover" alt="" data-decor-img />
        <!-- Info 1488:66003 — 48 = 12 + строка 16/24 + 12, отступ по бокам 4;
             на 360 (1821:326452) тот же кегль и та же коробка. -->
        <p class="px-1 py-3 text-body-n text-text-primary max-md:text-m-body-l" data-decor-name></p>
      </article>
    </template>

    <!-- ==================== ШТОРКА ФИЛЬТРОВ ============================ -->
    <!--#include partials/decor-filters.html -->

    <!-- ==================== МОДАЛЬНЫЕ ОКНА ============================= -->
    <!--#include partials/modals.html -->
  </body>
</html>
