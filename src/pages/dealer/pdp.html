    <!-- Дилерская страница товара. 1440 — Figma PDP 953:122180, две его панели
         вкладок — PDP-package 1686:59341 и PDP-docs 1686:59383.

         Фрейм совпадает с покупательским (914:101099) нода в ноду: та же
         якорная панель над фото, та же колонка 900×2041, тот же блок
         «Характеристики» вместе с обеими панелями, те же четыре рельса с той же
         копией, тот же блок «Где купить» и та же зелёная SEO-полоса.

         Отличий ровно пять, и четыре из них — обвязка:
           · шапка `type=b2b` и подвал `user=Dealer` (оба по data-user);
           · сводка — вариант `Customer=b2b` (953:142727): цена без «от» и без
             строки notice, отчего панель 392 вместо 441;
           · блок «Отзывы» → «Вся коллекция» лежит на `#f8f8f8` (1686:63218),
             у покупателя он белый;
           · перед этой серой полосой фрейм ставит спейсер 80, которого у
             покупателя нет.

         Мобильных фреймов у дилерского PDP нет. Тело ниже `md` — покупательский
         мобильный PDP (1997:305719 и панели), обвязка — дилерская из
         2225:160540. Что выведено без макета, перечислено в BACKLOG.

         Ниже `md` страница резервирует 132px: 72px нижней навигации плюс 60px
         панели заказа над ней. -->

      <!--#include partials/header.html -->

      <!-- ==================== SECTION ANCHOR BAR ======================

      <!-- ==================== MEDIA (photos + summary) =================
           Figma media 953:122184 — 1360 контента: колонка фото 900 (три кадра
           по 671 с шагом 14) и панель сводки 412. Ниже `md` та же колонка
           становится рельсом слайдов 344×256 со снапом и точками. -->
      <section class="flex justify-between px-10 max-md:flex-col max-md:px-0" id="photos">
        <div
          class="flex w-[900px] flex-col gap-3.5 max-md:w-full max-md:snap-x max-md:snap-mandatory max-md:scroll-pl-2 max-md:flex-row max-md:gap-2 max-md:overflow-x-auto max-md:px-2 max-md:scroll-rail"

            <!--#include partials/pdp-photo-overlay.html -->

          <div class="h-[671px] overflow-hidden rounded-n max-md:relative max-md:h-64 max-md:w-full max-md:shrink-0 max-md:snap-start max-md:bg-bg-subtle">

            <!--#include partials/pdp-photo-overlay.html -->

          <div class="h-[671px] overflow-hidden rounded-n max-md:relative max-md:h-64 max-md:w-full max-md:shrink-0 max-md:snap-start max-md:bg-bg-subtle">
            <img src="../../assets/pdp/photo-2-src.png" alt="Кухня Фьюжн-05, ящик с органайзером" class="size-full object-cover" />
            <!--#include partials/pdp-photo-overlay.html -->

        </div>

        <!-- one dot per photo, mobile only; pdp.js mirrors the rail's scroll -->
        <div class="hidden items-center justify-center gap-2 pt-0 max-md:flex" data-photo-dots></div>

        <!--#include partials/pdp-summary.html -->

      <!-- ==================== ХАРАКТЕРИСТИКИ ========================== -->

      <!-- Спейсер 1686:68707 — 80px белого перед серой полосой. У покупателя
           рельс «Добавьте в корзину» им не заканчивается (617 против 697). -->
      <div class="h-20 max-md:h-10"></div>

      <!-- ==================== СЕРАЯ ПОЛОСА (1686:63218) ===============
           Отзывы, «Вся коллекция Фьюжн» и отступ под ними лежат на `#f8f8f8`.

      <div class="bg-bg-subtle">
        <!-- ==================== CAROUSEL: Отзывы ====================== -->
        <div data-section="reviews"></div>

        <!-- ==================== CAROUSEL: Вся коллекция Фьюжн ========= -->
        <div data-section="collection"></div>

        <div class="h-20 max-md:h-10"></div>

      <!-- ==================== ГДЕ КУПИТЬ (map + dealers) ==============
