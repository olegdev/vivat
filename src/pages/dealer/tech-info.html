<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VIVAT — Техническая информация (dealer)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@100;400;500;600&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="./tech-info.js"></script>
  </head>
  <body class="group bg-bg-page text-text-primary">
    <!--#include partials/session.html -->
    <!-- «Техническая информация» — контентная страница дилерского раздела.
         1440 — Figma tehnicheskaya-informaciya 1463:60856.

         **Мобильного фрейма у страницы нет.** Ниже md она построена по тем же
         правилам, что «Сертификаты» и «Схемы сборки», у которых кадры есть:
         заголовок и поле поиска скрыты, имя страницы несёт селектор в шапке
         раздела, дальше сразу дерево. Решение записано в BACKLOG. -->
    <div class="w-full max-xl:pb-[72px]">
      <!-- ==================== SITE HEADER ============================== -->
      <!--#include partials/header.html -->

      <!-- ==================== CATALOG MEGA-MENU ======================== -->
      <div data-catalog><!--#include partials/catalog-menu.html --></div>

      <!-- ==================== MOBILE BURGER MENU ======================= -->
      <div data-mobile-menu-root><!--#include partials/mobile-menu.html --></div>

      <!-- ==================== SEARCH OVERLAY ============================ -->
      <!-- Оверлею поиска нужны <template> карточек: рекомендации в пустом
           состоянии и результаты клонируют их. -->
      <!--#include partials/product-card.html -->
      <!--#include partials/search-overlay.html -->

      <!-- ==================== ПРАЙС-ЛИСТ ДИЛЕРА ========================= -->
      <!--#include partials/price-mode.html -->

      <!-- <template>ы, которые клонируются в колонку ниже -->
      

      <!-- ==================== ЗАГОЛОВОК РАЗДЕЛА ========================
           title-block 1167:79694 — spacing 24, строка 44, spacing 24. -->
      <div class="page-x py-6 max-md:hidden">
        <div class="flex h-11 items-center">
          <h1 class="text-h1 text-text-primary">Для бизнеса</h1>
        </div>
      </div>

      <!-- ==================== ШАПКА РАЗДЕЛА НА 360 =====================
           Ниже md заголовочный блок и левое меню заменяются этим блоком
           (2225:132266, 104): «Для бизнеса» и селектор с именем страницы. -->
      <!--#include partials/doc-tree.html -->

      <!--#include partials/for-business-header.html -->

      <!-- ==================== МЕНЮ + КОЛОНКА ===========================
           general-container 1167:79696 — 40 + 298 + 40 + 1022 + 40 = 1440. -->
      <div class="page-x flex gap-10 max-xl:flex-col max-xl:gap-0 max-xl:px-0">
        <!--#include partials/menu-b2b.html -->

        <div class="min-w-0 flex-1 px-20 max-xl:w-full max-xl:flex-none max-xl:px-6 max-md:px-4" data-content-column>
          <!-- title-text-page 862×68: заголовок 36 сверху, отбивка 32 под ним —
               поле поиска начинается на 68. -->
          <h2 class="pb-8 text-h2 text-text-primary max-md:hidden">Техническая информация</h2>

          <!-- Поле поиска 1463:60811 — 862×44, белое, с линией снизу и
               иконкой у правого края. Что оно ищет, макет не описывает:
               прототипа на нём нет (см. BACKLOG).

               Ниже md поля нет вовсе: мобильный фрейм начинается сразу с
               дерева документов, а имя страницы несёт селектор в шапке. -->
          <!-- Поле фильтрует дерево на месте (doc-tree.js), никуда не
               отправляется — потому у формы и нет `action`. -->
          <form
            role="search"
            class="flex h-11 items-center gap-4 border-b border-border-default px-4 max-md:hidden"
          >
            <input
              type="search"
              name="q"
              data-doc-search
              placeholder="Поиск по документам"
              aria-label="Поиск по документам"
              autocomplete="off"
              class="min-w-0 flex-1 bg-transparent text-body-s-accent text-text-primary outline-none placeholder:text-text-secondary"
            />
            <img src="../../assets/header/icon-search.svg" alt="" class="size-6 shrink-0" />
          </form>

          <!-- documents-content 1463:60818 — padV 24, зазор между группами 8 -->
          <div class="flex flex-col gap-2 py-6 max-md:py-4" data-doc-tree></div>
        </div>
      </div>

      <div class="h-24 max-md:h-20"></div>

      <!-- ==================== BOTTOM NAV (mobile) ===================== -->
      <!--#include partials/bottom-nav.html -->

      <!-- ==================== FOOTER ================================== -->
      <!--#include partials/footer.html -->
    </div>

    <!-- ==================== МОДАЛЬНЫЕ ОКНА ============================= -->
    <!--#include partials/modals.html -->
  </body>
</html>
