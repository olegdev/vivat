<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VIVAT — Мой заказ (dealer)</title>
    <!--#include partials/schema-org.html -->
    <!-- Хлебные крошки для поиска (schema.org/BreadcrumbList). Видимых крошек
         на этой странице нет — макет их не рисует; цепочка построена по имени
         страницы. См. docs/superpowers/specs/2026-09-10-schema-org-design.md -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "Главная", "item": "https://mebel.com/" },
          { "@type": "ListItem", "position": 2, "name": "Мой заказ" }
        ]
      }
    </script>
    <!--#include partials/fonts.html -->
    <script type="module" src="./order.js"></script>
  </head>
  <body class="group bg-bg-page text-text-primary" data-user="dealer">
    <!-- Дилерское оформление заказа. 1440 — Figma Order 1209:95219 и
         Order-b2b-delivery 1415:67609, 360 — catalog 2225:167283.

         Пошаговой машины здесь нет: два фрейма на 1440 — одна страница в двух
         состояниях, и отличается только тело карточки «Доставка» (264 → 616).
         Состояние живёт на самой карточке как `data-delivery`, см.
         partials/order-forms.html. На 360 всё это идёт одним скроллом:
         корзина, сводка, форма — экранов там тоже не два.

         От покупательского заказа отличается ровно тем, что нарисовано:
         дилерская обвязка, корзина с модулями, сводка со «Способом оплаты» и
         «Доставкой» вместо «Итого», и форма на четыре карточки вместо шага 1
         (выбор магазина) и шага 2 (контакты). -->
    <div class="w-full max-xl:pb-[132px]" data-order>
      <!-- ==================== SITE HEADER (desktop only) =============== -->
      <div class="max-md:hidden">
        <!--#include partials/header.html -->
      </div>

      <!-- ==================== CATALOG MEGA-MENU ======================== -->
      <div data-catalog><!--#include partials/catalog-menu.html --></div>

      <!-- ==================== MOBILE BURGER MENU ======================= -->
      <div data-mobile-menu-root><!--#include partials/mobile-menu.html --></div>

      <!-- ==================== SEARCH OVERLAY ============================ -->
      <!--#include partials/search-overlay.html -->

      <!-- product-card <template>s — the search overlay's results need them -->
      <!--#include partials/product-card.html -->

      <!-- ==================== ПРАЙС-ЛИСТ ДИЛЕРА ========================= -->
      <!--#include partials/price-mode.html -->

      <!-- ==================== MOBILE MODAL HEADER =====================
           Figma header 2225:167284 — the same modal bar the customer order
           uses, titled «Оформление заказа». One title, because this page has
           no steps to name. -->
      <header class="sticky top-0 z-50 hidden border-b border-divider-light bg-surface-inverted px-4 py-1 max-md:block">
        <!-- Глифы прижаты к краям своих коробок 40×40, а не стоят в них по
             центру: в 2225:202955 шеврон лежит на x=0 коробки, а крестик —
             на x=16 (`align=MAX`). Так они попадают ровно над галочкой
             «Выбрать все» и над «поделиться» в шапке корзины ниже, которые в
             кадре стоят на 16 и на 320 (2225:202958). -->
        <div class="flex items-center gap-0">
          <a href="catalog.html" class="flex size-10 shrink-0 items-center justify-start" aria-label="Назад">
            <img src="../../assets/header/chevron-left.svg" alt="" class="size-6" />
          </a>
          <div class="flex min-w-0 flex-1 flex-col justify-center py-2">
            <p class="truncate text-m-h3 text-text-primary">Оформление заказа</p>
          </div>
          <a href="main.html" class="flex size-10 shrink-0 items-center justify-end" aria-label="Закрыть">
            <img src="../../assets/header/icon-close-s.svg" alt="" class="size-6" />
          </a>
        </div>
      </header>

      <!-- <template>s cloned by the cart below (inert markup) -->
      <!--#include partials/cart-card.html -->
      <!--#include partials/order-modules.html -->

      <!-- ==================== TITLE (desktop only) =====================
           title-block 1209:95221 — «Мой заказ», empty `buttons` frame. The 360
           frame carries no H1; the modal bar above is its title. -->
      <div class="page-x pt-6 max-md:hidden">
        <h1 class="text-h1 text-text-primary">Мой заказ</h1>
      </div>
      <div class="h-6 max-md:hidden"></div>

      <!-- ==================== КОРЗИНА + ФОРМЫ + СВОДКА ==================
           top 1209:95222: the 990 cart panel and the 322 summary with a 47px
           gutter inside the page's 40px margins. Below `md` the two stack and
           the panel goes full-bleed (2225:167285).

           Сводка (`aside`) висит рядом со ВСЕЙ левой колонкой — корзиной и
           формами вместе, не только корзиной, — поэтому `sticky` держит её
           в кадре до самого низа форм, а не отпускает раньше. Это решение
           клиента (не из макета), которое заменило собой более раннее «до
           низа карточки корзины». -->
      <section class="page-x flex gap-[47px] max-xl:flex-col max-xl:gap-0 max-xl:px-0">
        <!-- Ниже `xl` колонка распадается, и порядок в кадре 2225:167283 —
             корзина, СВОДКА, потом «Внесите ваши данные» с формами. Левая
             колонка уходит в `contents`, и три блока встают в ряд сами:
             тот же приём, что у настроек дилерского каталога. -->
        <div class="min-w-0 flex-1 max-xl:contents">
          <div class="overflow-hidden rounded-[var(--radius-l)] border border-divider-light max-xl:order-1 max-md:rounded-none max-md:border-x-0 max-md:border-t-0">
            <!-- panel header 1209:95224 — select-all + delete, print + share.
                 The dealer instance overrides neither control, so «Удалить»
                 renders the master's filler in the frame; it is the same
                 control the customer frame names «Удалить» (see BACKLOG). As
                 there, the 360 frame paints no delete (2029:156847 visible
                 false в 2225:167287). Иконки: 1440 — Bold secondary, 360 — Thin. -->
            <div class="flex items-center justify-between border-b border-divider-light px-6 py-1 max-md:px-4 max-md:py-1.5">
              <div class="flex items-center gap-6">
                <label class="flex items-center gap-3 py-2.5 max-md:gap-2">
                  <input type="checkbox" class="filter-check" data-select-all checked />
                  <span class="text-body-n text-text-primary max-md:text-m-body-n">Выбрать все</span>
                </label>
                <button
                  type="button"
                  class="flex items-center gap-1 text-body-n font-medium text-text-secondary transition-colors hover:text-text-primary max-md:hidden"
                  data-delete-selected
                >
                  <span>Удалить</span>
                  <!-- close-s Bold secondary (981:49820): символ 24 стоит в слоте 20
                       БЕЗ масштаба (container @−2,−2 в 604:24271) — глиф полного
                       размера; сплошной #808080, не тёмный под opacity.
                       Текст — 16/24 Medium (ширина глифа 604:24264). -->
                  <img src="../../assets/header/icon-close-s-secondary.svg" alt="" class="-m-0.5 size-6" />
                </button>
              </div>
              <div class="flex items-center gap-6">
                <button type="button" class="flex size-6 items-center justify-center" aria-label="Распечатать заказ" data-order-print>
                  <img src="../../assets/order/icon-print-bold.svg" alt="" class="size-6 max-md:hidden" />
                  <img src="../../assets/order/icon-print.svg" alt="" class="hidden size-6 max-md:block" />
                </button>
                <button type="button" class="flex size-6 items-center justify-center" data-modal-open="share" aria-label="Поделиться заказом">
                  <img src="../../assets/order/icon-share-bold.svg" alt="" class="size-6 max-md:hidden" />
                  <img src="../../assets/order/icon-share.svg" alt="" class="hidden size-6 max-md:block" />
                </button>
              </div>
            </div>

            <!-- one <article> per line, cloned from partials/cart-card.html -->
            <div data-cart-list></div>

            <p class="hidden px-6 py-16 text-center text-body-n text-text-secondary" data-cart-empty>
              В заказе пока ничего нет.
            </p>
          </div>

          <div class="max-xl:order-3">
          <div class="h-16 max-md:h-10"></div>

          <!-- ==================== ВНЕСИТЕ ВАШИ ДАННЫЕ ==================
               Steps-order 1209:95232 / 2238:157273 — the form's title block.
               На 360 это 40 сверху, 26 заголовок, 8, описание и 40 снизу, потом
               ещё 24 до первой карточки (2238:157274/157280) — то есть 64 под
               описанием. Сверху 40 даёт распорка над блоком, а ещё 16 — нижнее
               поле рамки сводки. -->
          <div class="pb-6 max-xl:px-6 max-md:px-4 max-md:pb-16">
            <h2 class="text-h2 text-text-primary max-md:text-m-h2">Внесите ваши данные</h2>
            <div class="h-2"></div>
            <p class="text-body-n text-text-primary max-md:text-m-body-n">
              Пожалуйста, заполните поля с необходимой информацией и выберите способ оплаты.
            </p>
          </div>

          <!-- ==================== ФОРМА ============================== -->
          <!--#include partials/order-forms.html -->
          </div>
        </div>

        <!-- Итоговая панель плавает вдоль всей левой колонки — выше `md` она
             `sticky` в 24px от верха. -->
        <aside class="w-[322px] shrink-0 self-start xl:sticky xl:top-6 max-xl:order-2 max-xl:w-full max-xl:px-6 max-xl:pb-4 max-xl:pt-4 max-md:px-4">
          <!--#include partials/order-summary.html -->
        </aside>
      </section>

      <div class="h-16 max-md:h-8"></div>

      <!-- ==================== «ВАШ ЗАКАЗ ОТПРАВЛЕН» ==================== -->
      <!--#include partials/order-done.html -->

      <!-- ==================== MOBILE CTA BAR ==========================
           modal-button-container 2225:167295, stacked on the bottom nav. Same
           component as the PDP's, но здесь он ОТКРЕПЛЯЕТСЯ, дойдя до сводки, —
           как на покупательском заказе (просьба клиента 16.09). Раньше он был
           включён всегда, потому что дилерский инстанс сводки на 360
           (2225:202292) рисует только половину `Top`, без кнопки; теперь
           кнопка в панели есть, и бару есть на что передать очередь.
           The frame's label reads «• от 43 335₽»; dealer prices go without
           «от» by the client's decision — see BACKLOG. -->
      <div
        class="fixed inset-x-0 bottom-[72px] z-[41] flex h-[60px] items-center justify-center gap-2 bg-surface-inverted px-4 opacity-0 shadow-navbar transition-opacity duration-200 xl:hidden"
        data-order-bar
        hidden
      >
        <button type="submit" form="dealer-order-form" data-order-submit class="btn btn-m btn-accent w-full text-m-button-m">
          <!-- сумме зарезервировано место под «999 999₽», выключка влево: при
               пересчёте «Сформировать заказ» не ездит (решение клиента 15.09) -->
          <span>Сформировать заказ&nbsp;• <span class="inline-block min-w-[4.6em] text-left" data-summary-total></span></span>
        </button>
      </div>

      <!-- ==================== BOTTOM NAV (mobile) ===================== -->
      <!--#include partials/bottom-nav.html -->

      <!-- ==================== FOOTER ================================== -->
      <!--#include partials/footer.html -->
    </div>

    <!-- ==================== МОДАЛЬНЫЕ ОКНА ============================= -->
    <!--#include partials/modals.html -->
  </body>
</html>
