<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VIVAT — Главная (dealer)</title>
    <!--#include partials/schema-org.html -->
    <!--#include partials/fonts.html -->
    <script type="module" src="./main.js"></script>
  </head>
  <body class="group bg-bg-page text-text-primary" data-user="dealer">
    <!-- Figma dealer/Main 882:107882. Две ширины, один DOM. Своего 360-фрейма
         у дилерской главной нет: мобильная обвязка выведена из дилерского
         каталога 2225:160540, а новости, бургер-меню и подвал собраны без
         фрейма — см. BACKLOG.md. -->
    <div class="w-full max-xl:pb-[72px]">
      <!-- ==================== SITE HEADER ================================ -->
      <!--#include partials/header.html -->

      <!-- ==================== CATALOG MEGA-MENU ========================= -->
      <div data-catalog><!--#include partials/catalog-menu.html --></div>

      <!-- ==================== MOBILE BURGER MENU ======================== -->
      <!-- Оболочка — partials/mobile-menu.html, поведение в mobile-menu.js.
           Набор ссылок дилерский, он приходит из data/dealer-home.js. -->
      <div data-mobile-menu-root><!--#include partials/mobile-menu.html --></div>

      <!-- ==================== SEARCH OVERLAY ============================ -->
      <!--#include partials/search-overlay.html -->

      <!-- ==================== ПРАЙС-ЛИСТ ДИЛЕРА ========================= -->
      <!--#include partials/price-mode.html -->

      <!-- inert <template>s cloned by the sections below -->
      <!--#include partials/product-card.html -->
      <!--#include partials/carousel-section.html -->
      <!--#include partials/promo-card.html -->
      <!--#include partials/news-card.html -->
      <!--#include partials/hero.html -->

      <!-- ==================== ALERT ===================================== -->
      <!--#include partials/alert.html -->

      <!-- ==================== HERO ====================================== -->
      <div data-hero></div>

      <div class="h-10 max-md:hidden"></div>

      <!-- ==================== CATEGORIES ================================ -->
      <!--#include partials/categories.html -->

      <!-- ==================== CAROUSEL: Модульные кухни ================= -->
      <div data-section="modular"></div>

      <!-- ==================== CAROUSEL: Популярные товары =============== -->
      <div data-section="popular"></div>

      <!-- ==================== PROMO: А как вам вот такое ================ -->
      <!--#include partials/promo-row.html -->

      <!-- ==================== CN: Подпишитесь на нас ==================== -->
      <!--#include partials/socials.html -->

      <!-- ==================== CAROUSEL: Акции и скидки ================== -->
      <div data-section="akcii"></div>

      <!-- ==================== Новости =================================== -->
      <!-- На 1440 сетка 3x1 (882:109467) и обе кнопки в строке заголовка.
           На 360 (2432:143658) у блока свой порядок: заголовок 78, рельс из
           320-х карточек 224, отбивка 16 и только потом две кнопки во всю
           ширину — «Все новости» сверху, «Подписаться на рассылку» под ней.
           Поэтому кнопки вынесены из строки заголовка в отдельный блок:
           ниже `md` его двигает `order-last`, а на 1440 он поднимается на
           строку заголовка отрицательным полем в свою же высоту (44).
           Это второе место в проекте, где мобильная раскладка меняет ПОРЯДОК,
           а не оформление, — см. SOLUTIONS.md. -->
      <section class="flex flex-col" data-section="news">
        <div class="page-x">
          <div class="h-20 max-xl:h-16 max-md:h-10"></div>
          <div class="flex items-center md:h-11">
            <h2 class="text-h2 text-text-primary max-md:text-m-h2">Новости</h2>
          </div>
        </div>

        <!-- на 360 обе кнопки в ряд не помещаются: «Подписаться на рассылку»
             рвётся на две строки и вылезает из пилюли, поэтому они стоят
             столбиком. Порядок в кадре обратный порядку разметки, отсюда
             `flex-col-reverse`. -->
        <div class="page-x flex justify-end max-md:order-last max-md:pt-4 md:-mt-11">
          <div class="flex items-center gap-2 max-md:w-full max-md:flex-col-reverse">
            <!-- 360 (2432:144359): текст 14/20, стрелка 20 — светлая 2214:190546 и
                 тёмная 2214:190549; на 1440 — 16/24 и 24 -->
            <a href="#" class="btn btn-m btn-primary max-md:w-full max-md:text-m-button-m" data-news-subscribe data-modal-open="subscribe">
              <span>Подписаться на рассылку</span>
              <img src="../../assets/header/icon-arrow-right-light.svg" alt="" class="size-6 max-md:size-5" />
            </a>
            <a href="news.html" class="btn btn-m btn-secondary max-md:w-full max-md:text-m-button-m">
              <span>Все новости</span>
              <img src="../../assets/header/arrow-right-24.svg" alt="" class="size-6 max-md:hidden" />
              <img src="../../assets/header/arrow-right-20.svg" alt="" class="hidden size-5 max-md:block" />
            </a>
          </div>
        </div>

        <div class="h-6 max-md:h-3"></div>

        <div
          class="page-x max-md:scroll-rail max-md:snap-x max-md:snap-proximity max-md:scroll-pl-4 max-md:overflow-x-auto"
          data-viewport
        >
          <div
            class="grid grid-cols-3 gap-6 max-xl:grid-cols-2 max-md:flex max-md:gap-3 max-md:*:w-[320px] max-md:*:shrink-0 max-md:*:snap-start"
            data-news-track
          ></div>
        </div>
        <!-- полосы прокрутки под новостями в кадре 360 нет (2432:143658:
             заголовок 78, карточки 224, отбивка 16, кнопки 96) -->
        <div class="hidden">
          <div class="scroll-progress" data-progress><span><i></i></span></div>
        </div>
      </section>

      <div class="h-24 max-xl:h-16 max-md:hidden"></div>

      <!-- ==================== Наши салоны + карта ======================= -->
      <div data-section="salony"><!--#include partials/stores.html --></div>

      <!-- ==================== Производство ============================== -->
      <!--#include partials/production.html -->

      <!-- ==================== FOOTER ==================================== -->
      <!--#include partials/footer.html -->

      <!-- ==================== BOTTOM NAV (max-md) ======================= -->
      <!--#include partials/bottom-nav.html -->
    </div>

    <!-- ==================== МОДАЛЬНЫЕ ОКНА ============================= -->
    <!--#include partials/modals.html -->
  </body>
</html>
