<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VIVAT — Новости (dealer)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@100;400;500;600&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="./news.js"></script>
  </head>
  <body class="group bg-bg-page text-text-primary" data-user="dealer">
    <!-- «Новости» — контентная страница дилерского раздела.
         1440 — Figma novosti 1463:67081, 360 — 2241:188212.

         Заголовок, ряд рубрик, зелёная плашка подписки и список из двадцати
         новостей с пагинацией. Кнопка «Подписаться» открывает готовую модалку
         подписки. Рубрики фильтруют список — своих кадров у них нет, поэтому
         это шов (см. BACKLOG). -->
    <div class="mx-auto w-full max-md:pb-[72px] md:w-[1440px]">
      <!-- ==================== SITE HEADER ============================== -->
      <!--#include partials/header.html -->

      <!-- ==================== CATALOG MEGA-MENU ======================== -->
      <div data-catalog><!--#include partials/catalog-menu.html --></div>

      <!-- ==================== MOBILE BURGER MENU ======================= -->
      <div data-mobile-menu-root><!--#include partials/mobile-menu.html --></div>

      <!-- ==================== SEARCH OVERLAY ============================ -->
      <!--#include partials/search-overlay.html -->

      <!-- ==================== ПРАЙС-ЛИСТ ДИЛЕРА ========================= -->
      <!--#include partials/price-mode.html -->

      <!-- <template>ы, которые клонируются в колонку ниже -->
      

      <!-- ==================== ЗАГОЛОВОК РАЗДЕЛА ========================
           title-block 1167:79694 — spacing 24, строка 44, spacing 24. -->
      <div class="px-10 py-6 max-md:hidden">
        <div class="flex h-11 items-center">
          <h1 class="text-h1 text-text-primary">Для бизнеса</h1>
        </div>
      </div>

      <!-- ==================== ШАПКА РАЗДЕЛА НА 360 =====================
           Ниже md заголовочный блок и левое меню заменяются этим блоком
           (2225:132266, 104): «Для бизнеса» и селектор с именем страницы. -->
      <!--#include partials/for-business-header.html -->

      <!-- Отбивка 96 между заголовком раздела и колонкой: у «Новостей» она
           есть (spacing 1463:67208), у остальных страниц секции нет. -->
      <div class="h-24 max-md:hidden"></div>

      <!-- ==================== МЕНЮ + КОЛОНКА ===========================
           general-container 1167:79696 — 40 + 298 + 40 + 1022 + 40 = 1440. -->
      <div class="flex gap-10 px-10 max-md:flex-col max-md:gap-0 max-md:px-0">
        <!--#include partials/menu-b2b.html -->

        <div class="w-[1022px] px-20 max-md:w-full max-md:px-4" data-content-column>
          <!-- title-text-page 1463:67088 — 862×36, без верхней отбивки -->
          <h2 class="text-h2 text-text-primary max-md:hidden">Новости</h2>

          <!-- Tab 1944:372179 — рубрики, 862×48: коробка таба 28 и по 10
               сверху и снизу, зазор 24. Ниже md этот ряд переезжает в шапку
               раздела (2241:188715, та же третья часть, что у «Для
               интернет-магазинов»), поэтому здесь он скрыт. -->
          <div
            class="scroll-rail flex gap-6 overflow-x-auto py-[10px] max-md:hidden"
            data-news-tabs
          ></div>

          <div class="h-4"></div>

          <!-- social 1463:70256 — плашка подписки 862×124 на #a4cebf:
               отступы 40/32, заголовок 24/28 SemiBold, строка под ним 20/32
               Regular, кнопка большая (56). -->
          <div
            class="flex items-center justify-between gap-4 rounded-[var(--radius-l)] bg-surface-accent-alt-subtle px-10 py-8 max-md:flex-col max-md:items-center max-md:gap-4 max-md:px-4 max-md:py-4"
          >
            <div class="max-md:text-center">
              <p class="text-h3 text-text-primary max-md:text-m-h3">Подпишитесь на рассылку</p>
              <p class="text-body-l text-text-primary max-md:text-m-body-l">чтобы быть всегда в курсе!</p>
            </div>
            <button
              type="button"
              class="btn btn-l btn-primary shrink-0 max-md:h-11 max-md:w-full max-md:text-m-button-m"
              data-modal-open="subscribe"
            >
              Подписаться
            </button>
          </div>

          <!-- news-content 1463:67089 — двадцать новостей -->
          <div class="flex flex-col" data-news></div>

          <!-- На 360 постранички нет: в кадре (2241:188215) за списком сразу
               идёт отбивка и подвал. -->
          <div class="max-md:hidden">
            <!--#include partials/pagination.html -->
          </div>
        </div>
      </div>

      <div class="h-24 max-md:h-20"></div>

      <!-- ==================== BOTTOM NAV (mobile) ===================== -->
      <!--#include partials/bottom-nav.html -->

      <!-- ==================== FOOTER ================================== -->
      <!--#include partials/footer.html -->
    </div>

    <!-- одна новость (future @foreach($news as $n)) — Figma `news-item`
         1463:70349, layout=list: заголовок, дата, тело и ссылка со стрелкой.
         Отбивка блока 24 сверху и снизу.

         В derivedSymbolData дата идёт последней, но нарисована она сразу под
         заголовком — порядок в раскладке не порядок на экране. -->
    <template data-news-item>
      <!-- У новости снизу линия #cbcbcb (мастер 1463:70349 и мобильный
           1821:326563 — `borderBottomWeight: 1`). Обводка в Figma внутренняя,
           поэтому это внутренняя тень: коробка остаётся 24 + содержимое + 24,
           а `border-b` добавил бы пиксель сверх. -->
      <article class="flex flex-col py-6 shadow-[inset_0_-1px_0_var(--color-border-default)]">
        <p class="text-h3 text-text-primary max-md:text-m-h3" data-news-title></p>
        <span class="pt-2 text-body-s text-text-secondary max-md:text-m-body-s" data-news-date></span>
        <!-- `description` 1463:70358 — абзацы одним текстовым блоком, между
             ними 8 (paragraphSpacing), а не 12; на 360 (1821:326574) отбивки
             между абзацами нет вовсе, как и в «Как с нами работать». -->
        <div
          class="flex flex-col gap-2 pt-3 text-body-n text-text-primary max-md:gap-0 max-md:text-m-body-n"
          data-news-body
        ></div>
        <!-- `phones` 1463:70510 — «Телефоны для связи:» и номера под ним;
             есть у девяти новостей из двадцати. Второй столбец мастера
             («Консультация» с графиком) не разложен ни в одном инстансе. -->
        <div class="flex flex-col gap-2 pt-3" data-news-phones hidden>
          <!-- Подпись: 16 обычного начертания в строке 22. В .fig у стиля
               стоит Medium, но живой рендер даёт ту же толщину штриха, что у
               номеров под ней (Figma старше снимка — см. CLAUDE.md о цвете);
               интерлиньяж при этом 22, а не 24, иначе блок телефонов растёт
               с 82 до 84. -->
          <p class="text-body-n leading-[22px] text-text-primary max-md:text-m-body-n max-md:leading-5">
            Телефоны для связи:
          </p>
          <div class="flex flex-col gap-1 text-body-n text-text-primary max-md:text-m-body-n" data-news-phone-list></div>
        </div>
        <!-- `text-action` 585:27809 — подпись, зазор 4 и стрелка 20 -->
        <a
          href="#"
          class="mt-3 flex h-8 w-fit items-center gap-1 text-body-n text-text-primary"
          data-news-action
        >
          <span></span>
          <img src="../../assets/header/arrow-right-20.svg" alt="" class="size-5" />
        </a>
      </article>
    </template>

    <!-- ==================== МОДАЛЬНЫЕ ОКНА ============================= -->
    <!--#include partials/modals.html -->
  </body>
</html>
