<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VIVAT — Доставка (dealer)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="./delivery.js"></script>
  </head>
  <body class="group bg-bg-page text-text-primary" data-user="dealer">
    <!-- Доставка — контентная страница дилерского раздела. 1440 — Figma
         dostavka 1167:79692, 360 — 2225:132262.

         Это первая из одиннадцати страниц секции `B2b additional`, и оболочка
         у них общая: заголовок раздела, general-container из меню и колонки,
         отбивка 96, подвал. Оболочка живёт разметкой самой страницы — включения
         в этом проекте не умеют оборачивать тело, а весь реальный объём в меню,
         которое партиалом стало. См. docs/superpowers/specs/2026-08-17-*.

         Заголовок раздела — «Для бизнеса», собственное имя страницы стоит
         первой строкой правой колонки. Фрейм `buttons` в заголовочном блоке
         отрисовывается пустым; кнопки там нет. -->
    <div class="mx-auto w-full max-md:pb-[72px] md:w-[1440px]">
      <!-- ==================== SITE HEADER ============================== -->
      <!--#include partials/header.html -->

      <!-- ==================== CATALOG MEGA-MENU ======================== -->
      <div data-catalog><!--#include partials/catalog-menu.html --></div>

      <!-- ==================== MOBILE BURGER MENU ======================= -->
      <div data-mobile-menu-root><!--#include partials/mobile-menu.html --></div>

      <!-- ==================== SEARCH OVERLAY ============================ -->
      <!--#include partials/search-overlay.html -->

      <!-- ==================== ПРАЙС-ЛИСТ ДИЛЕРА ========================= -->
      <!--#include partials/price-mode.html -->

      <!-- ==================== ЗАГОЛОВОК РАЗДЕЛА ========================
           title-block 1167:79694 — spacing 24, строка 44, spacing 24. -->
      <div class="px-10 py-6 max-md:hidden">
        <div class="flex h-11 items-center">
          <h1 class="text-h1 text-text-primary">Для бизнеса</h1>
        </div>
      </div>

      <!-- ==================== МЕНЮ + КОЛОНКА ===========================
           general-container 1167:79696 — 40 + 298 + 40 + 1022 + 40 = 1440. -->
      <div class="flex gap-10 px-10 max-md:flex-col max-md:gap-0 max-md:px-0">
        <!--#include partials/menu-b2b.html -->

        <div class="w-[1022px] px-20 max-md:w-full max-md:px-4" data-content-column>
          <h2 class="text-h2 text-text-primary max-md:hidden">Доставка</h2>
        </div>
      </div>

      <div class="h-24 max-md:h-20"></div>

      <!-- ==================== BOTTOM NAV (mobile) ===================== -->
      <!--#include partials/bottom-nav.html -->

      <!-- ==================== FOOTER ================================== -->
      <!--#include partials/footer.html -->
    </div>

    <!-- ==================== МОДАЛЬНЫЕ ОКНА ============================= -->
    <!--#include partials/modals.html -->
  </body>
</html>
