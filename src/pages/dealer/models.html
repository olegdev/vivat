<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VIVAT — Каталог 3D-моделей (dealer)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@100;400;500;600&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="./models.js"></script>
  </head>
  <body class="group bg-bg-page text-text-primary" data-user="dealer">
    <!-- «Каталог 3D-моделей» — Figma Catalog-default 2338:254259 (1440) и
         catalog 2338:254303 (360).

         В карте фрейм назван «Каталог (вариант)», и он действительно повторяет
         дилерский каталог нода в ноду — кроме карточки: здесь компонент `3D`
         322×418 с рендером, строкой формата, образцами цветов и «Скачать».
         Левого меню раздела у него нет, поэтому это не контентная страница,
         а каталог.

         Фильтры и сортировка не подключены: карточки в макете — филлер (все
         тридцать с одним заголовком), а шторки фильтров для этого фрейма нет.
         См. BACKLOG. -->
    <div class="w-full max-xl:pb-[72px]">
      <!-- ==================== SITE HEADER ============================== -->
      <!--#include partials/header.html -->

      <!-- ==================== CATALOG MEGA-MENU ======================== -->
      <div data-catalog><!--#include partials/catalog-menu.html --></div>

      <!-- ==================== MOBILE BURGER MENU ======================= -->
      <div data-mobile-menu-root><!--#include partials/mobile-menu.html --></div>

      <!-- ==================== SEARCH OVERLAY ============================ -->
      <!--#include partials/search-overlay.html -->

      <!-- ==================== ПРАЙС-ЛИСТ ДИЛЕРА ========================= -->
      <!--#include partials/price-mode.html -->

      <!-- <template>ы карусели «Популярные товары» -->
      <!--#include partials/product-card.html -->
      <!--#include partials/carousel-section.html -->

      <!-- <template>ы, которые клонируются в колонку ниже -->
      

      <!-- Крошки 56 (2338:254261) и заголовок 44 (2338:254262). Имя страницы
           в кадре — «3D модели», а не «Каталог 3D-моделей»: так набраны и
           последняя крошка, и H1.

           Ниже md (2338:254303) остаются **крошки**, а заголовка нет вовсе —
           наоборот к дилерскому каталогу, где нет ни того, ни другого. -->
      <div class="px-10 max-md:px-4">
        <nav class="flex items-center gap-2 py-4 text-body-n-accent leading-6 text-text-secondary max-md:py-2 max-md:text-m-body-s">
          <a href="main.html" class="transition-colors hover:text-text-primary">Главная</a>
          <span aria-hidden="true">•</span>
          <span class="text-text-primary">3D модели</span>
        </nav>
        <h1 class="flex h-11 items-center text-h1 text-text-primary max-md:hidden">3D модели</h1>
      </div>

      <!-- catalog-settings 2338:254262 — воронка и пилюли, без чипсов -->
      <div class="flex items-center gap-2 px-10 py-6 max-md:px-4 max-md:py-3">
        <button
          type="button"
          data-filter-open
          class="filter-funnel flex h-11 shrink-0 items-center"
          aria-label="Открыть фильтры"
        >
          <span class="filter-funnel__circle">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M13 12c2.209 0 4 1.791 4 4s-1.791 4-4 4a4.002 4.002 0 0 1-3.876-3.009A1 1 0 0 1 9 17H3a1 1 0 1 1 0-2h6c.042 0 .083.003.124.008A4.002 4.002 0 0 1 13 12Zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z" />
              <path d="M21 15a1 1 0 1 1 0 2h-2a1 1 0 1 1 0-2h2Z" />
              <path fill-rule="evenodd" clip-rule="evenodd" d="M10 2c2.209 0 4 1.791 4 4s-1.791 4-4 4a4.002 4.002 0 0 1-3.876-3.009A1 1 0 0 1 6 7H3a1 1 0 0 1 0-2h3c.042 0 .083.003.124.008A4.002 4.002 0 0 1 10 2Zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z" />
              <path d="M21 5a1 1 0 1 1 0 2h-5a1 1 0 1 1 0-2h5Z" />
            </svg>
          </span>
          <span data-filter-badge class="badge-number badge-number--outline -ml-3 hidden self-start">0</span>
        </button>
        <!-- Пилюли те же шесть, что у каталога (882:89341): Коллекция, Форма
             кухни, Фасады, Цвет, Стиль, Цена. Сортировки в этом кадре нет. -->
        <button type="button" data-filter-open="collection" data-filter-pill="collection" class="filter-pill btn btn-m border border-border-light bg-surface-inverted text-text-primary hover:bg-components-subtle-hover max-md:hidden">Коллекция<span data-pill-count class="hidden text-text-muted"></span></button>
        <button type="button" data-filter-open="form" data-filter-pill="form" class="filter-pill btn btn-m border border-border-light bg-surface-inverted text-text-primary hover:bg-components-subtle-hover max-md:hidden">Форма кухни<span data-pill-count class="hidden text-text-muted"></span></button>
        <button type="button" data-filter-open="facade" data-filter-pill="facade" class="filter-pill btn btn-m border border-border-light bg-surface-inverted text-text-primary hover:bg-components-subtle-hover max-md:hidden">Фасады<span data-pill-count class="hidden text-text-muted"></span></button>
        <button type="button" data-filter-open="color" data-filter-pill="color" class="filter-pill btn btn-m border border-border-light bg-surface-inverted text-text-primary hover:bg-components-subtle-hover max-md:hidden">Цвет<span data-pill-count class="hidden text-text-muted"></span></button>
        <button type="button" data-filter-open="style" data-filter-pill="style" class="filter-pill btn btn-m border border-border-light bg-surface-inverted text-text-primary hover:bg-components-subtle-hover max-md:hidden">Стиль<span data-pill-count class="hidden text-text-muted"></span></button>
        <button type="button" data-filter-open="price" data-filter-pill="price" class="filter-pill btn btn-m border border-border-light bg-surface-inverted text-text-primary hover:bg-components-subtle-hover max-md:hidden">Цена<span data-pill-count class="hidden text-text-muted"></span></button>
      </div>

      <!-- сетка: карточка 322, четыре в ряд на 1440 и две на 360 -->
      <!-- products 2338:254264 — 4 × 322 с зазором 24 на 1440; на 360
           (2338:254306) две колонки по 168, зазор 8 и поля 8. -->
      <div class="grid grid-cols-4 gap-6 px-10 max-md:grid-cols-2 max-md:gap-2 max-md:px-2" data-models></div>

      <!--#include partials/pagination.html -->

      <!-- ==================== CAROUSEL: Популярные товары =============
           Блок `H2` 2338:254296 (360 — 2338:254338…254341): тот же рельс с
           сегментами, что закрывает каталог, и та же копия. -->
      <div data-section="popular"></div>

      <div class="h-20 max-md:h-8"></div>

      <!--#include partials/seo-kitchens.html -->

      <div class="h-24 max-md:h-20"></div>

      <!-- ==================== BOTTOM NAV (mobile) ===================== -->
      <!--#include partials/bottom-nav.html -->

      <!-- ==================== FOOTER ================================== -->
      <!--#include partials/footer.html -->
    </div>

    <!-- одна карточка 3D-модели (future @foreach($models as $m)) — Figma `3D`
         2338:259535, 322×418: рендер с индикатором, название, строка формата,
         образцы цветов и «Скачать». -->
    <!-- Карточка `3D` 2338:259414 — снимок 322×242 без скругления и Info 152:
         отступы 4/12, зазор 4, название и характеристики оба 16/24 (второе
         серым), палитра 28 в коробке 36, ссылка «Скачать» 32 со стрелкой вниз
         (`arrow-down` 961:37194 — тот же арроу, что справа, повёрнутый). -->
    <template data-model-card>
      <article class="flex flex-col" data-card>
        <!-- Снимок 322×242 с галереей: в макете у карточки три кадра и ряд
             точек по низу (`carousel` 2338:259420, 322×16 на 226). Разметка та
             же, что у товарной карточки, и наполняет её тот же fillGallery. -->
        <div class="relative w-full overflow-hidden bg-bg-subtle">
          <div
            class="relative aspect-[322/242] w-full touch-pan-y overflow-hidden"
            data-card-gallery
          >
            <div
              class="flex h-full w-full bg-bg-subtle transition-transform duration-300 ease-out will-change-transform"
              data-card-track
            ></div>
            <div class="card-zones" data-card-zones></div>
          </div>
          <div
            class="pointer-events-none absolute inset-x-0 bottom-0 flex items-center justify-center gap-2 px-2 [&>*]:pointer-events-auto"
            data-card-dots
          ></div>
        </div>
        <div class="flex flex-col gap-1 px-1 py-3">
          <p class="text-body-n text-text-primary max-md:text-m-body-n" data-model-title></p>
          <p class="text-body-n text-text-secondary max-md:text-m-body-n" data-model-spec></p>
          <div class="flex items-center gap-2 py-1 max-md:gap-1" data-model-swatches>
            <span class="size-7 rounded-full border border-border-subtle bg-[#a98a63] max-md:size-[18px]"></span>
            <span class="size-7 rounded-full border border-border-subtle bg-[#d9d9d9] max-md:size-[18px]"></span>
            <span class="size-7 rounded-full border border-border-subtle bg-surface-inverted max-md:size-[18px]"></span>
          </div>
          <a
            href="#"
            class="link-dotted flex h-8 w-fit items-center gap-1 text-body-n text-text-primary"
            data-model-action
          >
            <span></span>
            <img src="../../assets/header/arrow-right-20.svg" alt="" class="size-4 rotate-90" />
          </a>
        </div>
      </article>
    </template>

    <!-- одна карточка декора (future @foreach($decors as $d)) -->
    <template data-decor-card>
      <article class="flex flex-col">
        <img class="aspect-[207/155] w-full object-cover" alt="" data-decor-img />
        <p class="px-1 py-3 text-body-s leading-6 text-text-primary max-md:text-m-body-n" data-decor-name></p>
      </article>
    </template>

    <!-- ==================== ШТОРКА ФИЛЬТРОВ ============================
         Своей шторки кадр «3D-моделей» не рисует, но пилюли в панели те же
         шесть, что у каталога (882:89341), и группы каталожной шторки с ними
         совпадают один в один — поэтому здесь стоит она. Ряда чипсов в кадре
         нет, занятые группы показывают счётчики на пилюлях и бейдж воронки. -->
    <!--#include partials/catalog-filters.html -->

    <!-- ==================== МОДАЛЬНЫЕ ОКНА ============================= -->
    <!--#include partials/modals.html -->
  </body>
</html>
